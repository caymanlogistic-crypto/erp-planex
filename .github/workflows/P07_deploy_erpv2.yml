name: P07 Deploy isolated ERPV2

on:
  push:
    branches:
      - chatgpt/production-stabilization-20260802
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-deploy
  cancel-in-progress: false

jobs:
  deploy-erpv2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build and verify code artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="P07_erpv2_${GITHUB_SHA}.tar.gz"
          git archive --format=tar --output=P07_erpv2.tar "${GITHUB_SHA}" -- \
            app bootstrap config database public scripts tools tests
          gzip -n P07_erpv2.tar
          mv P07_erpv2.tar.gz "${artifact}"

          listing="P07_erpv2_${GITHUB_SHA}_listing.txt"
          tar -tzf "${artifact}" > "${listing}"
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|tmp|logs|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|reports)(/|$)' "${listing}"; then
            echo "Forbidden path in artifact" >&2
            exit 1
          fi
          if grep -E '(^|/)(runtime[-_]?fixtures?|.*credential.*)(/|$)' "${listing}"; then
            echo "Forbidden runtime fixture or credential path in artifact" >&2
            exit 1
          fi

          sha256=$(sha256sum "${artifact}" | awk '{print $1}')
          printf 'artifact=%s\n' "${artifact}" >> "${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Configure isolated SSH credentials
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PRIVATE_KEY}" > "${HOME}/.ssh/P07_erpv2_deploy"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P07_erpv2_deploy" "${HOME}/.ssh/known_hosts"

      - name: Upload private artifact
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P07_artifact_${GITHUB_SHA}.tar.gz"
          scp -P "${SSH_PORT}" -i "${HOME}/.ssh/P07_erpv2_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${ARTIFACT}" "${SSH_USER}@${SSH_HOST}:${remote}"

      - name: Deploy and verify isolated ERPV2
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P07_artifact_${GITHUB_SHA}.tar.gz"
          ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P07_erpv2_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '${remote}' '${ARTIFACT_SHA}' '${GITHUB_SHA}'"

          ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P07_erpv2_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "test \"\$(cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt)\" = '${GITHUB_SHA}'"

          ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P07_erpv2_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" "rm -f '${remote}'"
