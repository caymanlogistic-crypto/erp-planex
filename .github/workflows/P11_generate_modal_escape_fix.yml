name: P11 Generate modal Escape fix

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/P11_generate_modal_escape_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current production-stabilization head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/production-stabilization-20260802
          fetch-depth: 0

      - name: Apply centralized modal keyboard fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          modal_path = Path('public/assets/js/modal-shell.js')
          content = modal_path.read_text(encoding='utf-8')
          content = content.replace("el.dataset.closeOnEscape = '0';", "el.dataset.closeOnEscape = '1';")
          content = content.replace("c.dataset.closeOnEscape = '0';", "c.dataset.closeOnEscape = '1';")

          marker = '// P11 Full HD keyboard contract: Escape closes only the topmost visible modal.'
          if marker not in content:
              content = content.rstrip() + '''\n\n// P11 Full HD keyboard contract: Escape closes only the topmost visible modal.\n// Legacy data-close-on-escape=\"0\" values are intentionally overridden.\n// A modal that must remain locked must opt in explicitly with data-escape-locked=\"1\".\n(function initErpModalKeyboardController() {\n    'use strict';\n\n    if (window.__erpModalKeyboardControllerReady) return;\n    window.__erpModalKeyboardControllerReady = true;\n\n    function isVisible(modal) {\n        if (!modal || !modal.classList.contains('is-open')) return false;\n        var style = window.getComputedStyle(modal);\n        return style.display !== 'none' && style.visibility !== 'hidden';\n    }\n\n    function zIndexOf(modal) {\n        var parsed = parseInt(window.getComputedStyle(modal).zIndex, 10);\n        return Number.isFinite(parsed) ? parsed : 0;\n    }\n\n    function topmostOpenModal() {\n        var modals = Array.prototype.filter.call(\n            document.querySelectorAll('.modal-overlay.is-open'),\n            isVisible\n        );\n\n        return modals.reduce(function (top, candidate) {\n            if (!top) return candidate;\n            var topZ = zIndexOf(top);\n            var candidateZ = zIndexOf(candidate);\n            if (candidateZ > topZ) return candidate;\n            if (candidateZ < topZ) return top;\n            return (top.compareDocumentPosition(candidate) & Node.DOCUMENT_POSITION_FOLLOWING)\n                ? candidate\n                : top;\n        }, null);\n    }\n\n    function closeTopmostModal(modal) {\n        if (!modal) return;\n        if (modal.id && typeof window.closeModal === 'function') {\n            window.closeModal(modal.id);\n            return;\n        }\n        modal.classList.remove('is-open');\n        modal.setAttribute('aria-hidden', 'true');\n    }\n\n    document.addEventListener('keydown', function (event) {\n        if (event.key !== 'Escape' || event.defaultPrevented || event.isComposing) return;\n\n        var modal = topmostOpenModal();\n        if (!modal || modal.dataset.escapeLocked === '1') return;\n\n        event.preventDefault();\n        event.stopImmediatePropagation();\n        closeTopmostModal(modal);\n    }, true);\n})();\n'''

          modal_path.write_text(content, encoding='utf-8', newline='\n')

          test_path = Path('tests/p11_modal_escape_contract_test.php')
          test_path.write_text(r'''<?php
          if (PHP_SAPI !== 'cli') {
              http_response_code(404);
              exit;
          }

          $checks = [];
          $pass = 0;
          $fail = 0;

          function p11Check(string $name, bool $condition, string $detail = ''): void
          {
              global $checks, $pass, $fail;
              $checks[] = [$name, $condition, $detail];
              if ($condition) {
                  $pass++;
              } else {
                  $fail++;
              }
          }

          $modalShellPath = __DIR__ . '/../public/assets/js/modal-shell.js';
          $layoutPath = __DIR__ . '/../app/View/layouts/main.php';
          $modalShell = file_get_contents($modalShellPath);
          $layout = file_get_contents($layoutPath);

          p11Check('ModalShell is loaded by the main layout', str_contains($layout, '/assets/js/modal-shell.js'));
          p11Check('Central keyboard controller exists', str_contains($modalShell, 'initErpModalKeyboardController'));
          p11Check('Escape listener uses capture phase', preg_match("/addEventListener\\('keydown'.*?,\\s*true\\);/s", $modalShell) === 1);
          p11Check('Only the topmost open modal is selected', str_contains($modalShell, 'topmostOpenModal'));
          p11Check('Escape is prevented after a modal is resolved', str_contains($modalShell, 'event.preventDefault()'));
          p11Check('Legacy bubble handlers cannot close parent modals', str_contains($modalShell, 'event.stopImmediatePropagation()'));
          p11Check('Explicit hard lock has a dedicated attribute', str_contains($modalShell, "modal.dataset.escapeLocked === '1'"));
          p11Check('Controller closes through the shared closeModal API', str_contains($modalShell, 'window.closeModal(modal.id)'));
          p11Check('Generated view modal allows Escape', str_contains($modalShell, "el.dataset.closeOnEscape = '1';"));
          p11Check('Generated confirmation modal allows Escape', str_contains($modalShell, "c.dataset.closeOnEscape = '1';"));
          p11Check('Generated ModalShell no longer defaults Escape to zero', !str_contains($modalShell, "dataset.closeOnEscape = '0';"));

          echo "=== P11 Modal Escape Contract ===\n";
          foreach ($checks as [$name, $ok, $detail]) {
              echo ($ok ? 'PASS' : 'FAIL') . ' - ' . $name;
              if ($detail !== '') echo ': ' . $detail;
              echo "\n";
          }
          echo "TOTAL={$pass}; FAILED={$fail}\n";
          exit($fail === 0 ? 0 : 1);
          ''', encoding='utf-8', newline='\n')
          PY

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          node --check public/assets/js/modal-shell.js
          php -l tests/p11_modal_escape_contract_test.php
          php tests/p11_modal_escape_contract_test.php
          if [ -f tools/architecture_guard.php ]; then php tools/architecture_guard.php; fi
          git diff --check
          python <<'PY'
          from pathlib import Path
          files = [Path('public/assets/js/modal-shell.js'), Path('tests/p11_modal_escape_contract_test.php')]
          bad = []
          for path in files:
              raw = path.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  bad.append(f'{path}: UTF-8 BOM')
              text = raw.decode('utf-8')
              for token in ('Рџ', 'РЎ', 'Ð', 'Ñ', '�'):
                  if token in text:
                      bad.append(f'{path}: mojibake token {token}')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
          if grep -nEi '(password\s*=|api[_-]?key\s*=|secret\s*=|BEGIN [A-Z ]*PRIVATE KEY)' public/assets/js/modal-shell.js tests/p11_modal_escape_contract_test.php; then
            echo 'Potential secret in changed files' >&2
            exit 1
          fi

      - name: Create generated fix commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P11 QA automation'
          git config user.email 'p11-qa@users.noreply.github.com'
          git add public/assets/js/modal-shell.js tests/p11_modal_escape_contract_test.php
          git commit -m 'fix(P11): close topmost modal with Escape'
          git push origin HEAD:refs/heads/p11-generated-modal-escape-fix
          git rev-parse HEAD | tee P11_generated_fix_commit.txt

      - name: Upload generated commit evidence
        uses: actions/upload-artifact@v4
        with:
          name: P11_generated_modal_escape_fix
          path: P11_generated_fix_commit.txt
          retention-days: 1
