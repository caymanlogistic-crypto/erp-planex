name: P15 Linear Trip Save Runtime

on:
  push:
    branches:
      - chatgpt/p14-runtime-verification-2
    paths:
      - '.github/p14/**'
      - '.github/workflows/P14_linear_trip_edit_runtime.yml'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/p14/**'
      - '.github/workflows/P14_linear_trip_edit_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P14_BASE_URL: https://plan-ex.ru/erpv2/
  P14_OUT_DIR: P14_output

jobs:
  linear-trip-save-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Resolve runtime credentials securely
        shell: bash
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PRIVATE_KEY}" > "${HOME}/.ssh/P15_erpv2_audit"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P15_erpv2_audit" "${HOME}/.ssh/known_hosts"
          if [ -z "${credentials}" ] && [ -f .github/p11/P11_runtime_credentials.enc.json ]; then
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "${HOME}/.ssh/P15_erpv2_audit" --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          if [ -z "${credentials}" ]; then
            credentials="$(ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P15_erpv2_audit" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "test -f /home/s/spugovxsim/planexp/deploy/P11_runtime_credentials.b64 && cat /home/s/spugovxsim/planexp/deploy/P11_runtime_credentials.b64 || true")"
          fi
          if [ -z "${credentials}" ]; then
            echo "Runtime credentials are unavailable."
            exit 2
          fi
          echo "::add-mask::${credentials}"
          printf 'P11_CREDENTIALS_B64=%s\n' "${credentials}" >> "${GITHUB_ENV}"

      - name: Wait for exact production deployment
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          target="$(git ls-remote origin refs/heads/chatgpt/production-stabilization-20260802 | awk '{print $1}')"
          if [ -z "${target}" ]; then
            echo 'Unable to resolve production branch HEAD.' >&2
            exit 1
          fi
          echo "TARGET_PRODUCTION_HEAD=${target}"
          deployed=''
          for attempt in $(seq 1 60); do
            deployed="$(ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P15_erpv2_audit" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt 2>/dev/null || true")"
            echo "DEPLOY_WAIT attempt=${attempt} deployed=${deployed:-none}"
            if [ "${deployed}" = "${target}" ]; then
              printf 'P15_DEPLOYED_COMMIT=%s\n' "${deployed}" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not reach ${target}; last deployed=${deployed:-none}." >&2
          exit 1

      - name: Verify unchanged authenticated linear trip save
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/p14/P14_linear_trip_edit_runtime.js
          node .github/p14/P14_linear_trip_edit_runtime.js | tee P15_runtime_console.json

      - name: Collect recent P15 server error
        if: failure()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P15_erpv2_audit" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
            "log=/home/s/spugovxsim/planexp/public_html/erpv2/storage/logs/P15_linear_trip_save_errors.log; if [ -f \"\$log\" ]; then tail -n 10 \"\$log\"; else echo P15_LOG_NOT_FOUND; fi" \
            | tee P15_server_error.txt

      - name: Upload P15 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P15_linear_trip_save_runtime_${{ github.sha }}
          path: |
            P14_output/
            P15_runtime_console.json
            P15_server_error.txt
          if-no-files-found: warn
          retention-days: 30
