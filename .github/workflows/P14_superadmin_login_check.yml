name: P14 Superadmin Login Check

on:
  push:
    branches:
      - chatgpt/p14-browser-audit-20260805
    paths:
      - '.github/workflows/P14_superadmin_login_check.yml'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/P14_superadmin_login_check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superadmin-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P14_OUT: P14_superadmin_login_output
    steps:
      - name: Checkout P14 audit branch
        uses: actions/checkout@v4

      - name: Check required GitHub Secrets
        id: secret_gate
        shell: bash
        env:
          P14_SUPERADMIN_USERNAME: ${{ secrets.P14_SUPERADMIN_USERNAME }}
          P14_SUPERADMIN_PASSWORD: ${{ secrets.P14_SUPERADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${P14_OUT}"
          if [ -z "${P14_SUPERADMIN_USERNAME:-}" ] || [ -z "${P14_SUPERADMIN_PASSWORD:-}" ]; then
            printf '%s\n' '{"status":"P14_BLOCKED_GITHUB_SECRETS_REQUIRED","requiredSecrets":["P14_SUPERADMIN_USERNAME","P14_SUPERADMIN_PASSWORD"]}' > "${P14_OUT}/P14_superadmin_login_result.json"
            echo 'available=false' >> "${GITHUB_OUTPUT}"
            echo 'P14_BLOCKED_GITHUB_SECRETS_REQUIRED'
          else
            echo "::add-mask::${P14_SUPERADMIN_USERNAME}"
            echo "::add-mask::${P14_SUPERADMIN_PASSWORD}"
            echo 'available=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure Node
        if: steps.secret_gate.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        if: steps.secret_gate.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Execute protected SUPERADMIN login check
        if: steps.secret_gate.outputs.available == 'true'
        shell: bash
        env:
          P14_SUPERADMIN_USERNAME: ${{ secrets.P14_SUPERADMIN_USERNAME }}
          P14_SUPERADMIN_PASSWORD: ${{ secrets.P14_SUPERADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::${P14_SUPERADMIN_USERNAME}"
          echo "::add-mask::${P14_SUPERADMIN_PASSWORD}"
          cat > /tmp/P14_superadmin_login_check.js <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');
          const BASE = 'https://plan-ex.ru/erpv2/';
          const OUT = path.resolve(process.env.P14_OUT || 'P14_superadmin_login_output');
          fs.mkdirSync(OUT, { recursive: true });
          const result = {
            status: 'FAIL',
            loginHttpStatus: null,
            finalUrlAfterLogin: null,
            superadminUiPresent: false,
            protectedPages: [],
            sameBrowserContext: true,
            consoleErrors: [],
            pageErrors: [],
            requestFailures: [],
            badResponses: [],
            screenshot: null,
            error: null
          };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1920, height: 1080 },
              deviceScaleFactor: 1,
              locale: 'ru-RU',
              timezoneId: 'Europe/Moscow'
            });
            const page = await context.newPage();
            page.on('console', m => { if (m.type() === 'error') result.consoleErrors.push(m.text()); });
            page.on('pageerror', e => result.pageErrors.push(String(e.message || e)));
            page.on('requestfailed', r => result.requestFailures.push({ method: r.method(), url: r.url(), error: r.failure()?.errorText || 'failed' }));
            page.on('response', r => { if (r.status() >= 400) result.badResponses.push({ status: r.status(), url: r.url() }); });
            try {
              const loginResponse = await page.goto(BASE + 'login', { waitUntil: 'domcontentloaded', timeout: 45000 });
              result.loginHttpStatus = loginResponse?.status() ?? null;
              await page.locator('input[name="username"],input[name="email"],input[type="email"],input[type="text"]').first().fill(process.env.P14_SUPERADMIN_USERNAME);
              await page.locator('input[type="password"]').first().fill(process.env.P14_SUPERADMIN_PASSWORD);
              await Promise.all([
                page.waitForLoadState('domcontentloaded', { timeout: 30000 }).catch(() => {}),
                page.locator('button[type="submit"],input[type="submit"]').first().click()
              ]);
              await page.waitForTimeout(1000);
              result.finalUrlAfterLogin = page.url();
              const noLongerLogin = !/\/login(?:[/?#]|$)/i.test(page.url());
              result.superadminUiPresent = await page.locator('a[href*="/superadmin/"],nav').filter({ hasText: /компан|superadmin|администр/i }).count() > 0
                || await page.locator('a[href*="/superadmin/"]').count() > 0;
              const targets = ['superadmin/companies', 'superadmin/db-usage'];
              for (const target of targets) {
                const response = await page.goto(BASE + target, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
                await page.waitForTimeout(300);
                result.protectedPages.push({ path: '/' + target, status: response?.status() ?? null, finalUrl: page.url(), pass: response?.status() === 200 && !/\/login(?:[/?#]|$)/i.test(page.url()) });
              }
              await page.goto(BASE + 'superadmin/companies', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const shot = 'P14_superadmin_dashboard_1920x1080.png';
              await page.screenshot({ path: path.join(OUT, shot), fullPage: false });
              result.screenshot = shot;
              result.status = noLongerLogin && result.superadminUiPresent && result.protectedPages.every(p => p.pass) ? 'PASS' : 'FAIL';
            } catch (e) {
              result.error = String(e.message || e);
            } finally {
              fs.writeFileSync(path.join(OUT, 'P14_superadmin_login_result.json'), JSON.stringify(result, null, 2));
              await context.close();
              await browser.close();
              console.log(`SUPERADMIN_LOGIN=${result.status}`);
              if (result.status !== 'PASS') process.exitCode = 1;
            }
          })().catch(e => {
            result.error = String(e.message || e);
            fs.writeFileSync(path.join(OUT, 'P14_superadmin_login_result.json'), JSON.stringify(result, null, 2));
            console.log('SUPERADMIN_LOGIN=FAIL');
            process.exitCode = 1;
          });
          NODE
          node /tmp/P14_superadmin_login_check.js
          rm -f /tmp/P14_superadmin_login_check.js

      - name: Upload P14 SUPERADMIN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P14_superadmin_login_output_${{ github.sha }}
          path: P14_superadmin_login_output/
          if-no-files-found: error
          retention-days: 30
