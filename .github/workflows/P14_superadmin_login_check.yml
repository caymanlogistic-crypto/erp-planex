name: P14 Superadmin Login Check

on:
  push:
    branches:
      - chatgpt/p14-browser-audit-20260805
    paths:
      - '.github/p14/P14_superadmin_login_check.js'
      - '.github/workflows/P14_superadmin_login_check.yml'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/p14/P14_superadmin_login_check.js'
      - '.github/workflows/P14_superadmin_login_check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superadmin-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P14_OUT: P14_superadmin_login_output
    steps:
      - name: Checkout P14 audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load encrypted runtime credential helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P14_credentials
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P14_credentials/P11_decrypt_credentials.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P14_credentials/P11_runtime_credentials.enc.json

      - name: Resolve encrypted credential payload in memory
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_KEY:-}"
          python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3' >/dev/null
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PRIVATE_KEY}" > "${HOME}/.ssh/P14_runtime_key"
          chmod 600 "${HOME}/.ssh/P14_runtime_key"
          credentials="$(python /tmp/P14_credentials/P11_decrypt_credentials.py --key "${HOME}/.ssh/P14_runtime_key" --input /tmp/P14_credentials/P11_runtime_credentials.enc.json)"
          rm -f "${HOME}/.ssh/P14_runtime_key"
          rm -rf /tmp/P14_credentials
          test -n "${credentials}"
          echo "::add-mask::${credentials}"
          printf 'P14_CREDENTIALS_B64=%s\n' "${credentials}" >> "${GITHUB_ENV}"
          unset credentials PRIVATE_KEY

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Execute protected SUPERADMIN login check
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/p14/P14_superadmin_login_check.js >/dev/null 2>&1
          node .github/p14/P14_superadmin_login_check.js

      - name: Clear credential environment
        if: always()
        shell: bash
        run: |
          printf 'P14_CREDENTIALS_B64=\n' >> "${GITHUB_ENV}"
          rm -rf /tmp/P14_credentials "${HOME}/.ssh/P14_runtime_key" 2>/dev/null || true

      - name: Upload P14 SUPERADMIN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P14_superadmin_login_output_${{ github.sha }}
          path: P14_superadmin_login_output/
          if-no-files-found: error
          retention-days: 30
