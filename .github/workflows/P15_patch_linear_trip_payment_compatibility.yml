name: P15 Patch linear trip payment compatibility

on:
  push:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/P15_patch_linear_trip_payment_compatibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production stabilization branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/production-stabilization-20260802
          fetch-depth: 0

      - name: Patch payment compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/Service/LinearTripEditSaveService.php')
          text = path.read_text(encoding='utf-8')

          payment_marker = "'payment_due_type' => self::legacyDueType($conditionType)"
          if payment_marker not in text:
              needle = """                'specific_due_date' => $specificDueDate,
                'condition_comment' => $conditionComment !== '' ? $conditionComment : null,
            ];"""
              replacement = """                'specific_due_date' => $specificDueDate,
                'condition_comment' => $conditionComment !== '' ? $conditionComment : null,
                // LinearRouteService::storeRoutePayments still persists legacy columns.
                // Keep both representations populated to avoid undefined-key failures.
                'payment_due_type' => self::legacyDueType($conditionType),
                'payment_due_days' => $daysCount,
                'payment_due_days_kind' => $daysKind,
            ];"""
              if needle not in text:
                  raise SystemExit('Expected parsePaymentRows block was not found.')
              text = text.replace(needle, replacement, 1)

          start_day_line = "DateCalculationService::CONDITION_START_DAY => 'Предоплата на загрузке',"
          if start_day_line not in text:
              needle = """            DateCalculationService::CONDITION_PREPAYMENT => 'Предоплата на загрузке',
            DateCalculationService::CONDITION_AFTER_START => 'После загрузки',"""
              replacement = """            DateCalculationService::CONDITION_PREPAYMENT => 'Предоплата на загрузке',
            DateCalculationService::CONDITION_START_DAY => 'Предоплата на загрузке',
            DateCalculationService::CONDITION_AFTER_START => 'После загрузки',"""
              if needle not in text:
                  raise SystemExit('Expected legacyDueType block was not found.')
              text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          php -l app/Service/LinearTripEditSaveService.php
          php -l app/Service/LinearTripRequestNormalizer.php
          php -l app/Http/Controllers/Company/LinearTripController.php
          php -l app/Http/Controllers/Company/LinearTripActions/modal_edit_form.php
          php -l app/Http/Controllers/Company/LinearTripActions/modal_edit_submit_p13.php

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P15 compatibility automation'
          git config user.email 'p15-compatibility@users.noreply.github.com'
          git add app/Service/LinearTripEditSaveService.php
          if git diff --cached --quiet; then
            echo 'No patch commit required.'
            exit 0
          fi
          git commit -m 'fix(P15): preserve route start payment semantics'
          git push origin HEAD:chatgpt/production-stabilization-20260802
