name: P15 Restore Verify

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/p15/P15_restore_linear_route.js'
      - '.github/p15/P15_verify_restored_route.php'
      - '.github/workflows/P15_restore_verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: chatgpt/p15-p17-erp-fullhd-completion-20260805 }
      - name: Resolve encrypted credentials
        env: { PRIVATE_KEY: '${{ secrets.ERPV2_SSH_PRIVATE_KEY }}' }
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P15_credentials "${HOME}/.ssh"
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P15_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P15_credentials/credentials.enc.json
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P15_runtime_key" && chmod 600 "${HOME}/.ssh/P15_runtime_key"
          payload="$(python /tmp/P15_credentials/decrypt.py --key "${HOME}/.ssh/P15_runtime_key" --input /tmp/P15_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"; echo "P15_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P15_credentials "${HOME}/.ssh/P15_runtime_key"; unset payload PRIVATE_KEY
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Chromium
        run: npm install --no-save playwright@1.54.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Restore through SUPERADMIN UI
        env: { P15_OUT: P15_restore_verify_output }
        run: node .github/p15/P15_restore_linear_route.js
      - name: Configure SSH for read-only verification
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P15_verify_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P15_verify_key" "${HOME}/.ssh/known_hosts"
      - name: Verify restored route and relations in live tenant
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          live=/home/s/spugovxsim/planexp/public_html/erpv2
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P15_verify_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cd '$live' && php83 -d display_errors=0" < .github/p15/P15_verify_restored_route.php > P15_restore_verify_output/P15_RESTORED_ROUTE_DB.json
          python -m json.tool P15_restore_verify_output/P15_RESTORED_ROUTE_DB.json >/dev/null
      - if: always()
        run: |
          printf 'P15_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P15_verify_key" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P15_restore_verify_${{ github.sha }}
          path: P15_restore_verify_output/
          if-no-files-found: error
          retention-days: 30
