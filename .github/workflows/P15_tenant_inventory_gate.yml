name: P15 Tenant Inventory Gate

on:
  push:
    branches:
      - chatgpt/p15-p17-erp-fullhd-completion-20260805
    paths:
      - '.github/p15/P15_tenant_inventory.php'
      - '.github/workflows/P15_tenant_inventory_gate.yml'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/p15/P15_tenant_inventory.php'
      - '.github/workflows/P15_tenant_inventory_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4

      - name: Verify inventory probe
        shell: bash
        run: php -l .github/p15/P15_tenant_inventory.php >/dev/null

      - name: Configure isolated SSH access
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_KEY:-}"
          test -n "${KNOWN_HOSTS:-}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PRIVATE_KEY}" > "${HOME}/.ssh/P15_inventory_key"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P15_inventory_key" "${HOME}/.ssh/known_hosts"

      - name: Resolve deployed ERPV2 root and inventory tenants
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p P15_tenant_inventory_output
          ssh_base=(ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P15_inventory_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}")
          deployed_sha="$("${ssh_base[@]}" 'set -e; cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test -n "${deployed_sha}"
          case "${deployed_sha}" in (*[!0-9a-f]*) echo 'Invalid deployed marker' >&2; exit 1;; esac
          printf '%s\n' "${deployed_sha}" > P15_tenant_inventory_output/P15_DEPLOYED_SHA.txt

          remote_root="$("${ssh_base[@]}" "set -e
            for candidate in \
              /home/s/spugovxsim/planexp/current \
              /home/s/spugovxsim/planexp/current/erpv2 \
              /home/s/spugovxsim/planexp/releases/${deployed_sha} \
              /home/s/spugovxsim/planexp/releases/erpv2-${deployed_sha} \
              /home/s/spugovxsim/planexp/erpv2; do
              resolved=\$(readlink -f \"\${candidate}\" 2>/dev/null || true)
              if test -n \"\${resolved}\" && test -f \"\${resolved}/bootstrap/app.php\" && test -f \"\${resolved}/public/index.php\"; then
                printf '%s\\n' \"\${resolved}\"
                exit 0
              fi
            done
            found=\$(find /home/s/spugovxsim/planexp -maxdepth 5 -type f -path '*/bootstrap/app.php' -print 2>/dev/null | head -n 1)
            test -n \"\${found}\"
            dirname \"\$(dirname \"\${found}\")\"")"
          test -n "${remote_root}"
          printf '%s\n' "${remote_root}" | sed 's#^/home/[^/]*/#~/#' > P15_tenant_inventory_output/P15_DEPLOYED_ROOT_REDACTED.txt

          "${ssh_base[@]}" "cd '${remote_root}' && php -d display_errors=0" \
            < .github/p15/P15_tenant_inventory.php \
            > P15_tenant_inventory_output/P15_tenant_inventory.json
          python -m json.tool P15_tenant_inventory_output/P15_tenant_inventory.json >/dev/null

      - name: Validate tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('P15_tenant_inventory_output/P15_tenant_inventory.json')
          data = json.loads(path.read_text('utf-8'))
          companies = data.get('companies', [])
          by_id = {int(item['id']): item for item in companies if 'id' in item}
          working = by_id.get(27)
          production = by_id.get(25)
          duplicates = [item for item in companies if item.get('name') == 'UIUX TEST EXPEDITOR' and int(item.get('id', 0)) != 27]
          mutable = {
              'users','clients','client_contacts','contractors','contractor_contacts','drivers','driver_phones',
              'vehicle_units','vehicle_sets','driver_vehicle_blocks','crews','route_executors','linear_routes',
              'routes','trips','route_applications','applications','documents','invoices','finance_invoices',
              'finance_operations','cash_operations','finance_cash_operations','bank_operations',
              'finance_bank_operations','payment_allocations','finance_allocations','bank_accounts',
              'responsible_assignments','entity_access_grants'
          }
          duplicate = duplicates[0] if len(duplicates) == 1 else None
          nonzero = {
              name: int(count) for name, count in (duplicate or {}).get('business_counts', {}).items()
              if name in mutable and int(count) != 0
          }
          isolated = bool(
              production and working and duplicate and
              int(duplicate.get('id', 0)) not in (25, 27) and
              int(duplicate.get('central_users_count', -1)) == 0 and not nonzero and
              working.get('db_identifier_fingerprint') != duplicate.get('db_identifier_fingerprint') and
              working.get('storage_path_fingerprint') != duplicate.get('storage_path_fingerprint')
          )
          summary = {
              'status': 'PASS' if isolated else 'FAIL',
              'production_company_id': 25 if production else None,
              'working_test_tenant_id': 27 if working else None,
              'duplicate_tenant_id': int(duplicate['id']) if duplicate else None,
              'duplicate_nonzero_mutable_tables': nonzero,
              'distinct_database': bool(working and duplicate and working.get('db_identifier_fingerprint') != duplicate.get('db_identifier_fingerprint')),
              'distinct_storage': bool(working and duplicate and working.get('storage_path_fingerprint') != duplicate.get('storage_path_fingerprint')),
          }
          Path('P15_tenant_inventory_output/P15_tenant_isolation_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), 'utf-8'
          )
          print(f"P15_TENANT_ISOLATION={summary['status']}")
          if summary['status'] != 'PASS': raise SystemExit(1)
          PY

      - name: Clear SSH material
        if: always()
        shell: bash
        run: rm -f "${HOME}/.ssh/P15_inventory_key" 2>/dev/null || true

      - name: Upload tenant inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P15_tenant_inventory_output_${{ github.sha }}
          path: P15_tenant_inventory_output/
          if-no-files-found: error
          retention-days: 30
