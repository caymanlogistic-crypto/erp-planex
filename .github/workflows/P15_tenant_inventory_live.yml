name: P15 Tenant Inventory Live

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/p15/P15_tenant_inventory.php'
      - '.github/workflows/P15_tenant_inventory_live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PRIVATE_KEY}" > "${HOME}/.ssh/P15_live_key"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P15_live_key" "${HOME}/.ssh/known_hosts"
      - name: Inventory live tenant databases
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p P15_tenant_inventory_live_output
          ssh_base=(ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/P15_live_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}")
          live=/home/s/spugovxsim/planexp/public_html/erpv2
          "${ssh_base[@]}" "test -L '${live}/.env' && test -L '${live}/storage' && test -f '${live}/bootstrap/app.php' && test -f '${live}/public/index.php'"
          deployed_sha="$("${ssh_base[@]}" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          printf '%s\n' "${deployed_sha}" > P15_tenant_inventory_live_output/P15_DEPLOYED_SHA.txt
          remote_php="$("${ssh_base[@]}" 'for c in php83 php8.3 /usr/local/bin/php83 /opt/php83/bin/php /usr/bin/php8.3 php; do command -v "$c" >/dev/null 2>&1 || continue; v=$("$c" -r "echo PHP_VERSION_ID;" 2>/dev/null || true); if test -n "$v" && test "$v" -ge 80300; then command -v "$c"; exit 0; fi; done; exit 1')"
          "${ssh_base[@]}" "cd '${live}' && '${remote_php}' -d display_errors=0" < .github/p15/P15_tenant_inventory.php > P15_tenant_inventory_live_output/P15_tenant_inventory.json
          python -m json.tool P15_tenant_inventory_live_output/P15_tenant_inventory.json >/dev/null
      - name: Validate tenant isolation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('P15_tenant_inventory_live_output/P15_tenant_inventory.json')
          data=json.loads(p.read_text('utf-8'))
          companies=data.get('companies',[])
          by_id={int(x['id']):x for x in companies}
          prod,work=by_id.get(25),by_id.get(27)
          dups=[x for x in companies if x.get('name')=='UIUX TEST EXPEDITOR' and int(x['id'])!=27]
          dup=dups[0] if len(dups)==1 else None
          mutable={'users','clients','client_contacts','contractors','contractor_contacts','drivers','driver_phones','vehicle_units','vehicle_sets','driver_vehicle_blocks','crews','route_executors','linear_routes','routes','trips','route_applications','applications','documents','invoices','finance_invoices','finance_operations','cash_operations','finance_cash_operations','bank_operations','finance_bank_operations','payment_allocations','finance_allocations','bank_accounts','responsible_assignments','entity_access_grants'}
          nonzero={k:int(v) for k,v in (dup or {}).get('business_counts',{}).items() if k in mutable and int(v)}
          passed=bool(prod and work and dup and int(dup['id']) not in (25,27) and int(dup.get('central_users_count',-1))==0 and not nonzero and work.get('db_identifier_fingerprint')!=dup.get('db_identifier_fingerprint') and work.get('storage_path_fingerprint')!=dup.get('storage_path_fingerprint'))
          summary={'status':'PASS' if passed else 'FAIL','production_company_id':25 if prod else None,'working_test_tenant_id':27 if work else None,'duplicate_tenant_id':int(dup['id']) if dup else None,'duplicate_nonzero_mutable_tables':nonzero,'production_counts':(prod or {}).get('business_counts',{}),'working_counts':(work or {}).get('business_counts',{}),'duplicate_counts':(dup or {}).get('business_counts',{}),'distinct_database':bool(work and dup and work.get('db_identifier_fingerprint')!=dup.get('db_identifier_fingerprint')),'distinct_storage':bool(work and dup and work.get('storage_path_fingerprint')!=dup.get('storage_path_fingerprint'))}
          Path('P15_tenant_inventory_live_output/P15_tenant_isolation_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
          print('P15_TENANT_ISOLATION='+summary['status'])
          if not passed: raise SystemExit(1)
          PY
      - if: always()
        run: rm -f "${HOME}/.ssh/P15_live_key" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P15_tenant_inventory_live_${{ github.sha }}
          path: P15_tenant_inventory_live_output/
          if-no-files-found: error
          retention-days: 30
