name: P15 Trip Runtime

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/p15/P15_trip_create_runtime.js'
      - '.github/p15/P15_trip_create_runtime_v2.js'
      - '.github/p15/P15_trip_modal_discovery.js'
      - '.github/workflows/P15_trip_create_runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trip-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: chatgpt/p15-p17-erp-fullhd-completion-20260805 }
      - name: Load encrypted credentials helper
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P15_credentials
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P15_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P15_credentials/credentials.enc.json
      - name: Resolve credentials in memory
        env: { PRIVATE_KEY: '${{ secrets.ERPV2_SSH_PRIVATE_KEY }}' }
        run: |
          set -euo pipefail
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P15_runtime_key"
          chmod 600 "${HOME}/.ssh/P15_runtime_key"
          payload="$(python /tmp/P15_credentials/decrypt.py --key "${HOME}/.ssh/P15_runtime_key" --input /tmp/P15_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"
          echo "P15_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P15_credentials "${HOME}/.ssh/P15_runtime_key"
          unset payload PRIVATE_KEY
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify trip creation idempotently
        env: { P15_OUT: P15_trip_runtime_output }
        run: node .github/p15/P15_trip_create_runtime_v2.js
      - name: Discover edit lifecycle controls
        env: { P15_OUT: P15_trip_runtime_output }
        run: node .github/p15/P15_trip_modal_discovery.js
      - if: always()
        run: printf 'P15_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P15_trip_runtime_${{ github.sha }}
          path: P15_trip_runtime_output/
          if-no-files-found: error
          retention-days: 30
