name: P16 Apply Representative Fixtures

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/p16/P16_apply_representative_fixtures.php'
      - '.github/p16/P16_apply_representative_fixtures_v2.php'
      - '.github/workflows/P16_apply_representative_fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
      - name: Decode and verify corrected fixture source
        run: |
          set -euo pipefail
          php -l .github/p16/P16_apply_representative_fixtures.php >/dev/null
          python - <<'PY'
          import base64,gzip,hashlib,re
          from pathlib import Path
          wrapper=Path('.github/p16/P16_apply_representative_fixtures.php').read_text('utf-8')
          match=re.search(r"\$payload = '([^']+)'",wrapper)
          assert match, 'payload missing'
          source=gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          assert hashlib.sha256(source.encode()).hexdigest()=='08031fe8097e9bde64f005418b2a47e64900f88eb4552f1ab35b00f6c09b1f72'
          before="""    $ownerStmt = $central->prepare(\"SELECT id FROM company_users WHERE company_id = ? AND role_code = 'company_owner' AND status = 'active' ORDER BY id LIMIT 1\");
              $ownerStmt->execute([TEST_TENANT_ID]);"""
          after="""    $ownerStmt = $central->prepare(\"SELECT id FROM company_users WHERE company_id = ? AND login = ? AND status = 'active' ORDER BY id LIMIT 1\");
              $ownerStmt->execute([TEST_TENANT_ID, 'p14_owner_260804221827']);"""
          assert source.count(before)==1
          source=source.replace(before,after)
          assert hashlib.sha256(source.encode()).hexdigest()=='d45f56a3328e3e5ecc8381b156d7fe729c6259e9128dba464b2f57e1cf4c5e1c'
          Path('/tmp/P16_apply_representative_fixtures.php').write_text(source,'utf-8')
          PY
          php -l /tmp/P16_apply_representative_fixtures.php >/dev/null
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P16_fixture_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P16_fixture_key" "${HOME}/.ssh/known_hosts"
      - name: Apply fixtures only to tenant 27
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p P16_fixture_output
          ssh_base=(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P16_fixture_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          live=/home/s/spugovxsim/planexp/public_html/erpv2
          remote_php="$("${ssh_base[@]}" 'for c in php83 php8.3 /usr/local/bin/php83 /opt/php83/bin/php /usr/bin/php8.3 php; do command -v "$c" >/dev/null 2>&1 || continue; v=$("$c" -r "echo PHP_VERSION_ID;" 2>/dev/null || true); if test -n "$v" && test "$v" -ge 80300; then command -v "$c"; exit 0; fi; done; exit 1')"
          before_old="$("${ssh_base[@]}" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          deployed_sha="$("${ssh_base[@]}" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          printf '%s\n' "$deployed_sha" > P16_fixture_output/P16_DEPLOYED_SHA_BEFORE_FIXTURES.txt
          "${ssh_base[@]}" "cd '$live' && '$remote_php' -d display_errors=0" < /tmp/P16_apply_representative_fixtures.php > P16_fixture_output/P16_02_TEST_DATA_CREATED_FIRST.json
          python -m json.tool P16_fixture_output/P16_02_TEST_DATA_CREATED_FIRST.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('P16_fixture_output/P16_02_TEST_DATA_CREATED_FIRST.json').read_text('utf-8'))
          assert d['status']=='PASS' and d['tenant_id']==27 and d['company']=='UIUX TEST EXPEDITOR'
          assert all(x['pass'] for x in d['assertions'].values())
          print('P16_FIXTURE_FIRST=PASS')
          PY
          "${ssh_base[@]}" "cd '$live' && '$remote_php' -d display_errors=0" < /tmp/P16_apply_representative_fixtures.php > P16_fixture_output/P16_02_TEST_DATA_CREATED_SECOND.json
          python -m json.tool P16_fixture_output/P16_02_TEST_DATA_CREATED_SECOND.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('P16_fixture_output/P16_02_TEST_DATA_CREATED_FIRST.json').read_text('utf-8'))
          b=json.loads(Path('P16_fixture_output/P16_02_TEST_DATA_CREATED_SECOND.json').read_text('utf-8'))
          assert b['status']=='PASS'
          assert a['assertions']==b['assertions']
          created=sum(int(x.get('created',0)) for x in b.get('stats',{}).values())
          assert created==0, f'idempotency created {created} rows on second run'
          Path('P16_fixture_output/P16_IDEMPOTENCY_SUMMARY.json').write_text(json.dumps({'status':'PASS','second_run_created':created,'assertions':b['assertions']},ensure_ascii=False,indent=2),'utf-8')
          print('P16_FIXTURE_IDEMPOTENCY=PASS')
          PY
          after_old="$("${ssh_base[@]}" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          test "$before_old" = "$after_old"
          printf '%s\n' "$before_old" > P16_fixture_output/P16_OLD_ERP_FINGERPRINT.txt
          printf '{"status":"PASS","test_tenant_id":27,"production_company_mutated":false,"old_erp_mutated":false}\n' > P16_fixture_output/P16_FIXTURE_ISOLATION.json
      - if: always()
        run: |
          rm -f "${HOME}/.ssh/P16_fixture_key" /tmp/P16_apply_representative_fixtures.php 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P16_representative_fixtures_${{ github.sha }}
          path: P16_fixture_output/
          if-no-files-found: error
          retention-days: 30
