name: P16 Populated Full HD Runtime

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/p16/P16_populated_fullhd_runtime.js'
      - '.github/workflows/P16_populated_fullhd_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-runtime-credentials
  cancel-in-progress: false

jobs:
  fullhd-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
      - name: Resolve encrypted credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P16_credentials "${HOME}/.ssh"
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P16_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P16_credentials/credentials.enc.json
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P16_runtime_key"
          chmod 600 "${HOME}/.ssh/P16_runtime_key"
          payload="$(python /tmp/P16_credentials/decrypt.py --key "${HOME}/.ssh/P16_runtime_key" --input /tmp/P16_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"
          echo "P16_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P16_credentials "${HOME}/.ssh/P16_runtime_key"
          unset payload PRIVATE_KEY
      - name: Verify deployed SHA before browser runtime
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: 17c0e01c89e9a43cd20a48631064698a3e21d223
        run: |
          set -euo pipefail
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P16_marker_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P16_marker_key" "${HOME}/.ssh/known_hosts"
          actual="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P16_marker_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$actual" = "$EXPECTED_SHA"
          echo "P16_EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P16_marker_key"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: node --check .github/p16/P16_populated_fullhd_runtime.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Execute populated role and viewport runtime
        env:
          P16_OUT: P16_populated_runtime_output
        run: node .github/p16/P16_populated_fullhd_runtime.js
      - if: always()
        run: |
          printf 'P16_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P16_marker_key" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P16_populated_fullhd_${{ github.sha }}
          path: P16_populated_runtime_output/
          if-no-files-found: error
          retention-days: 30
