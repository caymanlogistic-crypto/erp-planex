name: P16 Release Gate

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/p16/**'
      - '.github/workflows/P16_release_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
      - name: PHP 8.3 syntax
        run: |
          set -euo pipefail
          mkdir -p P16_release_gate_output
          : > P16_release_gate_output/P16_PHP_LINT.log
          while IFS= read -r -d '' file; do
            php -l "$file" >> P16_release_gate_output/P16_PHP_LINT.log
          done < <(find app bootstrap config database public scripts tools tests -type f -name '*.php' -print0)
      - name: P15 and compatibility regression tests
        run: |
          set -euo pipefail
          : > P16_release_gate_output/P16_TEST_RESULTS.log
          count=0
          while IFS= read -r file; do
            printf 'RUN %s\n' "$file" | tee -a P16_release_gate_output/P16_TEST_RESULTS.log
            php "$file" 2>&1 | tee -a P16_release_gate_output/P16_TEST_RESULTS.log
            count=$((count+1))
          done < <(find tests -maxdepth 1 -type f -name 'p15*.php' | sort)
          test "$count" -ge 3
          printf 'P16_P15_TEST_COUNT=%s\n' "$count" | tee -a P16_release_gate_output/P16_TEST_RESULTS.log
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax and CSS sanity
        run: |
          set -euo pipefail
          : > P16_release_gate_output/P16_JS_SYNTAX.log
          while IFS= read -r -d '' file; do
            node --check "$file" >> P16_release_gate_output/P16_JS_SYNTAX.log 2>&1
          done < <(find public/assets/js .github/p16 -type f -name '*.js' -print0)
          python - <<'PY'
          from pathlib import Path
          import json,re
          findings=[]
          for path in sorted(Path('public/assets/css').glob('*.css')):
              text=path.read_text('utf-8')
              clean=re.sub(r'/\*.*?\*/','',text,flags=re.S)
              balance=clean.count('{')-clean.count('}')
              findings.append({'file':str(path),'brace_balance':balance,'bytes':len(text.encode('utf-8'))})
              if balance: raise SystemExit(f'CSS brace mismatch: {path}: {balance}')
          Path('P16_release_gate_output/P16_CSS_SANITY.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),'utf-8')
          PY
      - name: Encoding secret and diff review
        run: |
          set -euo pipefail
          git fetch origin chatgpt/production-stabilization-20260802:refs/remotes/origin/chatgpt/production-stabilization-20260802 >/dev/null 2>&1
          git diff --name-status origin/chatgpt/production-stabilization-20260802...HEAD > P16_release_gate_output/P16_CHANGED_FILES.txt
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','origin/chatgpt/production-stabilization-20260802...HEAD'],text=True).splitlines()
          production_roots=('app/','bootstrap/','config/','database/','public/','scripts/','tools/','tests/','.github/p16/')
          scanned=[name for name in changed if name.startswith(production_roots)]
          binary={'.png','.jpg','.jpeg','.gif','.webp','.woff','.woff2','.ttf','.zip','.gz','.pdf','.xlsx'}
          mojibake=[]; bom=[]; secret=[]
          exact_secrets=[
              re.compile(r'(?<![A-Za-z0-9])test1234(?![A-Za-z0-9])',re.I),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{30,}'),
          ]
          for name in scanned:
              p=Path(name)
              if not p.is_file() or p.suffix.lower() in binary: continue
              raw=p.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'): bom.append(name)
              try: text=raw.decode('utf-8')
              except UnicodeDecodeError as e: raise SystemExit(f'non UTF-8: {p}: {e}')
              if not ('mojibake' in name.lower() or name.endswith('architecture_guard.php')):
                  for marker in ('Рџ','РЎ','Ð','Ñ','�'):
                      if marker in text: mojibake.append({'file':name,'marker':marker})
              for pattern in exact_secrets:
                  if pattern.search(text): secret.append({'file':name,'pattern':pattern.pattern})
          forbidden=[x for x in changed if x.startswith(('.env','storage/','tmp/','logs/','node_modules/','vendor/'))]
          summary={
              'status':'PASS' if not (mojibake or bom or secret or forbidden) else 'FAIL',
              'changed_files':len(changed),
              'content_scanned_files':len(scanned),
              'workflow_definitions_reviewed_by_diff':len([x for x in changed if x.startswith('.github/workflows/')]),
              'mojibake':mojibake,
              'bom':bom,
              'secret_findings':secret,
              'forbidden_paths':forbidden,
          }
          Path('P16_release_gate_output/P16_SECURITY_ENCODING.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
          if summary['status']!='PASS': raise SystemExit(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Release summary
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf '{"status":"PASS","sha":"%s","php":"%s","old_erp_targeted":false}\n' "$sha" "$(php -r 'echo PHP_VERSION;')" > P16_release_gate_output/P16_RELEASE_GATE_SUMMARY.json
          echo "P16_RELEASE_GATE=PASS sha=$sha"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P16_release_gate_${{ github.sha }}
          path: P16_release_gate_output/
          if-no-files-found: error
          retention-days: 30
