name: P17R Capability Discovery

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/p17/P17R_capability_discovery.js'
      - '.github/workflows/P17R_capability_discovery.yml'
      - '.github/p17/P17R_CAPABILITY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-p17r-capability
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0
      - name: Resolve encrypted credentials
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P17R_credentials "${HOME}/.ssh"
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P17R_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P17R_credentials/credentials.enc.json
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17R_runtime_key"
          chmod 600 "${HOME}/.ssh/P17R_runtime_key"
          payload="$(python /tmp/P17R_credentials/decrypt.py --key "${HOME}/.ssh/P17R_runtime_key" --input /tmp/P17R_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"
          echo "P17R_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P17R_credentials "${HOME}/.ssh/P17R_runtime_key"
          unset payload PRIVATE_KEY
      - name: Verify deployed marker and old ERP baseline
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: 8e1b9659638d5aa86f156b7ece201da591753c82
        run: |
          set -euo pipefail
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17R_marker_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P17R_marker_key" "${HOME}/.ssh/known_hosts"
          actual="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_marker_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$actual" = "$EXPECTED_SHA"
          fp="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_marker_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          echo "P17_DEPLOYED_SHA=$actual" >> "$GITHUB_ENV"
          echo "P17R_OLD_ERP_FP=$fp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Execute read-only capability discovery
        env:
          P17R_OUT: P17R_capability_discovery_output
        run: |
          node --check .github/p17/P17R_capability_discovery.js
          node .github/p17/P17R_capability_discovery.js
      - name: Verify old ERP unchanged
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          after="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_marker_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          test "$after" = "$P17R_OLD_ERP_FP"
      - if: always()
        run: |
          printf 'P17R_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P17R_marker_key" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P17R_capability_discovery_${{ github.sha }}
          path: P17R_capability_discovery_output/
          if-no-files-found: error
          retention-days: 30
