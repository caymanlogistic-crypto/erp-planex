name: P17R Quiet Legacy Workflows

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'P17R_QUIET_LEGACY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erpv2-p17r-quiet-legacy-workflows
  cancel-in-progress: false

jobs:
  quiet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0

      - name: Quiet completed and superseded workflows
        run: |
          set -euo pipefail
          python .github/p17/P17R_quiet_legacy_workflows.py
          python -m json.tool P17R_QUIETED_WORKFLOWS.json >/dev/null
          git diff --check
          test "$(python -c "import json; print(json.load(open('P17R_QUIETED_WORKFLOWS.json'))['count'])")" -ge 20

      - name: Commit workflow trigger isolation
        run: |
          set -euo pipefail
          git config user.name 'erp-planex-p17r-bot'
          git config user.email 'erp-planex-p17r-bot@users.noreply.github.com'
          git add .github/workflows/P14_linear_trip_edit_runtime.yml \
                  .github/workflows/P15_*.yml \
                  .github/workflows/P16_*.yml \
                  .github/workflows/P17_complete_acceptance.yml \
                  .github/workflows/P17_crud_trip_finance_runtime.yml \
                  .github/workflows/P17_route_role_fullhd_runtime.yml \
                  .github/workflows/P17R_capability_discovery.yml \
                  .github/workflows/P17R_complete_acceptance.yml \
                  .github/workflows/P17R_v4_complete_factual_acceptance.yml \
                  .github/workflows/P17R_v5_complete_acceptance.yml \
                  .github/workflows/P17R_source_contract_inventory.yml
          git commit -m 'P17R: isolate completed audit workflows to manual dispatch'
          git push origin HEAD:chatgpt/p15-p17-erp-fullhd-completion-20260805

      - uses: actions/upload-artifact@v4
        with:
          name: P17R_quiet_legacy_workflows_${{ github.sha }}
          path: P17R_QUIETED_WORKFLOWS.json
          if-no-files-found: error
          retention-days: 30
