name: P17R V6 Deploy and Factual Acceptance

on:
  push:
    branches: [chatgpt/p15-p17-erp-fullhd-completion-20260805]
    paths:
      - 'P17R_V6_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erpv2-p17r-v6-deploy-acceptance
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, fileinfo

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static and regression release gates
        run: |
          set -euo pipefail
          mkdir -p P17R_v6_gate_output
          sha="$(git rev-parse HEAD)"
          echo "P17R_V6_DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          printf '%s\n' "$sha" > P17R_v6_gate_output/P17R_V6_DEPLOY_SHA.txt
          node --check .github/p17/P17R_full_runtime_v6.js
          node --check .github/p17/P17_route_role_fullhd_runtime_v3.js
          node --check .github/p17/P17R_evidence_assembler.js
          node --check .github/p17/P17_summary_builder.js
          node tests/p17_summary_builder_test.js
          php tests/p17_zero_byte_document_rejection_test.php
          php tests/p17_route_executor_basepath_test.php
          php tests/p15_trip_create_payment_terms_regression_test.php
          php tests/p15_mutation_error_service_test.php
          : > P17R_v6_gate_output/P17R_V6_PHP_LINT.log
          while IFS= read -r -d '' file; do php -l "$file" >> P17R_v6_gate_output/P17R_V6_PHP_LINT.log; done < <(find app bootstrap config database public scripts tools tests -type f -name '*.php' -print0)
          git diff --check
          python - <<'PY'
          from pathlib import Path
          files=[
            Path('.github/p17/P17R_full_runtime_v6.js'),
            Path('.github/p17/P17_route_role_fullhd_runtime_v3.js'),
            Path('app/Support/legal_entity_document_upload.php'),
            Path('app/View/pages/company_route_executor_view.php'),
            Path('app/Http/Controllers/Company/RouteExecutorActions/archive.php'),
            Path('tests/p17_zero_byte_document_rejection_test.php'),
            Path('tests/p17_route_executor_basepath_test.php'),
          ]
          for path in files:
            raw=path.read_bytes()
            assert not raw.startswith(b'\xef\xbb\xbf'), path
            text=raw.decode('utf-8')
            assert not any(marker in text for marker in ('Рџ','РЎ','Ð','Ñ','�')), path
            assert '-----BEGIN PRIVATE KEY-----' not in text, path
          PY
          printf '{"status":"PASS","sha":"%s"}\n' "$sha" > P17R_v6_gate_output/P17R_V6_RELEASE_GATE.json

      - name: Build isolated ERPV2 artifact
        id: artifact
        run: |
          set -euo pipefail
          artifact="P17R_v6_erpv2_${P17R_V6_DEPLOY_SHA}.tar.gz"
          git archive --format=tar --output=P17R_v6_erpv2.tar "$P17R_V6_DEPLOY_SHA" -- app bootstrap config database public scripts tools tests
          gzip -n P17R_v6_erpv2.tar
          mv P17R_v6_erpv2.tar.gz "$artifact"
          tar -tzf "$artifact" > P17R_v6_gate_output/P17R_V6_ARTIFACT_LISTING.txt
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|tmp|logs|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|reports)(/|$)' P17R_v6_gate_output/P17R_V6_ARTIFACT_LISTING.txt; then exit 1; fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure SSH and snapshot old ERP
        id: old
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17R_v6_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P17R_v6_key" "${HOME}/.ssh/known_hosts"
          fp="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$fp" > P17R_v6_gate_output/P17R_OLD_ERP_FINGERPRINT_BEFORE.txt

      - name: Deploy current reviewed SHA through P07 mechanism
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P17R_v6_artifact_${P17R_V6_DEPLOY_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$P17R_V6_DEPLOY_SHA'"
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "test \"\$(cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt)\" = '$P17R_V6_DEPLOY_SHA' && rm -f '$remote'"
          echo "P17_DEPLOYED_SHA=$P17R_V6_DEPLOY_SHA" >> "$GITHUB_ENV"

      - name: Verify deployment isolation
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          BEFORE: ${{ steps.old.outputs.fingerprint }}
        run: |
          set -euo pipefail
          after="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          actual="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$after" = "$BEFORE"
          test "$actual" = "$P17R_V6_DEPLOY_SHA"
          printf '%s\n' "$after" > P17R_v6_gate_output/P17R_OLD_ERP_FINGERPRINT_AFTER.txt
          printf '{"status":"PASS","deployed_sha":"%s","target":"/erpv2","old_erp_mutated":false}\n' "$actual" > P17R_v6_gate_output/P17R_V6_DEPLOY_SUMMARY.json

      - name: Resolve encrypted runtime credentials once
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P17R_credentials
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P17R_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P17R_credentials/credentials.enc.json
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17R_v6_runtime_key"
          chmod 600 "${HOME}/.ssh/P17R_v6_runtime_key"
          payload="$(python /tmp/P17R_credentials/decrypt.py --key "${HOME}/.ssh/P17R_v6_runtime_key" --input /tmp/P17R_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"
          echo "P17_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          echo "P17R_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P17R_credentials "${HOME}/.ssh/P17R_v6_runtime_key"
          unset payload PRIVATE_KEY

      - name: Install Playwright and XLSX builder
        run: |
          npm install --no-save playwright@1.54.2 xlsx@0.18.5 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: V6 factual CRUD trip documents finance runtime
        id: runtime
        continue-on-error: true
        env:
          P17R_OUT: P17R_full_runtime_output
        run: node .github/p17/P17R_full_runtime_v6.js

      - name: V6 route role and viewport runtime
        id: routes
        continue-on-error: true
        env:
          P17_OUT: P17R_route_output
        run: node .github/p17/P17_route_role_fullhd_runtime_v3.js

      - name: Assemble fresh factual matrices
        id: assemble
        if: always()
        continue-on-error: true
        run: node .github/p17/P17R_evidence_assembler.js P17R_route_output P17R_full_runtime_output P17R_final_evidence

      - name: Preserve failed-run history and deployment evidence
        if: always()
        run: |
          mkdir -p P17R_final_evidence/P17_FAILED_RUN_HISTORY
          cp P17_17_CASH_OPERATION_TIMEOUT_ROOT_CAUSE.md P17R_final_evidence/P17_FAILED_RUN_HISTORY/ 2>/dev/null || true
          cp P17_17_CASH_OPERATION_TIMEOUT_FIX.json P17R_final_evidence/P17_FAILED_RUN_HISTORY/ 2>/dev/null || true
          cp P17R_v6_gate_output/P17R_V6_DEPLOY_SHA.txt P17R_final_evidence/P17_DEPLOYED_SHA.txt 2>/dev/null || true
          cp P17R_v6_gate_output/P17R_OLD_ERP_FINGERPRINT_BEFORE.txt P17R_final_evidence/P17_OLD_ERP_FINGERPRINT_BEFORE.txt 2>/dev/null || true
          cp P17R_v6_gate_output/P17R_OLD_ERP_FINGERPRINT_AFTER.txt P17R_final_evidence/P17_OLD_ERP_FINGERPRINT_AFTER.txt 2>/dev/null || true
          cat > P17R_final_evidence/P17_FAILED_RUN_HISTORY/README.md <<'EOF'
          # P17 correction-loop history

          Earlier incomplete or failed runs are retained as history only and are not counted as PASS evidence.
          V6 uses fresh records, the deployed V6 SHA, corrected UI contracts, isolated push execution, and strict matrix-derived totals.
          EOF

      - name: Strict final summary consistency gate
        id: summary
        if: always()
        continue-on-error: true
        run: node .github/p17/P17_summary_builder.js P17R_final_evidence P17R_final_evidence/P17_16_FINAL_SUMMARY.json

      - name: Verify deployed marker and old ERP unchanged after runtime
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          BEFORE: ${{ steps.old.outputs.fingerprint }}
        run: |
          set -euo pipefail
          actual="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          after="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          test "$actual" = "$P17R_V6_DEPLOY_SHA"
          test "$after" = "$BEFORE"

      - name: Build authoritative V6 result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary_path=Path('P17R_final_evidence/P17_16_FINAL_SUMMARY.json')
          summary=json.loads(summary_path.read_text('utf-8')) if summary_path.is_file() else {'status':'FAIL','missing_or_failed':[{'code':'FINAL_SUMMARY_MISSING'}]}
          result={
            'status': summary.get('status','FAIL'),
            'deployed_sha': os.environ.get('P17R_V6_DEPLOY_SHA'),
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
            'runtime_step': '${{ steps.runtime.outcome }}',
            'route_step': '${{ steps.routes.outcome }}',
            'assemble_step': '${{ steps.assemble.outcome }}',
            'summary_step': '${{ steps.summary.outcome }}',
            'routes_reviewed': summary.get('routes_reviewed',0),
            'crud_fail': summary.get('crud_fail',0),
            'trip_fail': summary.get('trip_fail',0),
            'document_fail': summary.get('document_fail',0),
            'finance_fail': summary.get('finance_fail',0),
            'viewport_1536_pages': summary.get('viewport_1536_pages',0),
            'viewport_1366_pages': summary.get('viewport_1366_pages',0),
            'console_errors': summary.get('console_errors',0),
            'page_errors': summary.get('page_errors',0),
            'request_failures': summary.get('request_failures',0),
            'unexpected_http_errors': summary.get('unexpected_http_errors',0),
            'missing_or_failed': summary.get('missing_or_failed',[]),
          }
          Path('P17R_V6_RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P17R_v6_complete_factual_acceptance_${{ github.run_id }}
          path: |
            P17R_V6_RESULT.json
            P17R_v6_gate_output/
            P17R_final_evidence/
            P17R_route_output/
            P17R_full_runtime_output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish observable result file
        if: always()
        run: |
          set -euo pipefail
          git fetch origin chatgpt/p15-p17-erp-fullhd-completion-20260805
          git reset --hard origin/chatgpt/p15-p17-erp-fullhd-completion-20260805
          cp "$GITHUB_WORKSPACE/P17R_V6_RESULT.json" /tmp/P17R_V6_RESULT.json
          cp /tmp/P17R_V6_RESULT.json P17R_V6_RESULT.json
          git config user.name 'erp-planex-p17r-bot'
          git config user.email 'erp-planex-p17r-bot@users.noreply.github.com'
          git add P17R_V6_RESULT.json
          git commit -m 'P17R: publish V6 factual acceptance result' || true
          git push origin HEAD:chatgpt/p15-p17-erp-fullhd-completion-20260805

      - name: Final authoritative decision
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('P17R_V6_RESULT.json').read_text('utf-8'))
          print('P17R_V6_FINAL_DECISION='+str(result.get('status')))
          if result.get('status')!='PASS': raise SystemExit(1)
          PY

      - if: always()
        run: |
          printf 'P17_CREDENTIALS_B64=\nP17R_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P17R_v6_key" "${HOME}/.ssh/P17R_v6_runtime_key" 2>/dev/null || true
