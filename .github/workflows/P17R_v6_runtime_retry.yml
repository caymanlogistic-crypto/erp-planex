name: P17R V6 Runtime Retry

on:
  push:
    branches: [chatgpt/p15-p17-erp-fullhd-completion-20260805]
    paths:
      - 'P17R_V6_RETRY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erpv2-p17r-v6-runtime-retry
  cancel-in-progress: false

jobs:
  factual-runtime-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_DEPLOYED_SHA: 4bb097840e7d5ab37a81c017b5a8bdfa8f0a4cb8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, fileinfo

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static and regression gates
        run: |
          set -euo pipefail
          node --check .github/p17/P17R_full_runtime_v6_retry.js
          node --check .github/p17/P17_route_role_fullhd_runtime_v3.js
          node --check .github/p17/P17R_evidence_assembler.js
          node --check .github/p17/P17_summary_builder.js
          node tests/p17_summary_builder_test.js
          php tests/p17_zero_byte_document_rejection_test.php
          php tests/p17_route_executor_basepath_test.php
          php tests/p15_trip_create_payment_terms_regression_test.php
          php tests/p15_mutation_error_service_test.php
          git diff --check

      - name: Configure SSH and verify deployed baseline
        id: baseline
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17R_v6_retry_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P17R_v6_retry_key" "${HOME}/.ssh/known_hosts"
          ssh_base=(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_retry_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          actual="$("${ssh_base[@]}" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$actual" = "$EXPECTED_DEPLOYED_SHA"
          old_fp="$("${ssh_base[@]}" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          echo "old_fp=$old_fp" >> "$GITHUB_OUTPUT"
          echo "P17_DEPLOYED_SHA=$actual" >> "$GITHUB_ENV"
          printf '%s\n' "$actual" > P17R_RETRY_DEPLOYED_SHA.txt
          printf '%s\n' "$old_fp" > P17R_OLD_ERP_FINGERPRINT_BEFORE.txt

      - name: Resolve encrypted runtime credentials once
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P17R_credentials
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P17R_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P17R_credentials/credentials.enc.json
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17R_v6_retry_runtime_key"
          chmod 600 "${HOME}/.ssh/P17R_v6_retry_runtime_key"
          payload="$(python /tmp/P17R_credentials/decrypt.py --key "${HOME}/.ssh/P17R_v6_retry_runtime_key" --input /tmp/P17R_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"
          echo "P17_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          echo "P17R_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P17R_credentials "${HOME}/.ssh/P17R_v6_retry_runtime_key"
          unset payload PRIVATE_KEY

      - name: Install Playwright and XLSX builder
        run: |
          npm install --no-save playwright@1.54.2 xlsx@0.18.5 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Fresh V6 CRUD trip documents finance runtime
        id: runtime
        continue-on-error: true
        env:
          P17R_OUT: P17R_full_runtime_output
        run: node .github/p17/P17R_full_runtime_v6_retry.js

      - name: Fresh route role and viewport runtime
        id: routes
        continue-on-error: true
        env:
          P17_OUT: P17R_route_output
        run: node .github/p17/P17_route_role_fullhd_runtime_v3.js

      - name: Assemble factual matrices
        id: assemble
        if: always()
        continue-on-error: true
        run: node .github/p17/P17R_evidence_assembler.js P17R_route_output P17R_full_runtime_output P17R_final_evidence

      - name: Preserve deployment and failed-run history
        if: always()
        run: |
          mkdir -p P17R_final_evidence/P17_FAILED_RUN_HISTORY
          cp P17R_RETRY_DEPLOYED_SHA.txt P17R_final_evidence/P17_DEPLOYED_SHA.txt 2>/dev/null || true
          cp P17R_OLD_ERP_FINGERPRINT_BEFORE.txt P17R_final_evidence/P17_OLD_ERP_FINGERPRINT_BEFORE.txt 2>/dev/null || true
          cp P17_17_CASH_OPERATION_TIMEOUT_ROOT_CAUSE.md P17R_final_evidence/P17_FAILED_RUN_HISTORY/ 2>/dev/null || true
          cp P17_17_CASH_OPERATION_TIMEOUT_FIX.json P17R_final_evidence/P17_FAILED_RUN_HISTORY/ 2>/dev/null || true
          cat > P17R_final_evidence/P17_FAILED_RUN_HISTORY/README.md <<'EOF'
          # P17 failed-run history

          Earlier incomplete or failed runs are retained only as history. This retry uses fresh runtime records against deployed SHA 4bb097840e7d5ab37a81c017b5a8bdfa8f0a4cb8.
          EOF

      - name: Strict final summary consistency gate
        id: summary
        if: always()
        continue-on-error: true
        run: node .github/p17/P17_summary_builder.js P17R_final_evidence P17R_final_evidence/P17_16_FINAL_SUMMARY.json

      - name: Verify production marker and old ERP unchanged
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          BEFORE: ${{ steps.baseline.outputs.old_fp }}
        run: |
          set -euo pipefail
          ssh_base=(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17R_v6_retry_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          actual="$("${ssh_base[@]}" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          after="$("${ssh_base[@]}" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          test "$actual" = "$EXPECTED_DEPLOYED_SHA"
          test "$after" = "$BEFORE"
          printf '%s\n' "$after" > P17R_final_evidence/P17_OLD_ERP_FINGERPRINT_AFTER.txt

      - name: Build authoritative retry result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('P17R_final_evidence/P17_16_FINAL_SUMMARY.json')
          summary=json.loads(p.read_text('utf-8')) if p.is_file() else {'status':'FAIL','missing_or_failed':[{'code':'FINAL_SUMMARY_MISSING'}]}
          result={
            'status':summary.get('status','FAIL'),
            'deployed_sha':os.environ['EXPECTED_DEPLOYED_SHA'],
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'runtime_step':'${{ steps.runtime.outcome }}',
            'route_step':'${{ steps.routes.outcome }}',
            'assemble_step':'${{ steps.assemble.outcome }}',
            'summary_step':'${{ steps.summary.outcome }}',
            'routes_reviewed':summary.get('routes_reviewed',0),
            'crud_fail':summary.get('crud_fail',0),
            'trip_fail':summary.get('trip_fail',0),
            'document_fail':summary.get('document_fail',0),
            'finance_fail':summary.get('finance_fail',0),
            'viewport_1536_pages':summary.get('viewport_1536_pages',0),
            'viewport_1366_pages':summary.get('viewport_1366_pages',0),
            'console_errors':summary.get('console_errors',0),
            'page_errors':summary.get('page_errors',0),
            'request_failures':summary.get('request_failures',0),
            'unexpected_http_errors':summary.get('unexpected_http_errors',0),
            'missing_or_failed':summary.get('missing_or_failed',[]),
          }
          Path('P17R_V6_RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P17R_v6_runtime_retry_${{ github.run_id }}
          path: |
            P17R_V6_RESULT.json
            P17R_final_evidence/
            P17R_route_output/
            P17R_full_runtime_output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish observable retry result
        if: always()
        run: |
          set -euo pipefail
          cp P17R_V6_RESULT.json /tmp/P17R_V6_RESULT.json
          git fetch origin chatgpt/p15-p17-erp-fullhd-completion-20260805
          git reset --hard origin/chatgpt/p15-p17-erp-fullhd-completion-20260805
          cp /tmp/P17R_V6_RESULT.json P17R_V6_RESULT.json
          git config user.name 'erp-planex-p17r-bot'
          git config user.email 'erp-planex-p17r-bot@users.noreply.github.com'
          git add P17R_V6_RESULT.json
          git commit -m 'P17R: publish V6 runtime retry result' || true
          git push origin HEAD:chatgpt/p15-p17-erp-fullhd-completion-20260805

      - name: Final authoritative decision
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('P17R_V6_RESULT.json').read_text('utf-8'))
          print('P17R_V6_RUNTIME_RETRY='+str(result.get('status')))
          if result.get('status')!='PASS': raise SystemExit(1)
          PY

      - if: always()
        run: |
          printf 'P17_CREDENTIALS_B64=\nP17R_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P17R_v6_retry_key" "${HOME}/.ssh/P17R_v6_retry_runtime_key" 2>/dev/null || true
