name: P17 Complete Production Acceptance

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/p16/P16_populated_fullhd_runtime.js'
      - '.github/p16/P16_populated_fullhd_runtime_v2.js'
      - '.github/p17/P17_route_targets.json'
      - '.github/p17/P17_route_role_fullhd_runtime.js'
      - '.github/p17/P17_route_role_fullhd_runtime_v2.js'
      - '.github/p17/P17_crud_trip_finance_runtime.js'
      - '.github/workflows/P17_complete_acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-p17-complete-acceptance
  cancel-in-progress: false

jobs:
  complete-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
      - name: Final static release gate
        run: |
          set -euo pipefail
          mkdir -p P17_complete_output
          : > P17_complete_output/P17_FINAL_STATIC_TESTS.log
          while IFS= read -r -d '' file; do php -l "$file" >> P17_complete_output/P17_FINAL_STATIC_TESTS.log; done < <(find app bootstrap config database public scripts tools tests -type f -name '*.php' -print0)
          count=0
          while IFS= read -r file; do
            printf 'RUN %s\n' "$file" | tee -a P17_complete_output/P17_FINAL_STATIC_TESTS.log
            php "$file" 2>&1 | tee -a P17_complete_output/P17_FINAL_STATIC_TESTS.log
            count=$((count+1))
          done < <(find tests -maxdepth 1 -type f -name 'p15*.php' | sort)
          test "$count" -ge 3
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','origin/chatgpt/production-stabilization-20260802...HEAD'],text=True).splitlines()
          roots=('app/','bootstrap/','config/','database/','public/','scripts/','tools/','tests/','.github/p16/','.github/p17/')
          binary={'.png','.jpg','.jpeg','.gif','.webp','.woff','.woff2','.ttf','.zip','.gz','.pdf','.xlsx'}
          findings={'bom':[],'mojibake':[],'private_keys':[],'forbidden_paths':[]}
          for name in changed:
              if name.startswith(('.env','storage/','tmp/','logs/','node_modules/','vendor/')): findings['forbidden_paths'].append(name)
              if not name.startswith(roots): continue
              p=Path(name)
              if not p.is_file() or p.suffix.lower() in binary: continue
              raw=p.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'): findings['bom'].append(name)
              text=raw.decode('utf-8')
              if '-----BEGIN PRIVATE KEY-----' in text or '-----BEGIN OPENSSH PRIVATE KEY-----' in text: findings['private_keys'].append(name)
              if 'mojibake' not in name.lower() and not name.endswith('architecture_guard.php'):
                  for marker in ('Рџ','РЎ','Ð','Ñ','�'):
                      if marker in text: findings['mojibake'].append({'file':name,'marker':marker})
          status='PASS' if not any(findings.values()) else 'FAIL'
          Path('P17_complete_output/P17_FINAL_SECURITY_ENCODING.json').write_text(json.dumps({'status':status,'changed_files':len(changed),**findings},ensure_ascii=False,indent=2),'utf-8')
          if status!='PASS': raise SystemExit(json.dumps(findings,ensure_ascii=False))
          for p in Path('public/assets/css').glob('*.css'):
              text=p.read_text('utf-8'); clean=re.sub(r'/\*.*?\*/','',text,flags=re.S)
              if clean.count('{')!=clean.count('}'): raise SystemExit(f'CSS braces: {p}')
          PY
      - name: Resolve encrypted credentials once
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2 >/dev/null 2>&1
          mkdir -p /tmp/P17_credentials "${HOME}/.ssh"
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P17_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P17_credentials/credentials.enc.json
          python -m pip install --quiet 'cryptography==46.0.3' >/dev/null
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17_runtime_key"
          chmod 600 "${HOME}/.ssh/P17_runtime_key"
          payload="$(python /tmp/P17_credentials/decrypt.py --key "${HOME}/.ssh/P17_runtime_key" --input /tmp/P17_credentials/credentials.enc.json)"
          echo "::add-mask::$payload"
          echo "P16_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          echo "P17_CREDENTIALS_B64=$payload" >> "$GITHUB_ENV"
          rm -rf /tmp/P17_credentials "${HOME}/.ssh/P17_runtime_key"
          unset payload PRIVATE_KEY
      - name: Verify deployed marker and isolation baseline
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: 316645450e3cce40ab1dc2422368527877176eec
        run: |
          set -euo pipefail
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17_acceptance_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P17_acceptance_key" "${HOME}/.ssh/known_hosts"
          ssh_base=(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17_acceptance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          actual="$("${ssh_base[@]}" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$actual" = "$EXPECTED_SHA"
          old_fp="$("${ssh_base[@]}" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          printf '%s\n' "$actual" > P17_complete_output/P17_DEPLOYED_SHA.txt
          printf '%s\n' "$old_fp" > P17_complete_output/P17_OLD_ERP_FINGERPRINT_BEFORE.txt
          echo "P16_EXPECTED_SHA=$actual" >> "$GITHUB_ENV"
          echo "P17_DEPLOYED_SHA=$actual" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate browser scripts and route inventory
        run: |
          set -euo pipefail
          node --check .github/p16/P16_populated_fullhd_runtime.js
          node --check .github/p16/P16_populated_fullhd_runtime_v2.js
          node --check .github/p17/P17_route_role_fullhd_runtime.js
          node --check .github/p17/P17_route_role_fullhd_runtime_v2.js
          node --check .github/p17/P17_crud_trip_finance_runtime.js
          python - <<'PY'
          import json
          d=json.load(open('.github/p17/P17_route_targets.json',encoding='utf-8'))
          assert d['count']==67 and len(d['targets'])==67
          PY
      - name: Install Chromium and XLSX builder
        run: |
          npm install --no-save playwright@1.54.2 xlsx@0.18.5 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: P16 populated Full HD regression
        id: p16
        continue-on-error: true
        env:
          P16_OUT: P16_populated_runtime_output
        run: node .github/p16/P16_populated_fullhd_runtime_v2.js
      - name: P17 independent route role viewport matrix
        id: routes
        continue-on-error: true
        env:
          P17_OUT: P17_route_runtime_output
        run: node .github/p17/P17_route_role_fullhd_runtime_v2.js
      - name: P17 independent CRUD trip documents finance
        id: crud
        continue-on-error: true
        env:
          P17_OUT: P17_crud_runtime_output
        run: node .github/p17/P17_crud_trip_finance_runtime.js
      - name: Verify deployed marker and old ERP unchanged
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: 316645450e3cce40ab1dc2422368527877176eec
        run: |
          set -euo pipefail
          ssh_base=(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17_acceptance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          actual="$("${ssh_base[@]}" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$actual" = "$EXPECTED_SHA"
          before="$(cat P17_complete_output/P17_OLD_ERP_FINGERPRINT_BEFORE.txt)"
          after="$("${ssh_base[@]}" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          test "$before" = "$after"
          printf '%s\n' "$after" > P17_complete_output/P17_OLD_ERP_FINGERPRINT_AFTER.txt
      - name: Build final acceptance summary
        if: always()
        env:
          P16_OUTCOME: ${{ steps.p16.outcome }}
          ROUTE_OUTCOME: ${{ steps.routes.outcome }}
          CRUD_OUTCOME: ${{ steps.crud.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          def read(path, default):
              p=Path(path)
              return json.loads(p.read_text('utf-8')) if p.exists() else default
          p16=read('P16_populated_runtime_output/P16_07_FULLHD_PAGE_MATRIX.json',{})
          network=read('P17_route_runtime_output/P17_09_CONSOLE_NETWORK_REPORT.json',{})
          routes=read('P17_route_runtime_output/P17_02_ROUTE_ROLE_MATRIX.json',[])
          viewports=read('P17_route_runtime_output/P17_08_VIEWPORT_REGRESSION_MATRIX.json',[])
          crud=read('P17_crud_runtime_output/P17_CRUD_RUNTIME_SUMMARY.json',{})
          summary={
              'status':'PASS',
              'deployed_sha':Path('P17_complete_output/P17_DEPLOYED_SHA.txt').read_text().strip() if Path('P17_complete_output/P17_DEPLOYED_SHA.txt').exists() else None,
              'outcomes':{'p16':os.getenv('P16_OUTCOME'),'routes':os.getenv('ROUTE_OUTCOME'),'crud':os.getenv('CRUD_OUTCOME')},
              'p16':p16.get('summary',{}),
              'p17_routes':network.get('summary',{}),
              'p17_crud':crud,
              'route_records':len(routes),
              'viewport_records':len(viewports),
          }
          failures=[]
          if p16.get('status')!='PASS': failures.append('P16_POPULATED_FULLHD')
          if network.get('status')!='PASS': failures.append('P17_ROUTE_ROLE_FULLHD')
          if crud.get('status')!='PASS': failures.append('P17_CRUD_TRIP_FINANCE')
          if failures: summary['status']='FAIL'; summary['failures']=failures
          Path('P17_complete_output/P17_16_FINAL_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
          print('P17_COMPLETE_ACCEPTANCE='+summary['status'])
          if summary['status']!='PASS': raise SystemExit(1)
          PY
      - if: always()
        run: |
          printf 'P16_CREDENTIALS_B64=\nP17_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "${HOME}/.ssh/P17_acceptance_key" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P17_complete_acceptance_${{ github.sha }}
          path: |
            P17_complete_output/
            P16_populated_runtime_output/
            P17_route_runtime_output/
            P17_crud_runtime_output/
          if-no-files-found: error
          retention-days: 30
