name: P17 Correction Deploy ERPV2

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - 'app/View/pages/superadmin_deleted_data.php'
      - 'public/assets/css/p17-corrections.css'
      - 'public/assets/js/p16-ui.js'
      - '.github/workflows/P17_correction_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-deploy
  cancel-in-progress: false

jobs:
  correction-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p15-p17-erp-fullhd-completion-20260805
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
      - name: Final correction release gate
        id: meta
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          php -l app/View/pages/superadmin_deleted_data.php >/dev/null
          php -l app/View/pages/company_dashboard.php >/dev/null
          php tests/p15_trip_create_payment_terms_regression_test.php >/dev/null
          php tests/p15_mutation_error_service_test.php >/dev/null
          php tests/p15_safe_mutation_flow_regression_test.php >/dev/null
          node --check public/assets/js/p16-ui.js
          node --check .github/p17/P17_route_role_fullhd_runtime_v2.js
          node --check .github/p17/P17_crud_trip_finance_runtime_v2.js
          python - <<'PY'
          from pathlib import Path
          for name in ['public/assets/css/p16-fullhd.css','public/assets/css/p17-corrections.css']:
              text=Path(name).read_text('utf-8')
              assert text.count('{')==text.count('}'), name
              assert not text.startswith('\ufeff'), name
          for name in ['app/View/pages/superadmin_deleted_data.php','public/assets/css/p17-corrections.css','public/assets/js/p16-ui.js']:
              text=Path(name).read_text('utf-8')
              assert not any(marker in text for marker in ('Рџ','РЎ','Ð','Ñ','�')), name
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build isolated artifact
        id: artifact
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          artifact="P17_correction_${DEPLOY_SHA}.tar.gz"
          git archive --format=tar --output=P17_correction.tar "$DEPLOY_SHA" -- app bootstrap config database public scripts tools tests
          gzip -n P17_correction.tar && mv P17_correction.tar.gz "$artifact"
          tar -tzf "$artifact" > P17_correction_listing.txt
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|tmp|logs|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|reports)(/|$)' P17_correction_listing.txt; then exit 1; fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Configure SSH and capture old ERP
        id: old
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P17_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P17_deploy_key" "${HOME}/.ssh/known_hosts"
          fp="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
      - name: Deploy exact correction SHA through P07
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha256 }}
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P17_correction_${DEPLOY_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "${HOME}/.ssh/P17_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$DEPLOY_SHA'"
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "test \"\$(cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt)\" = '$DEPLOY_SHA' && rm -f '$remote'"
      - name: Verify old ERP unchanged
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          BEFORE: ${{ steps.old.outputs.fingerprint }}
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          after="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P17_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          test "$after" = "$BEFORE"
          mkdir -p P17_correction_deploy_output
          printf '%s\n' "$DEPLOY_SHA" > P17_correction_deploy_output/P17_DEPLOYED_SHA.txt
          printf '%s\n' "$after" > P17_correction_deploy_output/P17_OLD_ERP_FINGERPRINT.txt
          printf '{"status":"PASS","deployed_sha":"%s","target":"/erpv2","old_erp_mutated":false}\n' "$DEPLOY_SHA" > P17_correction_deploy_output/P17_CORRECTION_DEPLOY.json
      - if: always()
        run: rm -f "${HOME}/.ssh/P17_deploy_key" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P17_correction_deploy_${{ steps.meta.outputs.sha }}
          path: P17_correction_deploy_output/
          if-no-files-found: error
          retention-days: 30
