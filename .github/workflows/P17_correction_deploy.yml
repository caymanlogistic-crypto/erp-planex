name: P17 Correction Deploy ERPV2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-marker:
    runs-on: ubuntu-24.04
    steps:
      - name: Accepted correction deployment is frozen
        run: |
          echo "P17_CORRECTION_DEPLOY=FROZEN"
          echo "DEPLOYED_SHA=dc2a46f8298eb4287ea9a940ab2e0bdfc267f560"
          echo "TARGET=/erpv2"
          echo "Use the established P07 deploy mechanism only after a new reviewed production correction."
