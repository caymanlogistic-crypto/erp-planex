name: P17 Restore Accepted Marker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-marker:
    runs-on: ubuntu-24.04
    steps:
      - name: Accepted marker is frozen
        run: |
          echo "P17_ACCEPTED_MARKER=FROZEN"
          echo "DEPLOYED_SHA=8e1b9659638d5aa86f156b7ece201da591753c82"
          echo "TARGET=/erpv2"
