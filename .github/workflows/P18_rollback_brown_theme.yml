name: P18 Rollback ERPV2 Brown Theme

on:
  push:
    branches: [chatgpt/production-stabilization-20260802]
    paths: ['.github/workflows/P18_rollback_brown_theme.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpv2-deploy
  cancel-in-progress: false

env:
  BROWN_THEME_SHA: 8c7571c01bcd87f42c4f2e9300fc52a2499935fe
  ERPV2_URL: https://planexp.ru/erpv2

jobs:
  rollback-erpv2-brown:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact brown source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BROWN_THEME_SHA }}
          fetch-depth: 1

      - name: Verify brown source contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BROWN_THEME_SHA"
          test ! -f public/assets/css/p16-fullhd.css
          grep -F -- '--accent: #7c4718;' public/assets/css/app.css
          grep -F -- '--color-primary: #7c4718;' public/assets/css/app.css
          grep -F -- 'linear-gradient(180deg, #9a5a22 0%, var(--accent) 100%)' public/assets/css/app.css
          grep -F -- '--nav-active-bg: rgba(140,82,28,.28);' public/assets/css/app.css
          if grep -R --line-number --fixed-strings 'p16-fullhd.css' app public config bootstrap scripts tools tests 2>/dev/null; then
            echo 'p16-fullhd.css must not be referenced in brown rollback source' >&2
            exit 1
          fi
          php -l app/View/layouts/main.php >/dev/null

      - name: Build artifact strictly from BROWN_THEME_SHA
        id: artifact
        run: |
          set -euo pipefail
          artifact="P18_erpv2_brown_${BROWN_THEME_SHA}.tar.gz"
          git archive --format=tar --output=P18_erpv2_brown.tar "$BROWN_THEME_SHA" -- app bootstrap config database public scripts tools tests
          gzip -n P18_erpv2_brown.tar
          mv P18_erpv2_brown.tar.gz "$artifact"
          tar -tzf "$artifact" > P18_artifact_listing.txt
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|tmp|logs|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|reports)(/|$)' P18_artifact_listing.txt; then exit 1; fi
          if tar -tzf "$artifact" | grep -F 'public/assets/css/p16-fullhd.css'; then exit 1; fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "${HOME}/.ssh/P18_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/P18_deploy_key" "${HOME}/.ssh/known_hosts"

      - name: Snapshot server state and backup current ERPV2
        id: before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P18_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          OLD_ERP=/home/s/spugovxsim/planexp/public_html/erp
          ERPV2=/home/s/spugovxsim/planexp/public_html/erpv2
          DEPLOY=/home/s/spugovxsim/planexp/deploy
          BACKUPS=/home/s/spugovxsim/planexp/deploy_backups
          mkdir -p "$BACKUPS"
          oldfp="$(cd "$OLD_ERP" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          marker="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt" 2>/dev/null || true)"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$BACKUPS/P18_${ts}_${marker:-unknown}"
          mkdir -p "$backup"
          tar -C "$ERPV2" -czf "$backup/erpv2_current.tar.gz" .
          test -s "$backup/erpv2_current.tar.gz"
          printf 'oldfp=%s\nmarker=%s\nbackup=%s\n' "$oldfp" "$marker" "$backup"
          REMOTE
          )"
          printf '%s\n' "$out"
          while IFS='=' read -r key value; do
            case "$key" in oldfp|marker|backup) echo "$key=$value" >> "$GITHUB_OUTPUT" ;; esac
          done <<< "$out"

      - name: Upload and deploy through existing P07 mechanism
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P18_artifact_${BROWN_THEME_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "${HOME}/.ssh/P18_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P18_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$BROWN_THEME_SHA'"
          ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P18_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "test \"\$(cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt)\" = '$BROWN_THEME_SHA' && rm -f '$remote'"

      - name: Verify server state after deploy
        id: after
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          OLD_FP_BEFORE: ${{ steps.before.outputs.oldfp }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "${HOME}/.ssh/P18_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          OLD_ERP=/home/s/spugovxsim/planexp/public_html/erp
          ERPV2=/home/s/spugovxsim/planexp/public_html/erpv2
          DEPLOY=/home/s/spugovxsim/planexp/deploy
          oldfp="$(cd "$OLD_ERP" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          marker="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt" 2>/dev/null || true)"
          p16ref=NO
          if grep -R --line-number --fixed-strings 'p16-fullhd.css' "$ERPV2/app" "$ERPV2/public" 2>/dev/null; then p16ref=YES; fi
          printf 'oldfp=%s\nmarker=%s\np16ref=%s\n' "$oldfp" "$marker" "$p16ref"
          REMOTE
          )"
          printf '%s\n' "$out"
          oldfp_after="$(printf '%s\n' "$out" | sed -n 's/^oldfp=//p')"
          marker_after="$(printf '%s\n' "$out" | sed -n 's/^marker=//p')"
          p16ref_after="$(printf '%s\n' "$out" | sed -n 's/^p16ref=//p')"
          test "$oldfp_after" = "$OLD_FP_BEFORE"
          test "$marker_after" = "$BROWN_THEME_SHA"
          test "$p16ref_after" = NO
          echo "marker=$marker_after" >> "$GITHUB_OUTPUT"
          echo "p16ref=$p16ref_after" >> "$GITHUB_OUTPUT"

      - name: HTTP smoke checks
        run: |
          set -euo pipefail
          mkdir -p P18_rollback_output
          for np in "login:/login" "dashboard:/company/dashboard" "clients:/company/clients" "trips:/company/trips/linear"; do
            name="${np%%:*}"; path="${np#*:}"
            code="$(curl -k -L -s -o /tmp/p18_page.html -w '%{http_code}' "$ERPV2_URL$path")"
            echo "$name=$code" >> P18_rollback_output/P18_HTTP.txt
            case "$code" in 200|302|401|403) ;; *) exit 1 ;; esac
          done

      - name: Playwright brown primary button check
        id: ui
        run: |
          set -euo pipefail
          mkdir -p P18_rollback_output
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({ignoreHTTPSErrors:true, viewport:{width:1920,height:1080}});
            const resp=await page.goto(process.env.ERPV2_URL + '/login', {waitUntil:'domcontentloaded', timeout:30000});
            await page.evaluate(()=>{const b=document.createElement('button');b.className='btn btn-primary p18-probe';b.textContent='probe';document.body.appendChild(b);});
            const color=await page.$eval('.p18-probe', el=>getComputedStyle(el).backgroundColor);
            const loaded=await page.evaluate(()=>Array.from(document.styleSheets).some(s=>(s.href||'').includes('p16-fullhd.css')));
            await page.screenshot({path:'P18_rollback_output/P18_login_brown.png', fullPage:true});
            await browser.close();
            require('fs').writeFileSync('P18_rollback_output/P18_UI.json', JSON.stringify({login_http:resp?resp.status():0,primary_button_computed_color:color,p16_fullhd_css_loaded:loaded},null,2));
            if(loaded) throw new Error('p16-fullhd.css is loaded');
            if(!/rgb\(124,\s*71,\s*24\)|rgb\(154,\s*90,\s*34\)/.test(color)) throw new Error('primary button is not brown: '+color);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          color="$(node -e "const j=require('./P18_rollback_output/P18_UI.json'); console.log(j.primary_button_computed_color)")"
          echo "primary_color=$color" >> "$GITHUB_OUTPUT"

      - name: Write rollback summary
        if: always()
        run: |
          mkdir -p P18_rollback_output
          cat > P18_rollback_output/P18_SUMMARY.json <<EOF
          {"status":"${{ job.status }}","workflow_commit":"${{ github.sha }}","brown_theme_sha":"$BROWN_THEME_SHA","previous_deployed_sha":"${{ steps.before.outputs.marker }}","current_deployed_sha":"${{ steps.after.outputs.marker }}","backup_created":"${{ steps.before.outputs.backup }}","p16_fullhd_css_loaded":"${{ steps.after.outputs.p16ref }}","primary_button_computed_color":"${{ steps.ui.outputs.primary_color }}","database_changed":false,"migrations_run":false,"old_erp_mutated":false}
          EOF

      - if: always()
        run: rm -f "${HOME}/.ssh/P18_deploy_key" 2>/dev/null || true

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P18_rollback_brown_${{ env.BROWN_THEME_SHA }}
          path: P18_rollback_output/
          if-no-files-found: warn
          retention-days: 30
