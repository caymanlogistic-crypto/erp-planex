name: P19 PATCH_A deploy and runtime

on:
  push:
    branches:
      - chatgpt/p19-uiux-safe-runtime-review-20260806
    paths:
      - '.github/workflows/P19_patch_a_deploy_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p19-patch-a-erpv2-deploy-runtime
  cancel-in-progress: false

env:
  TARGET_COMMIT: 91abe9c80947c277273f35ab4cf6d75b33187d4d
  EXPECTED_CURRENT_COMMIT: 8c7571c01bcd87f42c4f2e9300fc52a2499935fe

jobs:
  deploy-patch-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      old_erp_fp: ${{ steps.pre.outputs.old_erp_fp }}
      db_fp: ${{ steps.pre.outputs.db_fp }}
      backup_path: ${{ steps.pre.outputs.backup_path }}
      deployed_sha: ${{ steps.deploy.outputs.deployed_sha }}
    steps:
      - name: Checkout P19 control branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/p19-uiux-safe-runtime-review-20260806
          fetch-depth: 0

      - name: Verify exact PATCH_A production delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          git cat-file -e "${EXPECTED_CURRENT_COMMIT}^{commit}"
          changed="$(git diff --name-only "${EXPECTED_CURRENT_COMMIT}" "${TARGET_COMMIT}" -- app bootstrap config database public scripts tools tests)"
          printf '%s\n' "$changed"
          test "$changed" = $'app/View/layouts/main.php\npublic/assets/css/app.css'
          git diff "${EXPECTED_CURRENT_COMMIT}" "${TARGET_COMMIT}" -- app/View/layouts/main.php public/assets/css/app.css > P19_09_PATCH_A_DEPLOY_EXACT_DIFF.patch
          grep -Fq "fill='%237c4718'" <(git show "${TARGET_COMMIT}:app/View/layouts/main.php")
          grep -Fq 'color: var(--text-main);' <(git show "${TARGET_COMMIT}:public/assets/css/app.css")
          grep -Fq 'background: var(--surface-strong);' <(git show "${TARGET_COMMIT}:public/assets/css/app.css")
          grep -Fq 'border-radius: 2px;' <(git show "${TARGET_COMMIT}:public/assets/css/app.css")

      - name: Configure SSH
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_KEY:-}"
          test -n "${KNOWN_HOSTS:-}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19A_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P19A_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Reconfirm server guards and create backup
        id: pre
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p P19_patch_a_deploy_output
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19A_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='${GITHUB_RUN_ID}' EXPECTED_CURRENT_COMMIT='${EXPECTED_CURRENT_COMMIT}' bash -se" > P19_patch_a_deploy_output/P19_10_PATCH_A_PREDEPLOY_GUARDS.txt <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          OLD_ERP="$ROOT/public_html/erp"
          ERPV2="$ROOT/public_html/erpv2"
          DEPLOY="$ROOT/deploy"
          BACKUPS="$ROOT/deploy_backups"
          marker="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt" 2>/dev/null || true)"
          printf 'CURRENT_DEPLOYED_SHA=%s\n' "$marker"
          test "$marker" = "$EXPECTED_CURRENT_COMMIT"
          test -x "$DEPLOY/P07_deploy_erpv2.sh"
          printf 'P07_DEPLOY_AVAILABLE=YES\n'
          script_body="$(sed '/^[[:space:]]*#/d' "$DEPLOY/P07_deploy_erpv2.sh")"
          if printf '%s\n' "$script_body" | grep -Eiq '(artisan[[:space:]]+migrate|php[^[:cntrl:]]*(migrat|migration)|mysql[[:space:]][^<]*<[^[:space:]]*(migrat|migration))'; then
            printf 'MIGRATIONS_DISABLED=NO\n'
            exit 41
          fi
          printf 'MIGRATIONS_DISABLED=YES\n'
          non_erpv2="$(printf '%s\n' "$script_body" | sed 's#/erpv2##g')"
          if printf '%s\n' "$non_erpv2" | grep -Fq '/public_html/erp'; then
            printf 'TARGET_ONLY_ERPV2=NO\n'
            exit 42
          fi
          printf 'TARGET_ONLY_ERPV2=YES\n'
          oldfp="$(cd "$OLD_ERP" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          erpv2fp="$(cd "$ERPV2" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          cat > /tmp/p19a_db_fp.php <<'PHP'
          <?php
          function envf($path) {
              $out = array();
              $lines = @file($path, FILE_IGNORE_NEW_LINES);
              if ($lines === false) return $out;
              foreach ($lines as $line) {
                  $line = trim($line);
                  if ($line === '' || substr($line, 0, 1) === '#' || strpos($line, '=') === false) continue;
                  $parts = explode('=', $line, 2);
                  $out[trim($parts[0])] = trim($parts[1], " \t\n\r\0\x0B\"'");
              }
              return $out;
          }
          $e = envf('/home/s/spugovxsim/planexp/public_html/erpv2/.env');
          $host = isset($e['DB_HOST']) ? $e['DB_HOST'] : '127.0.0.1';
          $port = isset($e['DB_PORT']) ? $e['DB_PORT'] : '3306';
          $db = isset($e['DB_DATABASE']) ? $e['DB_DATABASE'] : 'erp_planex';
          $user = isset($e['DB_USERNAME']) ? $e['DB_USERNAME'] : 'root';
          $pass = isset($e['DB_PASSWORD']) ? $e['DB_PASSWORD'] : '';
          try {
              $pdo = new PDO('mysql:host='.$host.';port='.$port.';dbname='.$db.';charset=utf8mb4', $user, $pass, array(PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION));
              $tables = $pdo->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);
              sort($tables);
              $fp = array();
              foreach ($tables as $table) {
                  $escaped = str_replace('`', '``', $table);
                  $row = $pdo->query('CHECKSUM TABLE `'.$escaped.'`')->fetch(PDO::FETCH_NUM);
                  $fp[] = $table.':'.(isset($row[1]) ? $row[1] : 'NULL');
              }
              echo hash('sha256', implode('|', $fp));
          } catch (Exception $ex) { exit(2); }
          PHP
          dbfp="$(php /tmp/p19a_db_fp.php)"
          rm -f /tmp/p19a_db_fp.php
          printf '%s' "$dbfp" | grep -Eq '^[0-9a-f]{64}$'
          backup="$BACKUPS/P19A_${GITHUB_RUN_ID}_${marker}"
          test ! -e "$backup"
          mkdir -p "$BACKUPS"
          cp -a "$ERPV2" "$backup"
          test -d "$backup"
          printf 'OLD_ERP_FINGERPRINT=%s\nERPV2_FINGERPRINT_BEFORE=%s\nDB_FINGERPRINT=%s\nBACKUP_PATH=%s\nBACKUP_CREATED=YES\n' "$oldfp" "$erpv2fp" "$dbfp" "$backup"
          REMOTE
          cat P19_patch_a_deploy_output/P19_10_PATCH_A_PREDEPLOY_GUARDS.txt
          old_fp="$(awk -F= '/^OLD_ERP_FINGERPRINT=/{print $2}' P19_patch_a_deploy_output/P19_10_PATCH_A_PREDEPLOY_GUARDS.txt)"
          db_fp="$(awk -F= '/^DB_FINGERPRINT=/{print $2}' P19_patch_a_deploy_output/P19_10_PATCH_A_PREDEPLOY_GUARDS.txt)"
          backup_path="$(awk -F= '/^BACKUP_PATH=/{sub(/^BACKUP_PATH=/,"");print}' P19_patch_a_deploy_output/P19_10_PATCH_A_PREDEPLOY_GUARDS.txt)"
          test -n "$old_fp"; test -n "$db_fp"; test -n "$backup_path"
          printf 'old_erp_fp=%s\n' "$old_fp" >> "$GITHUB_OUTPUT"
          printf 'db_fp=%s\n' "$db_fp" >> "$GITHUB_OUTPUT"
          printf 'backup_path=%s\n' "$backup_path" >> "$GITHUB_OUTPUT"

      - name: Build exact P07 artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P19_patch_a_deploy_output
          artifact="P19A_erpv2_${TARGET_COMMIT}.tar.gz"
          git archive --format=tar --output=P19A_erpv2.tar "$TARGET_COMMIT" -- app bootstrap config database public scripts tools tests
          gzip -n P19A_erpv2.tar
          mv P19A_erpv2.tar.gz "$artifact"
          tar -tzf "$artifact" > P19_patch_a_deploy_output/P19_11_PATCH_A_ARTIFACT_LISTING.txt
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|tmp|logs|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|reports)(/|$)' P19_patch_a_deploy_output/P19_11_PATCH_A_ARTIFACT_LISTING.txt; then
            echo 'Forbidden path in deployment artifact' >&2
            exit 1
          fi
          sha="$(sha256sum "$artifact" | awk '{print $1}')"
          printf '%s\n' "$TARGET_COMMIT" > P19_patch_a_deploy_output/P19_12_PATCH_A_TARGET_SHA.txt
          printf '%s\n' "$sha" > P19_patch_a_deploy_output/P19_13_PATCH_A_ARTIFACT_SHA256.txt
          printf 'artifact=%s\nsha=%s\n' "$artifact" "$sha" >> "$GITHUB_OUTPUT"

      - name: Upload private artifact to deploy area
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P19A_artifact_${TARGET_COMMIT}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P19A_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"

      - name: Deploy exact PATCH_A through P07
        id: deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p P19_patch_a_deploy_output
          remote="/home/s/spugovxsim/planexp/deploy/P19A_artifact_${TARGET_COMMIT}.tar.gz"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19A_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$TARGET_COMMIT'" \
            | tee P19_patch_a_deploy_output/P19_14_PATCH_A_P07_DEPLOY_LOG.txt
          deployed="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19A_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$deployed" = "$TARGET_COMMIT"
          printf 'deployed_sha=%s\n' "$deployed" >> "$GITHUB_OUTPUT"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19A_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote'"

      - name: Verify post-deploy invariants
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          PRE_OLD_FP: ${{ steps.pre.outputs.old_erp_fp }}
          PRE_DB_FP: ${{ steps.pre.outputs.db_fp }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19A_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PRE_OLD_FP='$PRE_OLD_FP' PRE_DB_FP='$PRE_DB_FP' TARGET_COMMIT='$TARGET_COMMIT' bash -se" > P19_patch_a_deploy_output/P19_15_PATCH_A_POSTDEPLOY_GUARDS.txt <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          OLD_ERP="$ROOT/public_html/erp"
          DEPLOY="$ROOT/deploy"
          marker="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt")"
          test "$marker" = "$TARGET_COMMIT"
          oldfp="$(cd "$OLD_ERP" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          cat > /tmp/p19a_db_fp_after.php <<'PHP'
          <?php
          function envf($path){$o=array();$l=@file($path,FILE_IGNORE_NEW_LINES);if($l===false)return $o;foreach($l as $x){$x=trim($x);if($x===''||substr($x,0,1)==='#'||strpos($x,'=')===false)continue;$p=explode('=',$x,2);$o[trim($p[0])]=trim($p[1]," \t\n\r\0\x0B\"'");}return $o;}
          $e=envf('/home/s/spugovxsim/planexp/public_html/erpv2/.env');$h=isset($e['DB_HOST'])?$e['DB_HOST']:'127.0.0.1';$p=isset($e['DB_PORT'])?$e['DB_PORT']:'3306';$d=isset($e['DB_DATABASE'])?$e['DB_DATABASE']:'erp_planex';$u=isset($e['DB_USERNAME'])?$e['DB_USERNAME']:'root';$w=isset($e['DB_PASSWORD'])?$e['DB_PASSWORD']:'';
          try{$q=new PDO('mysql:host='.$h.';port='.$p.';dbname='.$d.';charset=utf8mb4',$u,$w,array(PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION));$t=$q->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);sort($t);$f=array();foreach($t as $x){$r=$q->query('CHECKSUM TABLE `'.str_replace('`','``',$x).'`')->fetch(PDO::FETCH_NUM);$f[]=$x.':'.(isset($r[1])?$r[1]:'NULL');}echo hash('sha256',implode('|',$f));}catch(Exception $e){exit(2);} 
          PHP
          dbfp="$(php /tmp/p19a_db_fp_after.php)"
          rm -f /tmp/p19a_db_fp_after.php
          test "$oldfp" = "$PRE_OLD_FP"
          test "$dbfp" = "$PRE_DB_FP"
          printf 'DEPLOYED_SHA=%s\nOLD_ERP_FINGERPRINT=%s\nDB_FINGERPRINT=%s\nOLD_ERP_UNCHANGED=YES\nDATABASE_UNCHANGED=YES\n' "$marker" "$oldfp" "$dbfp"
          REMOTE
          cat P19_patch_a_deploy_output/P19_15_PATCH_A_POSTDEPLOY_GUARDS.txt
          public_marker="$(curl -fsSL --max-time 30 https://plan-ex.ru/erpv2/DEPLOYED_COMMIT.txt)"
          test "$public_marker" = "$TARGET_COMMIT"
          code="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$code" = '200'
          printf 'PUBLIC_MARKER=%s\nERPV2_LOGIN_HTTP=%s\n' "$public_marker" "$code" | tee P19_patch_a_deploy_output/P19_16_PATCH_A_PUBLIC_HTTP.txt

      - name: Upload PATCH_A deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P19_patch_a_deploy_evidence_${{ github.run_id }}
          path: |
            P19_09_PATCH_A_DEPLOY_EXACT_DIFF.patch
            P19_patch_a_deploy_output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/P19A_deploy_key" 2>/dev/null || true

  runtime-patch-a:
    needs: deploy-patch-a
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout P19 control branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/p19-uiux-safe-runtime-review-20260806
          fetch-depth: 0

      - name: Resolve existing runtime credentials
        shell: bash
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          source_label='ACTIONS_SECRET'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir" "$HOME/.ssh/P19A_runtime_key" 2>/dev/null || true' EXIT
          if [ -z "$credentials" ]; then
            source_label='P11_ENCRYPTED_FALLBACK'
            git fetch --quiet origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > "$tmpdir/decrypt.py"
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > "$tmpdir/credentials.enc.json"
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19A_runtime_key"
            chmod 600 "$HOME/.ssh/P19A_runtime_key"
            credentials="$(python "$tmpdir/decrypt.py" --key "$HOME/.ssh/P19A_runtime_key" --input "$tmpdir/credentials.enc.json")"
          fi
          test -n "$credentials"
          echo "::add-mask::$credentials"
          CREDENTIALS="$credentials" python - <<'PY'
          import base64,json,os
          d=json.loads(base64.b64decode(os.environ['CREDENTIALS']).decode())
          roles={str(x.get('role','')).upper() for x in d if isinstance(x,dict)}
          need={'SUPERADMIN','OWNER','LOGIST'}
          missing=sorted(need-roles)
          print('RUNTIME_REQUIRED_ROLES=' + ','.join(sorted(need)))
          print('SENIOR_LOGIST=NOT_TESTED_CREDENTIAL_UNAVAILABLE')
          if missing: raise SystemExit('Missing required roles: '+','.join(missing))
          PY
          printf 'P19_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"
          printf 'RUNTIME_CREDENTIAL_SOURCE=%s\n' "$source_label" >> "$GITHUB_ENV"

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright 1.54.2 Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify deployed marker before browser audit
        shell: bash
        run: |
          set -euo pipefail
          marker="$(curl -fsSL --max-time 30 https://plan-ex.ru/erpv2/DEPLOYED_COMMIT.txt)"
          test "$marker" = "$TARGET_COMMIT"
          printf 'P19_DEPLOYED_SHA=%s\n' "$marker" >> "$GITHUB_ENV"

      - name: Execute non-mutating PATCH_A browser matrix
        shell: bash
        env:
          P19_OUT: P19_patch_a_runtime_output
        run: |
          set -euo pipefail
          node --check .github/p19/P19_patch_a_runtime.js
          node .github/p19/P19_patch_a_runtime.js | tee P19_patch_a_runtime_console.txt

      - name: Recheck DB and old ERP fingerprints after browser runtime
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          PRE_OLD_FP: ${{ needs.deploy-patch-a.outputs.old_erp_fp }}
          PRE_DB_FP: ${{ needs.deploy-patch-a.outputs.db_fp }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19A_verify_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P19A_verify_key" "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19A_verify_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "PRE_OLD_FP='$PRE_OLD_FP' PRE_DB_FP='$PRE_DB_FP' TARGET_COMMIT='$TARGET_COMMIT' bash -se" > P19_patch_a_runtime_output/P19_17_PATCH_A_POSTRUNTIME_INVARIANTS.txt <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          oldfp="$(cd "$ROOT/public_html/erp" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          cat > /tmp/p19a_db_fp_runtime.php <<'PHP'
          <?php
          function envf($path){$o=array();$l=@file($path,FILE_IGNORE_NEW_LINES);if($l===false)return $o;foreach($l as $x){$x=trim($x);if($x===''||substr($x,0,1)==='#'||strpos($x,'=')===false)continue;$p=explode('=',$x,2);$o[trim($p[0])]=trim($p[1]," \t\n\r\0\x0B\"'");}return $o;}
          $e=envf('/home/s/spugovxsim/planexp/public_html/erpv2/.env');$h=isset($e['DB_HOST'])?$e['DB_HOST']:'127.0.0.1';$p=isset($e['DB_PORT'])?$e['DB_PORT']:'3306';$d=isset($e['DB_DATABASE'])?$e['DB_DATABASE']:'erp_planex';$u=isset($e['DB_USERNAME'])?$e['DB_USERNAME']:'root';$w=isset($e['DB_PASSWORD'])?$e['DB_PASSWORD']:'';
          try{$q=new PDO('mysql:host='.$h.';port='.$p.';dbname='.$d.';charset=utf8mb4',$u,$w,array(PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION));$t=$q->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);sort($t);$f=array();foreach($t as $x){$r=$q->query('CHECKSUM TABLE `'.str_replace('`','``',$x).'`')->fetch(PDO::FETCH_NUM);$f[]=$x.':'.(isset($r[1])?$r[1]:'NULL');}echo hash('sha256',implode('|',$f));}catch(Exception $e){exit(2);} 
          PHP
          dbfp="$(php /tmp/p19a_db_fp_runtime.php)"; rm -f /tmp/p19a_db_fp_runtime.php
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          test "$marker" = "$TARGET_COMMIT"
          test "$oldfp" = "$PRE_OLD_FP"
          test "$dbfp" = "$PRE_DB_FP"
          printf 'DEPLOYED_SHA=%s\nOLD_ERP_FINGERPRINT=%s\nDB_FINGERPRINT=%s\nOLD_ERP_UNCHANGED=YES\nDATABASE_UNCHANGED=YES\n' "$marker" "$oldfp" "$dbfp"
          REMOTE
          cat P19_patch_a_runtime_output/P19_17_PATCH_A_POSTRUNTIME_INVARIANTS.txt
          rm -f "$HOME/.ssh/P19A_verify_key"

      - name: Write PATCH_A decision
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='P19_patch_a_runtime_output/P19_07_PATCH_A_RUNTIME_SUMMARY.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='PASS'
          out={
            'decision':'PATCH_A_ACCEPTED',
            'deployed_sha':d.get('deployedSha'),
            'required_roles':['SUPERADMIN','OWNER','LOGIST'],
            'senior_logist':'NOT_TESTED_CREDENTIAL_UNAVAILABLE',
            'database_changed':False,
            'old_erp_changed':False,
            'viewports':['1920x1080','1536x864','1366x768']
          }
          json.dump(out,open('P19_patch_a_runtime_output/P19_18_PATCH_A_DECISION.json','w'),ensure_ascii=False,indent=2)
          PY

      - name: Upload PATCH_A runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P19_patch_a_runtime_evidence_${{ github.run_id }}
          path: |
            P19_patch_a_runtime_output/
            P19_patch_a_runtime_console.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clear credential environment
        if: always()
        shell: bash
        run: |
          printf 'P19_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "$HOME/.ssh/P19A_verify_key" 2>/dev/null || true
