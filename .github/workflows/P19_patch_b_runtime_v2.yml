name: P19 PATCH_B isolated runtime v2

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths:
      - '.github/workflows/P19_patch_b_runtime_v2.yml'
      - '.github/p19/P19_patch_b_runtime_v2.js'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_A: ef47dabe3249625280e6577de7b249f5b4d14a9d
  DEPLOYED_B: f42a37539da13d50af1fddefe528a82dba022dbe
  EXPECTED_OLD_ERP_FP: c6a6522dacbe0c919ba5d22f4cf0501426a6ce31bc8ac091405537076e9a42da
  EXPECTED_DB_FP: cca07e25969163877994635a6a99209e84cd26fc9eb0d793f638a0c6d9106d0a
  OUT: P19_patch_b_runtime_v2_output

jobs:
  runtime-b-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p19-execution-isolated-20260807
          fetch-depth: 0
      - name: Prepare scope and DB helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --quiet origin chatgpt/p19-uiux-safe-runtime-review-20260806 chatgpt/p19-patch-b-deploy-exact-20260807
          git show origin/chatgpt/p19-uiux-safe-runtime-review-20260806:.github/p19/P19_readonly_db_fingerprint.php > /tmp/P19_db_fp.php
          node --check .github/p19/P19_patch_b_runtime_v2.js
          changed="$(git diff --name-only "$ACCEPTED_A" "$DEPLOYED_B" -- app bootstrap config database public scripts tools tests)"
          test "$changed" = 'public/assets/css/finance-operation-actions.css'
          printf 'PATCH_B_BACKEND_CHANGED=NO\nPATCH_B_CHANGED_FILES=%s\n' "$changed" > "$OUT/P19_61_PATCH_B_SCOPE_PROOF.txt"
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19B_v2_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P19B_v2_key" "$HOME/.ssh/known_hosts"
      - name: Pre-runtime invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P19B_v2_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/P19_db_fp.php "$SSH_USER@$SSH_HOST:/tmp/P19B_v2_db_${GITHUB_RUN_ID}.php"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19B_v2_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' DEPLOYED_B='$DEPLOYED_B' EXPECTED_OLD_ERP_FP='$EXPECTED_OLD_ERP_FP' EXPECTED_DB_FP='$EXPECTED_DB_FP' bash -se" > "$OUT/P19_62_PATCH_B_PRE_GUARDS.txt" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$ROOT/public_html/erp"&&find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null|sort|sha256sum|awk '{print $1}')"
          dbfp="$(php "/tmp/P19B_v2_db_${GITHUB_RUN_ID}.php")"
          test "$marker" = "$DEPLOYED_B"; test "$oldfp" = "$EXPECTED_OLD_ERP_FP"; test "$dbfp" = "$EXPECTED_DB_FP"
          printf 'DEPLOYED_SHA=%s\nOLD_ERP_FINGERPRINT=%s\nDB_FINGERPRINT=%s\nOLD_ERP_UNCHANGED=YES\nDATABASE_UNCHANGED=YES\n' "$marker" "$oldfp" "$dbfp"
          REMOTE
      - name: Resolve OWNER LOGIST credentials
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"; tmpdir="$(mktemp -d)"; source_label='ACTIONS_SECRET'
          if [ -z "$credentials" ]; then
            source_label='P11_ENCRYPTED_FALLBACK'
            git fetch --quiet origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > "$tmpdir/decrypt.py"
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > "$tmpdir/credentials.enc.json"
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19B_v2_cred_key"; chmod 600 "$HOME/.ssh/P19B_v2_cred_key"
            credentials="$(python "$tmpdir/decrypt.py" --key "$HOME/.ssh/P19B_v2_cred_key" --input "$tmpdir/credentials.enc.json")"
          fi
          echo "::add-mask::$credentials"
          CREDENTIALS="$credentials" python - <<'PY'
          import base64,json,os
          d=json.loads(base64.b64decode(os.environ['CREDENTIALS']).decode('utf-8'))
          roles={str(x.get('role','')).upper() for x in d if isinstance(x,dict)}
          missing={'OWNER','LOGIST'}-roles
          if missing: raise SystemExit('Missing roles: '+','.join(sorted(missing)))
          print('PATCH_B_RUNTIME_ROLES=OWNER,LOGIST')
          print('SENIOR_LOGIST=NOT_TESTED_CREDENTIAL_UNAVAILABLE')
          PY
          printf 'P19_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"
          rm -rf "$tmpdir" "$HOME/.ssh/P19B_v2_cred_key"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright 1.54.2 Chromium
        run: |
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Execute corrected PATCH_B runtime
        env:
          P19_OUT: ${{ env.OUT }}
          P19_DEPLOYED_SHA: ${{ env.DEPLOYED_B }}
        run: node .github/p19/P19_patch_b_runtime_v2.js | tee "$OUT/P19_63_PATCH_B_RUNTIME_V2_CONSOLE.txt"
      - name: Post-runtime invariants
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19B_v2_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' DEPLOYED_B='$DEPLOYED_B' EXPECTED_OLD_ERP_FP='$EXPECTED_OLD_ERP_FP' EXPECTED_DB_FP='$EXPECTED_DB_FP' bash -se" > "$OUT/P19_64_PATCH_B_POST_GUARDS.txt" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$ROOT/public_html/erp"&&find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null|sort|sha256sum|awk '{print $1}')"
          dbfp="$(php "/tmp/P19B_v2_db_${GITHUB_RUN_ID}.php")"
          test "$marker" = "$DEPLOYED_B"; test "$oldfp" = "$EXPECTED_OLD_ERP_FP"; test "$dbfp" = "$EXPECTED_DB_FP"
          printf 'DEPLOYED_SHA=%s\nOLD_ERP_FINGERPRINT=%s\nDB_FINGERPRINT=%s\nOLD_ERP_UNCHANGED=YES\nDATABASE_UNCHANGED=YES\n' "$marker" "$oldfp" "$dbfp"
          rm -f "/tmp/P19B_v2_db_${GITHUB_RUN_ID}.php"
          REMOTE
      - name: Write PATCH_B acceptance decision
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['OUT'],'P19_60_PATCH_B_RUNTIME_SUMMARY_V2.json'),encoding='utf-8')); assert d['status']=='PASS'
          out={'decision':'PATCH_B_ACCEPTED','accepted_a':os.environ['ACCEPTED_A'],'deployed_b':os.environ['DEPLOYED_B'],'owner':'PASS','logist':'PASS_EXPECTED_FINANCE_DENY','senior_logist':'NOT_TESTED_CREDENTIAL_UNAVAILABLE','known_unrelated_backend_finding':'HTTP 500 on unchanged finance operation history endpoint','database_changed':False,'old_erp_changed':False,'rollback_backup':'/home/s/spugovxsim/planexp/deploy_backups/P19B_31166803648_ef47dabe3249625280e6577de7b249f5b4d14a9d'}
          json.dump(out,open(os.path.join(os.environ['OUT'],'P19_65_PATCH_B_DECISION.json'),'w'),ensure_ascii=False,indent=2)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P19_patch_b_runtime_v2_${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: |
          printf 'P19_CREDENTIALS_B64=\n' >> "$GITHUB_ENV"
          rm -f "$HOME/.ssh/P19B_v2_key" /tmp/P19_db_fp.php 2>/dev/null || true
