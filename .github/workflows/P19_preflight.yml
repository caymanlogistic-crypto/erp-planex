name: P19 Preflight

on:
  push:
    branches:
      - chatgpt/p19-uiux-safe-runtime-review-20260806
    paths:
      - '.github/workflows/P19_preflight.yml'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/P19_preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout P19 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required SSH secrets by name
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then echo 'MISSING_SECRET=ERPV2_SSH_PRIVATE_KEY'; missing=1; fi
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then echo 'MISSING_SECRET=ERPV2_SSH_KNOWN_HOSTS'; missing=1; fi
          if [ -z "${SSH_HOST:-}" ]; then echo 'MISSING_SECRET=ERPV2_SSH_HOST'; missing=1; fi
          if [ -z "${SSH_PORT:-}" ]; then echo 'MISSING_SECRET=ERPV2_SSH_PORT'; missing=1; fi
          if [ -z "${SSH_USER:-}" ]; then echo 'MISSING_SECRET=ERPV2_SSH_USER'; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'REQUIRED_SSH_SECRETS=PASS'

      - name: Resolve historical runtime credential channel securely
        shell: bash
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          source_label='ACTIONS_SECRET'
          tmpdir="$(mktemp -d)"
          cleanup() {
            rm -rf "$tmpdir"
            rm -f "$HOME/.ssh/P19_runtime_credentials_key" 2>/dev/null || true
          }
          trap cleanup EXIT

          if [ -z "$credentials" ]; then
            source_label='P11_ENCRYPTED_FALLBACK'
            git fetch --quiet origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > "$tmpdir/P11_decrypt_credentials.py"
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > "$tmpdir/P11_runtime_credentials.enc.json"
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19_runtime_credentials_key"
            chmod 600 "$HOME/.ssh/P19_runtime_credentials_key"
            credentials="$(python "$tmpdir/P11_decrypt_credentials.py" --key "$HOME/.ssh/P19_runtime_credentials_key" --input "$tmpdir/P11_runtime_credentials.enc.json")"
          fi

          if [ -z "$credentials" ]; then
            echo 'RUNTIME_CREDENTIAL_CHANNEL=FAIL'
            exit 1
          fi
          echo "::add-mask::${credentials}"
          echo "RUNTIME_CREDENTIAL_SOURCE=${source_label}"
          echo 'RUNTIME_CREDENTIAL_CHANNEL=PASS'

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/P19_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P19_key" "$HOME/.ssh/known_hosts"

      - name: Read server state and guards
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p P19_preflight_output
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' > P19_preflight_output/P19_SERVER_STATE.txt <<'REMOTE'
          set -euo pipefail
          OLD_ERP=/home/s/spugovxsim/planexp/public_html/erp
          ERPV2=/home/s/spugovxsim/planexp/public_html/erpv2
          DEPLOY=/home/s/spugovxsim/planexp/deploy
          marker="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt" 2>/dev/null || true)"
          p07=NO
          test -x "$DEPLOY/P07_deploy_erpv2.sh" && p07=YES
          oldfp="$(cd "$OLD_ERP" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          erpv2fp="$(cd "$ERPV2" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          phpver="$(php -r 'echo PHP_VERSION;' 2>/dev/null || echo UNAVAILABLE)"
          dbfp=UNAVAILABLE
          if command -v php >/dev/null 2>&1 && php -m 2>/dev/null | grep -qi pdo_mysql; then
            cat > /tmp/p19_db_fp.php <<'PHP'
          <?php
          function envf($path) {
              $out = array();
              $lines = @file($path, FILE_IGNORE_NEW_LINES);
              if ($lines === false) return $out;
              foreach ($lines as $line) {
                  $line = trim($line);
                  if ($line === '' || substr($line, 0, 1) === '#' || strpos($line, '=') === false) continue;
                  $parts = explode('=', $line, 2);
                  $out[trim($parts[0])] = trim($parts[1], " \t\n\r\0\x0B\"'");
              }
              return $out;
          }
          $e = envf('/home/s/spugovxsim/planexp/public_html/erpv2/.env');
          $host = isset($e['DB_HOST']) ? $e['DB_HOST'] : '127.0.0.1';
          $port = isset($e['DB_PORT']) ? $e['DB_PORT'] : '3306';
          $db = isset($e['DB_DATABASE']) ? $e['DB_DATABASE'] : 'erp_planex';
          $user = isset($e['DB_USERNAME']) ? $e['DB_USERNAME'] : 'root';
          $pass = isset($e['DB_PASSWORD']) ? $e['DB_PASSWORD'] : '';
          try {
              $pdo = new PDO('mysql:host='.$host.';port='.$port.';dbname='.$db.';charset=utf8mb4', $user, $pass, array(PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION));
              $tables = $pdo->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);
              sort($tables);
              $fingerprint = array();
              foreach ($tables as $table) {
                  $escaped = str_replace('`', '``', $table);
                  $row = $pdo->query('CHECKSUM TABLE `'.$escaped.'`')->fetch(PDO::FETCH_NUM);
                  $fingerprint[] = $table.':'.(isset($row[1]) ? $row[1] : 'NULL');
              }
              echo hash('sha256', implode('|', $fingerprint));
          } catch (Exception $ex) {
              exit(2);
          }
          PHP
            dbfp="$(php /tmp/p19_db_fp.php 2>/dev/null || true)"
            rm -f /tmp/p19_db_fp.php
            if ! printf '%s' "$dbfp" | grep -Eq '^[0-9a-f]{64}$'; then dbfp=UNAVAILABLE; fi
          fi
          printf 'CURRENT_DEPLOYED_SHA=%s\nP07_DEPLOY_AVAILABLE=%s\nOLD_ERP_FINGERPRINT=%s\nERPV2_FINGERPRINT=%s\nDB_FINGERPRINT=%s\nSERVER_PHP_VERSION=%s\n' "$marker" "$p07" "$oldfp" "$erpv2fp" "$dbfp" "$phpver"
          REMOTE
          grep -F 'P07_DEPLOY_AVAILABLE=YES' P19_preflight_output/P19_SERVER_STATE.txt
          grep -Eq '^CURRENT_DEPLOYED_SHA=[0-9a-f]{40}$' P19_preflight_output/P19_SERVER_STATE.txt
          grep -Eq '^OLD_ERP_FINGERPRINT=[0-9a-f]{64}$' P19_preflight_output/P19_SERVER_STATE.txt
          grep -Eq '^ERPV2_FINGERPRINT=[0-9a-f]{64}$' P19_preflight_output/P19_SERVER_STATE.txt
          grep -Eq '^DB_FINGERPRINT=[0-9a-f]{64}$' P19_preflight_output/P19_SERVER_STATE.txt

      - name: HTTP availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P19_preflight_output
          for item in erpv2_login:https://plan-ex.ru/erpv2/login old_erp:https://plan-ex.ru/erp/; do
            name=${item%%:*}; url=${item#*:}
            code=$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            printf '%s=%s\n' "$name" "$code" | tee -a P19_preflight_output/P19_HTTP.txt
            case "$code" in 200|302|401|403) ;; *) exit 1 ;; esac
          done

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Playwright installation capability
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node -e "const {chromium}=require('playwright'); console.log(Boolean(chromium)?'PLAYWRIGHT_ACTIONS_AVAILABLE=PASS':'PLAYWRIGHT_ACTIONS_AVAILABLE=FAIL')"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          mkdir -p P19_preflight_output
          printf '{"status":"%s","run_id":"%s","job":"preflight","head_sha":"%s"}\n' "${{ job.status }}" "${{ github.run_id }}" "${{ github.sha }}" > P19_preflight_output/P19_PREFLIGHT_SUMMARY.json
          rm -f "$HOME/.ssh/P19_key" 2>/dev/null || true

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P19_preflight_output
          path: P19_preflight_output/
          if-no-files-found: error
          retention-days: 30
