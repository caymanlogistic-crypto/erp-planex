name: P19 Runtime credential inventory

on:
  push:
    branches: [chatgpt/p19-uiux-safe-runtime-review-20260806]
    paths: ['.github/workflows/P19_runtime_credential_probe.yml']
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]
    paths: ['.github/workflows/P19_runtime_credential_probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Resolve channels and report role names only
        shell: bash
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p P19_credential_probe_output "$HOME/.ssh" /tmp/P19_credentials
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P19_probe_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P19_probe_key" "$HOME/.ssh/known_hosts"

          actions_payload="${SECRET_CREDENTIALS:-}"
          if [ -n "$actions_payload" ]; then echo "::add-mask::$actions_payload"; fi

          git fetch --quiet origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > /tmp/P19_credentials/decrypt.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > /tmp/P19_credentials/credentials.enc.json
          python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
          encrypted_payload="$(python /tmp/P19_credentials/decrypt.py --key "$HOME/.ssh/P19_probe_key" --input /tmp/P19_credentials/credentials.enc.json)"
          echo "::add-mask::$encrypted_payload"

          server_payload="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/P19_probe_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "test -f /home/s/spugovxsim/planexp/deploy/P11_runtime_credentials.b64 && cat /home/s/spugovxsim/planexp/deploy/P11_runtime_credentials.b64 || true")"
          if [ -n "$server_payload" ]; then echo "::add-mask::$server_payload"; fi

          ACTIONS_PAYLOAD="$actions_payload" ENCRYPTED_PAYLOAD="$encrypted_payload" SERVER_PAYLOAD="$server_payload" python <<'PY'
          import base64, json, os
          out = {}
          for name, env in [('ACTIONS_SECRET','ACTIONS_PAYLOAD'),('P11_ENCRYPTED','ENCRYPTED_PAYLOAD'),('SERVER_FALLBACK','SERVER_PAYLOAD')]:
              raw = os.environ.get(env, '')
              roles = []
              valid = False
              if raw:
                  try:
                      data = json.loads(base64.b64decode(raw).decode('utf-8'))
                      if isinstance(data, list):
                          roles = sorted({str(x.get('role','')).upper() for x in data if isinstance(x,dict) and x.get('role')})
                          valid = True
                  except Exception:
                      pass
              out[name] = {'present': bool(raw), 'valid_bundle': valid, 'roles': roles, 'count': len(roles)}
          all_roles = sorted(set().union(*(set(v['roles']) for v in out.values())))
          required = {'SUPERADMIN','OWNER','SENIOR_LOGIST','LOGIST','LOGIST_1','LOGIST_2'}
          normalized = set(all_roles)
          has_super = 'SUPERADMIN' in normalized
          has_owner = 'OWNER' in normalized
          has_senior = 'SENIOR_LOGIST' in normalized
          has_logist = bool({'LOGIST','LOGIST_1','LOGIST_2'} & normalized)
          result = {'channels':out,'all_roles':all_roles,'required_readonly_roles_available': {'SUPERADMIN':has_super,'OWNER':has_owner,'SENIOR_LOGIST':has_senior,'LOGIST':has_logist},'pass':has_super and has_owner and has_senior and has_logist}
          with open('P19_credential_probe_output/P19_CREDENTIAL_ROLE_INVENTORY.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print('CREDENTIAL_ROLE_NAMES=' + ','.join(all_roles))
          print('READONLY_FOUR_ROLE_CREDENTIALS=' + ('PASS' if result['pass'] else 'FAIL'))
          raise SystemExit(0 if result['pass'] else 2)
          PY

      - if: always()
        shell: bash
        run: rm -rf /tmp/P19_credentials "$HOME/.ssh/P19_probe_key" 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P19_credential_probe_output
          path: P19_credential_probe_output/
          if-no-files-found: error
          retention-days: 30
