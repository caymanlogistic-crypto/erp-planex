name: P20 deploy finance history fix

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
  workflow_dispatch:

permissions:
  contents: read

env:
  P19_SHA: f42a37539da13d50af1fddefe528a82dba022dbe
  P20_SHA: b96c085a254a885da26f8f5ca342b3781aea12ad
  IMPL_BRANCH: chatgpt/p20-finance-operation-history-fix-20260807-impl
  EXPECTED_OLD_ERP_FP: c6a6522dacbe0c919ba5d22f4cf0501426a6ce31bc8ac091405537076e9a42da
  EXPECTED_DB_FP: cca07e25969163877994635a6a99209e84cd26fc9eb0d793f638a0c6d9106d0a
  EXPECTED_P07_SHA256: 1e3328e2cd40dc2139eb9f87f01a69c848717b4b1ba4785ce8ecd8feeecb6b95
  TEST_TENANT_ID: '25'
  OUT: P20_deploy_output

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p20-execution-isolated-20260807
          fetch-depth: 0
      - name: Fetch exact P20 and prepare helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --quiet origin "$IMPL_BRANCH" chatgpt/p19-uiux-safe-runtime-review-20260806
          test "$(git rev-parse "origin/$IMPL_BRANCH")" = "$P20_SHA"
          test "$(git rev-parse "$P20_SHA^")" = "$P19_SHA"
          changed="$(git diff --name-only "$P19_SHA" "$P20_SHA")"
          expected=$'app/Http/Controllers/Company/FinanceOperationActions/history.php\napp/Support/entrypoint_dependencies.php\ntests/p20_finance_operation_history_regression_test.php'
          test "$changed" = "$expected"
          git show origin/chatgpt/p19-uiux-safe-runtime-review-20260806:.github/p19/P19_readonly_db_fingerprint.php > /tmp/P20_db_fp.php
          cp .github/p20/P20_tenant_fingerprint.php /tmp/P20_tenant_fp.php
          php -l /tmp/P20_tenant_fp.php
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P20_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P20_deploy_key" "$HOME/.ssh/known_hosts"
      - name: Upload read-only fingerprint helpers
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/P20_db_fp.php "$SSH_USER@$SSH_HOST:/tmp/P20_db_fp_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/P20_tenant_fp.php "$SSH_USER@$SSH_HOST:/tmp/P20_tenant_fp_${GITHUB_RUN_ID}.php"
      - name: Pre-deploy server guards backup and fingerprints
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' P19_SHA='$P19_SHA' EXPECTED_OLD_ERP_FP='$EXPECTED_OLD_ERP_FP' EXPECTED_DB_FP='$EXPECTED_DB_FP' EXPECTED_P07_SHA256='$EXPECTED_P07_SHA256' TEST_TENANT_ID='$TEST_TENANT_ID' bash -se" > "$OUT/P20_PREDEPLOY.txt" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          OLD="$ROOT/public_html/erp"
          P07="$ROOT/deploy/P07_deploy_erpv2.sh"
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          test "$marker" = "$P19_SHA"
          p07sha="$(sha256sum "$P07"|awk '{print $1}')"; test "$p07sha" = "$EXPECTED_P07_SHA256"; test -x "$P07"
          grep -Fq 'LIVE="$ROOT/public_html/erpv2"' "$P07"
          if sed '/^[[:space:]]*#/d' "$P07" | grep -Eiq '(artisan[[:space:]]+migrate|php[^[:cntrl:]]*(migrat|migration)|mysql[[:space:]][^<]*<[^[:space:]]*(migrat|migration))'; then echo MIGRATIONS_DISABLED=NO; exit 41; fi
          oldfp="$(cd "$OLD"&&find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null|sort|sha256sum|awk '{print $1}')"
          dbfp="$(php "/tmp/P20_db_fp_${GITHUB_RUN_ID}.php")"
          test "$oldfp" = "$EXPECTED_OLD_ERP_FP"; test "$dbfp" = "$EXPECTED_DB_FP"
          PHPBIN=''; for c in php83 php8.3 /usr/local/bin/php83 /usr/bin/php83 /usr/bin/php8.3; do if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PHPBIN="$c"; break; fi; done; test -n "$PHPBIN"
          tenantfp="$(P20_ROOT="$LIVE" P20_COMPANY_ID="$TEST_TENANT_ID" "$PHPBIN" "/tmp/P20_tenant_fp_${GITHUB_RUN_ID}.php")"; test -n "$tenantfp"
          backup="$ROOT/deploy_backups/P20_${GITHUB_RUN_ID}_${marker}"
          test ! -e "$backup"; cp -a "$LIVE" "$backup"; test -d "$backup"
          printf 'CURRENT_MARKER=%s\nP07_SHA256=%s\nOLD_ERP_FP=%s\nDB_FP=%s\nTEST_TENANT_FP=%s\nBACKUP_PATH=%s\nMIGRATIONS_DISABLED=YES\nTARGET_ONLY_ERPV2=YES\nACCEPTED_UI_SHA=%s\n' "$marker" "$p07sha" "$oldfp" "$dbfp" "$tenantfp" "$backup" "$P19_SHA"
          REMOTE
          cat "$OUT/P20_PREDEPLOY.txt"
          tenantfp="$(awk -F= '/^TEST_TENANT_FP=/{print $2}' "$OUT/P20_PREDEPLOY.txt")"
          backup="$(awk -F= '/^BACKUP_PATH=/{print $2}' "$OUT/P20_PREDEPLOY.txt")"
          test -n "$tenantfp"; test -n "$backup"
          printf 'P20_PRE_TENANT_FP=%s\nP20_BACKUP_PATH=%s\n' "$tenantfp" "$backup" >> "$GITHUB_ENV"
      - name: Build exact P20 artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="P20_${P20_SHA}.tar.gz"
          git archive --format=tar --output=P20.tar "$P20_SHA" -- app bootstrap config database public scripts tools tests
          gzip -n P20.tar && mv P20.tar.gz "$artifact"
          tar -tzf "$artifact" > "$OUT/P20_ARTIFACT_LISTING.txt"
          if grep -E '(^|/)(\.git|\.env([^/]*)?|storage|tmp|logs|screenshots|node_modules|vendor)(/|$)|(^|/)(cookies?|storageState)(/|$)' "$OUT/P20_ARTIFACT_LISTING.txt"; then exit 1; fi
          sha="$(sha256sum "$artifact"|awk '{print $1}')"; echo "$sha" > "$OUT/P20_ARTIFACT_SHA256.txt"
          printf 'artifact=%s\nsha=%s\n' "$artifact" "$sha" >> "$GITHUB_OUTPUT"
      - name: Deploy P20 through P07
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P20_${P20_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$P20_SHA'" | tee "$OUT/P20_P07_DEPLOY.log"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote'"
      - name: Post-deploy invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' P20_SHA='$P20_SHA' EXPECTED_OLD_ERP_FP='$EXPECTED_OLD_ERP_FP' EXPECTED_DB_FP='$EXPECTED_DB_FP' TEST_TENANT_ID='$TEST_TENANT_ID' PRE_TENANT_FP='$P20_PRE_TENANT_FP' bash -se" > "$OUT/P20_POSTDEPLOY.txt" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp; LIVE="$ROOT/public_html/erpv2"
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$ROOT/public_html/erp"&&find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null|sort|sha256sum|awk '{print $1}')"
          dbfp="$(php "/tmp/P20_db_fp_${GITHUB_RUN_ID}.php")"
          PHPBIN=''; for c in php83 php8.3 /usr/local/bin/php83 /usr/bin/php83 /usr/bin/php8.3; do if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PHPBIN="$c"; break; fi; done
          tenantfp="$(P20_ROOT="$LIVE" P20_COMPANY_ID="$TEST_TENANT_ID" "$PHPBIN" "/tmp/P20_tenant_fp_${GITHUB_RUN_ID}.php")"
          login="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$marker" = "$P20_SHA"; test "$oldfp" = "$EXPECTED_OLD_ERP_FP"; test "$dbfp" = "$EXPECTED_DB_FP"; test "$tenantfp" = "$PRE_TENANT_FP"; test "$login" = 200
          printf 'DEPLOYED_SHA=%s\nOLD_ERP_FP=%s\nDB_FP=%s\nTEST_TENANT_FP=%s\nERPV2_LOGIN_HTTP=%s\nDATABASE_UNCHANGED=YES\nOLD_ERP_UNCHANGED=YES\nTEST_TENANT_UNCHANGED=YES\n' "$marker" "$oldfp" "$dbfp" "$tenantfp" "$login"
          rm -f "/tmp/P20_db_fp_${GITHUB_RUN_ID}.php" "/tmp/P20_tenant_fp_${GITHUB_RUN_ID}.php"
          REMOTE
          cat "$OUT/P20_POSTDEPLOY.txt"
          cat > "$OUT/P20_05_DEPLOYMENT.json" <<EOF
          {"status":"PASS","p19_sha":"$P19_SHA","p20_commit":"$P20_SHA","deployed_sha":"$P20_SHA","backup_path":"$P20_BACKUP_PATH","target":"/erpv2","migrations_run":false,"database_changed":false,"old_erp_changed":false,"test_tenant_changed":false}
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P20_deploy_${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 30
      - if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/P20_deploy_key" /tmp/P20_db_fp.php /tmp/P20_tenant_fp.php 2>/dev/null || true
