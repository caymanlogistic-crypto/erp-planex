name: P20 OWNER-targeted history diagnosis

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_P19_SHA: f42a37539da13d50af1fddefe528a82dba022dbe
  OUT: P20_owner_diagnosis_output

jobs:
  owner-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p20-execution-isolated-20260807
          fetch-depth: 0
      - name: Prepare sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --quiet origin chatgpt/p20-finance-operation-history-fix-20260807 p11-audit-v2
          git show origin/chatgpt/p20-finance-operation-history-fix-20260807:.github/p20/P20_readonly_diagnose.php > /tmp/P20_owner_diag.php
          php -l /tmp/P20_owner_diag.php
      - name: Resolve OWNER login without exposing credentials
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"; tmpdir="$(mktemp -d)"
          if [ -z "$credentials" ]; then
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > "$tmpdir/decrypt.py"
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > "$tmpdir/credentials.enc.json"
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            printf '%s\n' "$PRIVATE_KEY" > "$tmpdir/key"; chmod 600 "$tmpdir/key"
            credentials="$(python "$tmpdir/decrypt.py" --key "$tmpdir/key" --input "$tmpdir/credentials.enc.json")"
          fi
          owner_login="$(CREDENTIALS="$credentials" python - <<'PY'
          import base64,json,os
          d=json.loads(base64.b64decode(os.environ['CREDENTIALS']).decode())
          x=next(x for x in d if isinstance(x,dict) and str(x.get('role','')).upper()=='OWNER')
          print(x['username'])
          PY
          )"
          test -n "$owner_login"; echo "::add-mask::$owner_login"; printf 'P20_OWNER_LOGIN=%s\n' "$owner_login" >> "$GITHUB_ENV"
          rm -rf "$tmpdir"
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P20_owner_diag_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P20_owner_diag_key" "$HOME/.ssh/known_hosts"
      - name: Diagnose exact OWNER tenant operation 45
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_owner_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/P20_owner_diag.php "$SSH_USER@$SSH_HOST:/tmp/P20_owner_diag_${GITHUB_RUN_ID}.php"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_owner_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "ACCEPTED_P19_SHA='$ACCEPTED_P19_SHA' OWNER_LOGIN='$P20_OWNER_LOGIN' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -se" > "$OUT/P20_OWNER_SERVICE_STACK.json" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          test "$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")" = "$ACCEPTED_P19_SHA"
          PHPBIN=''; for c in php83 php8.3 /usr/local/bin/php83 /usr/bin/php83 /usr/bin/php8.3; do if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PHPBIN="$c"; break; fi; done; test -n "$PHPBIN"
          P20_ROOT="$ROOT/public_html/erpv2" P20_OWNER_LOGIN="$OWNER_LOGIN" P20_OPERATION_ID=45 "$PHPBIN" "/tmp/P20_owner_diag_${GITHUB_RUN_ID}.php"
          REMOTE
          python - <<'PY'
          import json
          d=json.load(open('P20_owner_diagnosis_output/P20_OWNER_SERVICE_STACK.json'))
          e=d.get('exception') or {}
          print('TARGET_COMPANY_ID='+str(d.get('company_id')))
          print('TARGET_OPERATION_ID='+str(d.get('operation_id')))
          print('SERVICE_CALL='+str(d.get('service_call',{}).get('status')))
          print('EXCEPTION_CLASS='+str(e.get('class','NONE')))
          print('EXCEPTION_FILE='+str(e.get('file','NONE')))
          print('EXCEPTION_LINE='+str(e.get('line','NONE')))
          PY
      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_owner_diag_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/P20_owner_diag_${GITHUB_RUN_ID}.php'" || true
          printf 'P20_OWNER_LOGIN=\n' >> "$GITHUB_ENV"
          rm -f "$HOME/.ssh/P20_owner_diag_key" /tmp/P20_owner_diag.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P20_owner_diagnosis_${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 30
