name: P20 direct service diagnosis PHP83

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_P19_SHA: f42a37539da13d50af1fddefe528a82dba022dbe
  OUT: P20_service_diagnosis_output

jobs:
  diagnose-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p20-execution-isolated-20260807
          fetch-depth: 0
      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --quiet origin chatgpt/p20-finance-operation-history-fix-20260807
          git show origin/chatgpt/p20-finance-operation-history-fix-20260807:.github/p20/P20_readonly_diagnose.php > /tmp/P20_readonly_diagnose.php
          php -l /tmp/P20_readonly_diagnose.php
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P20_php83_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P20_php83_key" "$HOME/.ssh/known_hosts"
      - name: Run PHP83 service diagnosis
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_php83_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/P20_readonly_diagnose.php "$SSH_USER@$SSH_HOST:/tmp/P20_readonly_diagnose_${GITHUB_RUN_ID}.php"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_php83_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "ACCEPTED_P19_SHA='$ACCEPTED_P19_SHA' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -se" > "$OUT/P20_DIAG_SERVICE_STACK.json" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          test "$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")" = "$ACCEPTED_P19_SHA"
          PHPBIN=''
          for c in php83 php8.3 /usr/local/bin/php83 /usr/bin/php83 /usr/bin/php8.3; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PHPBIN="$c"; break; fi
          done
          test -n "$PHPBIN"
          "$PHPBIN" "/tmp/P20_readonly_diagnose_${GITHUB_RUN_ID}.php"
          REMOTE
          python - <<'PY'
          import json
          d=json.load(open('P20_service_diagnosis_output/P20_DIAG_SERVICE_STACK.json',encoding='utf-8'))
          e=d.get('exception') or {}
          print('SERVICE_CALL='+str(d.get('service_call',{}).get('status')))
          print('EXCEPTION_CLASS='+str(e.get('class','NONE')))
          print('EXCEPTION_FILE='+str(e.get('file','NONE')))
          print('EXCEPTION_LINE='+str(e.get('line','NONE')))
          PY
      - name: Lookup browser correlation in server logs
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          CID: P20-31169836826-history
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_php83_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "CID='$CID' bash -se" > "$OUT/P20_DIAG_SERVER_LOGS.txt" <<'REMOTE'
          set +e; found=0
          for root in /home/s/spugovxsim/logs /home/s/spugovxsim/planexp/logs /home/s/spugovxsim; do
            [ -d "$root" ] || continue
            while IFS= read -r f; do
              if grep -F "$CID" "$f" >/dev/null 2>&1; then grep -H -F "$CID" "$f" | tail -n 20; found=1; fi
            done < <(find "$root" -maxdepth 4 -type f \( -name '*.log' -o -name '*access*' -o -name '*error*' \) -mmin -60 2>/dev/null | head -n 200)
          done
          [ "$found" -eq 1 ] || echo 'CORRELATION_LOG_MATCH=NOT_FOUND'
          REMOTE
      - name: Cleanup
        if: always()
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_php83_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '/tmp/P20_readonly_diagnose_${GITHUB_RUN_ID}.php'" || true
          rm -f "$HOME/.ssh/P20_php83_key" /tmp/P20_readonly_diagnose.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P20_service_diagnosis_${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 30
