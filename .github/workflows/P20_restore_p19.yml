name: P20 restore accepted P19 after legacy workflow interference

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/P20_restore_p19.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_P19_SHA: f42a37539da13d50af1fddefe528a82dba022dbe
  UNEXPECTED_SHA: 65445cc12a2e1f249235b4fea1f9ffd044b4b60e
  EXPECTED_OLD_ERP_FP: c6a6522dacbe0c919ba5d22f4cf0501426a6ce31bc8ac091405537076e9a42da
  EXPECTED_DB_FP: cca07e25969163877994635a6a99209e84cd26fc9eb0d793f638a0c6d9106d0a
  OUT: P20_restore_output

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch accepted P19 and DB helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --quiet origin chatgpt/p19-uiux-safe-runtime-review-20260806 chatgpt/p19-patch-b-deploy-exact-20260807
          git cat-file -e "${ACCEPTED_P19_SHA}^{commit}"
          git show origin/chatgpt/p19-uiux-safe-runtime-review-20260806:.github/p19/P19_readonly_db_fingerprint.php > /tmp/P20_db_fp.php
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P20_restore_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P20_restore_key" "$HOME/.ssh/known_hosts"
      - name: Guard unexpected state and backup current erpv2
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/P20_db_fp.php "$SSH_USER@$SSH_HOST:/tmp/P20_restore_db_${GITHUB_RUN_ID}.php"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' UNEXPECTED_SHA='$UNEXPECTED_SHA' EXPECTED_OLD_ERP_FP='$EXPECTED_OLD_ERP_FP' EXPECTED_DB_FP='$EXPECTED_DB_FP' bash -se" > "$OUT/P20_RESTORE_PRE.json" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          test "$marker" = "$UNEXPECTED_SHA"
          oldfp="$(cd "$ROOT/public_html/erp" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          dbfp="$(php "/tmp/P20_restore_db_${GITHUB_RUN_ID}.php")"
          test "$oldfp" = "$EXPECTED_OLD_ERP_FP"; test "$dbfp" = "$EXPECTED_DB_FP"
          backup="$ROOT/deploy_backups/P20_INTERFERENCE_${GITHUB_RUN_ID}_${marker}"
          test ! -e "$backup"
          cp -a "$LIVE" "$backup"
          printf '{"current_marker":"%s","backup":"%s","old_erp_fp":"%s","db_fp":"%s"}\n' "$marker" "$backup" "$oldfp" "$dbfp"
          REMOTE
      - name: Build exact accepted P19 artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="P20_restore_${ACCEPTED_P19_SHA}.tar.gz"
          git archive --format=tar --output=P20_restore.tar "$ACCEPTED_P19_SHA" -- app bootstrap config database public scripts tools tests
          gzip -n P20_restore.tar && mv P20_restore.tar.gz "$artifact"
          sha="$(sha256sum "$artifact" | awk '{print $1}')"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore accepted P19 through P07
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P20_restore_${ACCEPTED_P19_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/P20_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$ACCEPTED_P19_SHA'" | tee "$OUT/P20_RESTORE_P07.log"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote'"
      - name: Verify restored invariants
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/P20_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "GITHUB_RUN_ID='$GITHUB_RUN_ID' ACCEPTED_P19_SHA='$ACCEPTED_P19_SHA' EXPECTED_OLD_ERP_FP='$EXPECTED_OLD_ERP_FP' EXPECTED_DB_FP='$EXPECTED_DB_FP' bash -se" > "$OUT/P20_RESTORE_POST.json" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$ROOT/public_html/erp" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          dbfp="$(php "/tmp/P20_restore_db_${GITHUB_RUN_ID}.php")"
          login="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$marker" = "$ACCEPTED_P19_SHA"; test "$oldfp" = "$EXPECTED_OLD_ERP_FP"; test "$dbfp" = "$EXPECTED_DB_FP"; test "$login" = 200
          printf '{"marker":"%s","old_erp_unchanged":true,"db_unchanged":true,"login_http":%s}\n' "$marker" "$login"
          rm -f "/tmp/P20_restore_db_${GITHUB_RUN_ID}.php"
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P20_restore_p19_${{ github.run_id }}
          path: ${{ env.OUT }}/
          retention-days: 30
      - if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/P20_restore_key" /tmp/P20_db_fp.php 2>/dev/null || true
