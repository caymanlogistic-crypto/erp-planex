name: P21 Control Plane Static Policy

on:
  push:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/**'
      - '.github/p21/**'
      - 'tools/p21_control_plane_audit.py'
      - 'tests/p21_control_plane_audit_test.py'
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/workflows/**'
      - '.github/p21/**'
      - 'tools/p21_control_plane_audit.py'
      - 'tests/p21_control_plane_audit_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/p21_control_plane_audit.py tests/p21_control_plane_audit_test.py

      - name: Control-plane policy scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P21_control_plane_static_output
          python tools/p21_control_plane_audit.py --root . --output P21_control_plane_static_output/P21_07_CONTROL_PLANE_STATIC_TESTS.json

      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/p21_control_plane_audit_test.py | tee P21_control_plane_static_output/P21_REGRESSION_TEST.txt

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P21_control_plane_static_${{ github.run_id }}
          path: P21_control_plane_static_output/
          if-no-files-found: error
          retention-days: 30
