name: P21 Server Unchanged Guard

on:
  pull_request:
    branches:
      - chatgpt/production-stabilization-20260802
    paths:
      - '.github/p21/P21_SERVER_GUARD_TRIGGER.txt'
      - '.github/workflows/P21_server_unchanged_guard.yml'
      - '.github/p21/P21_readonly_db_fingerprint.php'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SERVER_SHA: b96c085a254a885da26f8f5ca342b3781aea12ad
  EXPECTED_DB_FP: cca07e25969163877994635a6a99209e84cd26fc9eb0d793f638a0c6d9106d0a
  EXPECTED_OLD_ERP_FP: c6a6522dacbe0c919ba5d22f4cf0501426a6ce31bc8ac091405537076e9a42da
  OUT: P21_server_guard_output

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure read-only SSH channel
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/P21_guard_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/P21_guard_key" "$HOME/.ssh/known_hosts"

      - name: Read marker DB and old ERP fingerprints
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/P21_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/P21_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk "{print \$1}"')"
          dbfp="$(cat .github/p21/P21_readonly_db_fingerprint.php | ssh -p "$SSH_PORT" -i "$HOME/.ssh/P21_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'php')"
          login="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$marker" = "$EXPECTED_SERVER_SHA"
          test "$oldfp" = "$EXPECTED_OLD_ERP_FP"
          test "$dbfp" = "$EXPECTED_DB_FP"
          test "$login" = 200
          cat > "$OUT/P21_11_SERVER_UNCHANGED_GUARD.json" <<EOF
          {"status":"PASS","current_server_sha":"$marker","erpv2_login_http":$login,"database_fingerprint":"$dbfp","database_changed":false,"old_erp_fingerprint":"$oldfp","old_erp_changed":false,"server_changed":false,"deploy_executed":false}
          EOF

      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P21_server_unchanged_guard_${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup local SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/P21_guard_key" 2>/dev/null || true
