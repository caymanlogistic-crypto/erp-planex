name: P24 Runtime Recheck

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  runtime:
    if: ${{ github.event.issue.number == 23 && github.event.comment.body == 'P24_RUNTIME_RECHECK' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/production-stabilization-20260802
          fetch-depth: 0

      - name: Load browser credentials
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
          mkdir -p .github/p11
          git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
          git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
          credentials="${SECRET_CREDENTIALS:-}"
          if [ -z "$credentials" ]; then
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p24_cred_key"
            chmod 600 "$HOME/.ssh/p24_cred_key"
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p24_cred_key" --input .github/p11/P11_runtime_credentials.enc.json)"
            rm -f "$HOME/.ssh/p24_cred_key"
          fi
          test -n "$credentials"
          echo "::add-mask::$credentials"
          printf 'P24_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Runtime contractor modal POST regression
        run: |
          cat > p24_runtime.js <<'JS'
          const { chromium } = require('playwright');
          const creds = JSON.parse(Buffer.from(process.env.P24_CREDENTIALS_B64,'base64').toString('utf8'));
          const cred = creds.find(c=>c.role==='company_owner') || creds.find(c=>c.role==='senior_logist') || creds[0];
          if (!cred) throw new Error('No runtime credential');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1920,height:1080},deviceScaleFactor:1,locale:'ru-RU',timezoneId:'Europe/Moscow',ignoreHTTPSErrors:true});
            const page=await context.newPage();
            await page.goto('https://plan-ex.ru/erpv2/login',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(cred.username);
            await page.locator('input[type="password"]').first().fill(cred.password);
            await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}),page.locator('button[type="submit"],input[type="submit"]').first().click()]);
            if (/\/login(?:[/?#]|$)/i.test(page.url())) throw new Error('login failed');
            await page.goto('https://plan-ex.ru/erpv2/company/contractors',{waitUntil:'domcontentloaded',timeout:30000});
            const createButton=page.getByRole('button',{name:'Создать перевозчика',exact:true}).first();
            if(!(await createButton.count())) throw new Error('create contractor button missing');
            await createButton.click();
            const modal=page.locator('#le-contractor-modal');
            await modal.waitFor({state:'visible',timeout:10000});
            const form=modal.locator('form').filter({has:modal.locator('input[name="inn"]')}).first();
            await form.waitFor({state:'attached',timeout:10000});
            await form.evaluate(f=>{ f.noValidate=true; });
            const responsePromise=page.waitForResponse(r=>r.url().includes('/company/contractors/create') && r.request().method()==='POST',{timeout:15000});
            await form.evaluate(f=>f.requestSubmit());
            const response=await responsePromise;
            await page.waitForTimeout(700);
            const text=await modal.innerText();
            if(/checksum mismatch|027_vehicle_unit_document_types|Local migration failed/i.test(text)) throw new Error('checksum blocker persists');
            if(response.status()>=500) throw new Error('contractor POST returned '+response.status());
            if(!/ИНН|Обязательное поле|Укажите/i.test(text)) throw new Error('normal validation response missing');
            console.log('P24_RUNTIME_CONTRACTOR_MODAL_POST=PASS status='+response.status());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node p24_runtime.js

      - name: Report result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 23 --repo caymanlogistic-crypto/erp-planex --body "P24_RUNTIME_RECHECK=${{ job.status }} run=${{ github.run_id }}"
