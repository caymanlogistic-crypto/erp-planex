name: P26 Systemic Runtime Migration Guard

on:
  push:
    branches: [chatgpt/p26-runtime-migration-guard-20260811]

permissions:
  contents: read

concurrency:
  group: erpv2-p26-systemic-fix
  cancel-in-progress: false

jobs:
  deploy-verify:
    if: ${{ github.event.head_commit.message == 'P26 EXECUTE SYSTEMIC RUNTIME FIX' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Static regression gate
        run: |
          set -euo pipefail
          php -l app/Support/runtime_migration_policy.php
          php -l app/Support/runtime_ui_hotfixes.php
          php -l app/Support/entrypoint_dependencies.php
          php tests/p26_runtime_migration_guard_test.php
          node --check public/assets/js/driver-phone-optional.js
          python - <<'PY'
          from pathlib import Path
          deps=Path('app/Support/entrypoint_dependencies.php').read_text()
          assert deps.index('runtime_migration_policy.php') < deps.index('core_runtime.php')
          policy=Path('app/Support/runtime_migration_policy.php').read_text()
          assert "/superadmin/companies/create" in policy
          assert "LocalMigrationService::apply" in policy
          print('STATIC_POLICY_ORDER=PASS')
          PY

      - name: Build exact application artifact
        id: build
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          artifact="p26_erpv2_${sha}.tar.gz"
          git archive --format=tar --output=p26_source.tar "$sha" -- app bootstrap config database public scripts tools tests
          gzip -n p26_source.tar
          mv p26_source.tar.gz "$artifact"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p26_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p26_key" "$HOME/.ssh/known_hosts"

      - name: Snapshot server and backup ERPv2
        id: before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          DEPLOY="$ROOT/deploy"
          LIVE="$ROOT/public_html/erpv2"
          OLD="$ROOT/public_html/erp"
          current="$(cat "$DEPLOY/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$OLD" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$ROOT/deploy_backups/P26_${ts}_${current}"
          mkdir -p "$backup"
          tar -C "$LIVE" -czf "$backup/erpv2_current.tar.gz" .
          test -s "$backup/erpv2_current.tar.gz"
          printf 'current=%s\noldfp=%s\nbackup=%s\n' "$current" "$oldfp" "$backup"
          REMOTE
          )"
          printf '%s\n' "$out"
          while IFS='=' read -r k v; do case "$k" in current|oldfp|backup) echo "$k=$v" >> "$GITHUB_OUTPUT";; esac; done <<< "$out"

      - name: Deploy exact SHA through P07
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.build.outputs.sha256 }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P26_artifact_${SOURCE_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$SOURCE_SHA'"
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$marker" = "$SOURCE_SHA"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote'"

      - name: Load browser credentials
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          if [ -z "$credentials" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p26_cred_key"
            chmod 600 "$HOME/.ssh/p26_cred_key"
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p26_cred_key" --input .github/p11/P11_runtime_credentials.enc.json)"
            rm -f "$HOME/.ssh/p26_cred_key"
          fi
          test -n "$credentials"
          echo "::add-mask::$credentials"
          printf 'P26_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Browser regression — driver phone and vehicle migration blocker
        run: |
          cat > p26_runtime.js <<'JS'
          const { chromium } = require('playwright');
          const creds = JSON.parse(Buffer.from(process.env.P26_CREDENTIALS_B64,'base64').toString('utf8'));
          const candidates = creds.filter(c => ['company_owner','senior_logist','logist'].includes(c.role));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let ok=false, last='';
            for(const cred of candidates){
              const ctx=await browser.newContext({viewport:{width:1920,height:1080},locale:'ru-RU',timezoneId:'Europe/Moscow',ignoreHTTPSErrors:true});
              const page=await ctx.newPage();
              try{
                await page.goto('https://plan-ex.ru/erpv2/login',{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(cred.username);
                await page.locator('input[type="password"]').first().fill(cred.password);
                await page.locator('button[type="submit"],input[type="submit"]').first().click();
                await page.waitForLoadState('domcontentloaded').catch(()=>{});
                if(/\/login(?:[/?#]|$)/i.test(page.url())) throw new Error('login failed');

                // Driver: blank phone must not become a client-side error.
                await page.goto('https://plan-ex.ru/erpv2/company/drivers',{waitUntil:'domcontentloaded',timeout:30000});
                const addDriver=page.getByRole('button',{name:/Добавить нового водителя/i}).first();
                if(await addDriver.count()){
                  await addDriver.click();
                  const form=page.locator('#driver-create-modal #driver-create-form').first();
                  await form.waitFor({state:'visible',timeout:10000});
                  const phone=form.locator('input[name="phone"]');
                  await phone.fill('');
                  await phone.focus();
                  await form.locator('input[name="full_name"]').focus();
                  await page.waitForTimeout(100);
                  const field=phone.locator('xpath=ancestor::*[contains(concat(" ",normalize-space(@class)," ")," field ")][1]');
                  if((await field.getAttribute('class')||'').includes('is-error')) throw new Error('blank phone still marked error on blur');
                  await form.locator('input[name="full_name"]').fill('Тест');
                  await form.evaluate(f=>f.requestSubmit());
                  await page.waitForTimeout(400);
                  const modalText=await page.locator('#driver-create-modal').innerText();
                  if(/Укажите телефон/i.test(modalText)) throw new Error('blank phone still reported mandatory on submit');
                }

                // Vehicle: invalid submit must produce field validation, never migration checksum failure.
                await page.goto('https://plan-ex.ru/erpv2/company/vehicles/create',{waitUntil:'domcontentloaded',timeout:30000});
                const vf=page.locator('form').filter({has:page.locator('input[name="plate_number"]')}).first();
                if(!(await vf.count())) throw new Error('vehicle create form not found');
                const respPromise=page.waitForResponse(r=>r.url().includes('/company/vehicles/create') && r.request().method()==='POST',{timeout:15000});
                await vf.evaluate(f=>f.requestSubmit());
                const resp=await respPromise;
                const body=await resp.text();
                if(resp.status()>=500) throw new Error('vehicle create POST '+resp.status());
                if(/checksum mismatch|Local migration failed/i.test(body)) throw new Error('migration blocker still reaches vehicle CRUD');
                if(!/Обязательное поле|Укажите тип транспортной единицы/i.test(body)) throw new Error('expected vehicle field validation not returned');

                console.log('P26_BROWSER_PASS role='+cred.role);
                ok=true; await ctx.close(); break;
              }catch(e){last=String(e.stack||e); await ctx.close();}
            }
            await browser.close();
            if(!ok) throw new Error(last||'no working credential');
          })();
          JS
          node p26_runtime.js

      - name: Verify marker, old ERP and HTTP
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
          OLD_FP_BEFORE: ${{ steps.before.outputs.oldfp }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          oldfp="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p26_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          http="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$marker" = "$SOURCE_SHA"
          test "$oldfp" = "$OLD_FP_BEFORE"
          test "$http" = 200
          echo "P26_DEPLOY_PASS sha=$SOURCE_SHA login=$http old_erp_unchanged=true"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P26_systemic_runtime_fix_${{ steps.build.outputs.sha }}
          path: |
            p26_runtime.js
          retention-days: 30

      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/p26_key"
