name: P27 Multi Driver Crew PR Deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 25 && github.event.comment.body == 'P27_DEPLOY' && github.event.comment.user.login == 'caymanlogistic-crypto' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p27-multi-driver-crews-20260811
          fetch-depth: 1

      - name: Static gate
        run: |
          set -euo pipefail
          php tests/p27_multi_driver_crews_test.php
          php -l app/Http/Controllers/Company/RouteExecutorActions/create_submit.php
          php -l app/Http/Controllers/Company/RouteExecutorActions/index.php
          php -l app/Http/Controllers/Company/RouteExecutorActions/view.php
          php -l app/View/partials/company_route_executor_create_form.php
          php -l app/Support/crew_driver_helpers.php
          php -l scripts/p27_migrate_crew_drivers.php

      - name: Build exact artifact
        id: build
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          artifact="P27_${sha}.tar.gz"
          git archive --format=tar "$sha" -- app bootstrap config database public scripts tests | gzip -n > "$artifact"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p27_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p27_key" "$HOME/.ssh/known_hosts"

      - name: Guard and backup current ERPv2
        id: before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          current="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          test "$current" = "0f068d7a5d85b54c8cfd0ccce7644b5fbd35422a"
          oldfp="$(cd "$ROOT/public_html/erp" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$ROOT/deploy_backups/P27_${ts}_${current}"
          mkdir -p "$backup"
          tar -C "$ROOT/public_html/erpv2" -czf "$backup/erpv2_current.tar.gz" .
          printf 'current=%s\noldfp=%s\nbackup=%s\n' "$current" "$oldfp" "$backup"
          REMOTE
          )"
          printf '%s\n' "$out"
          while IFS='=' read -r k v; do case "$k" in current|oldfp|backup) echo "$k=$v" >> "$GITHUB_OUTPUT";; esac; done <<< "$out"

      - name: Upload source for migration
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: scp -P "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:/tmp/$ARTIFACT"

      - name: Apply additive crew_drivers migration
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "ARTIFACT='$ARTIFACT' RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          TMP="/tmp/p27_${RUN_ID}"
          rm -rf "$TMP" && mkdir -p "$TMP"
          tar -xzf "/tmp/$ARTIFACT" -C "$TMP"
          cp "$ROOT/public_html/erpv2/.env" "$TMP/.env"
          PHP_BIN=""
          for candidate in /opt/php8.5/bin/php /opt/php8.4/bin/php /opt/php8.3/bin/php /opt/php8.2/bin/php /usr/bin/php8.5 /usr/bin/php8.4 /usr/bin/php8.3 /usr/bin/php8.2 /usr/local/bin/php /usr/bin/php; do
            if [ -x "$candidate" ]; then
              version_id="$($candidate -r 'echo PHP_VERSION_ID;' 2>/dev/null || true)"
              if [ -n "$version_id" ] && [ "$version_id" -ge 70400 ] 2>/dev/null; then PHP_BIN="$candidate"; break; fi
            fi
          done
          test -n "$PHP_BIN"
          echo "P27_SERVER_PHP=$($PHP_BIN -r 'echo PHP_VERSION;')"
          "$PHP_BIN" -l "$TMP/scripts/p27_migrate_crew_drivers.php"
          "$PHP_BIN" "$TMP/scripts/p27_migrate_crew_drivers.php" --apply
          rm -f "$TMP/.env" "/tmp/$ARTIFACT"
          REMOTE

      - name: Deploy exact source via P07
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.build.outputs.sha256 }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P27_${SOURCE_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$SOURCE_SHA'"
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$marker" = "$SOURCE_SHA"

      - name: Verify HTTP and old ERP guard
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
          OLD_FP_BEFORE: ${{ steps.before.outputs.oldfp }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          oldfp="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p27_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          http="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          test "$marker" = "$SOURCE_SHA"
          test "$oldfp" = "$OLD_FP_BEFORE"
          test "$http" = 200
          echo "P27_DEPLOY_PASS sha=$marker login=$http backup=${{ steps.before.outputs.backup }}"

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:25,body:`P27_DEPLOY=${{ job.status }} run=${context.runId} sha=${{ steps.build.outputs.sha }}`});

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/p27_key"
