name: P28 Controlled Trip Form UX Deploy

on:
  push:
    branches: [chatgpt/p28-trip-form-ux-20260811]

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'P28: controlled deploy trip form UX' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p28-trip-form-ux-20260811
          fetch-depth: 0

      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'pending',context:'P28/deploy',description:'Controlled ERPv2 deployment in progress'});

      - name: Static and scope gate
        run: |
          set -euo pipefail
          php -l app/View/pages/company_linear_trips.php
          test -f public/assets/css/linear-trip-form-ux.css
          git diff --exit-code 8e0fbeb20f6d2cfaaadd436847bb210a9e50b7f4..HEAD -- app/View/layouts/main.php
          changed="$(git diff --name-only 8e0fbeb20f6d2cfaaadd436847bb210a9e50b7f4..HEAD | grep -v '^\.github/workflows/P28_controlled_deploy.yml$' | grep -v '^\.github/p28/P28_TRIGGER.txt$' | sort)"
          expected=$'app/View/pages/company_linear_trips.php\npublic/assets/css/linear-trip-form-ux.css'
          test "$changed" = "$expected"
          additions="$(git diff --numstat 8e0fbeb20f6d2cfaaadd436847bb210a9e50b7f4..HEAD -- app/View/pages/company_linear_trips.php | awk '{print $1}')"
          deletions="$(git diff --numstat 8e0fbeb20f6d2cfaaadd436847bb210a9e50b7f4..HEAD -- app/View/pages/company_linear_trips.php | awk '{print $2}')"
          test "$additions" = "1"
          test "$deletions" = "0"
          grep -q 'linear-trip-form-ux.css' app/View/pages/company_linear_trips.php
          echo "P28_SCOPE_GATE=PASS"

      - name: Build exact artifact
        id: build
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          artifact="P28_${sha}.tar.gz"
          git archive --format=tar "$sha" -- app bootstrap config database public scripts tests | gzip -n > "$artifact"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p28_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p28_key" "$HOME/.ssh/known_hosts"

      - name: Concurrency guard and backup ERPv2
        id: before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          expected=8e0fbeb20f6d2cfaaadd436847bb210a9e50b7f4
          current="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          test "$current" = "$expected"
          oldfp="$(cd "$ROOT/public_html/erp" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$ROOT/deploy_backups/P28_${ts}_${current}"
          mkdir -p "$backup"
          tar -C "$ROOT/public_html/erpv2" -czf "$backup/erpv2_current.tar.gz" .
          printf 'current=%s\noldfp=%s\nbackup=%s\n' "$current" "$oldfp" "$backup"
          REMOTE
          )"
          printf '%s\n' "$out"
          while IFS='=' read -r k v; do case "$k" in current|oldfp|backup) echo "$k=$v" >> "$GITHUB_OUTPUT";; esac; done <<< "$out"

      - name: Deploy exact source via P07
        id: deploy
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.build.outputs.sha256 }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P28_${SOURCE_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$SOURCE_SHA'"
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$marker" = "$SOURCE_SHA"

      - name: Verify HTTP and old ERP guard
        env:
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
          OLD_FP_BEFORE: ${{ steps.before.outputs.oldfp }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          marker="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          oldfp="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf "%P %s %T@\n" 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          login_http="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)"
          css_http="$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/assets/css/linear-trip-form-ux.css)"
          test "$marker" = "$SOURCE_SHA"
          test "$oldfp" = "$OLD_FP_BEFORE"
          test "$login_http" = 200
          test "$css_http" = 200

      - name: Load browser credentials
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          if [ -z "$credentials" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p28_cred_key"
            chmod 600 "$HOME/.ssh/p28_cred_key"
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p28_cred_key" --input .github/p11/P11_runtime_credentials.enc.json)"
            rm -f "$HOME/.ssh/p28_cred_key"
          fi
          test -n "$credentials"
          echo "::add-mask::$credentials"
          printf 'P28_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Browser integrity verify
        run: |
          cat > p28_verify.js <<'JS'
          const { chromium } = require('playwright');
          const creds=JSON.parse(Buffer.from(process.env.P28_CREDENTIALS_B64,'base64').toString('utf8'));
          async function login(page,c){
            await page.goto('https://plan-ex.ru/erpv2/login',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(c.username);
            await page.locator('input[type="password"]').first().fill(c.password);
            await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}),page.locator('button[type="submit"],input[type="submit"]').first().click()]);
            return !/\/login(?:[/?#]|$)/i.test(page.url());
          }
          (async()=>{
            const browser=await chromium.launch({headless:true}); let pass=false; const errors=[];
            for(let i=0;i<creds.length&&!pass;i++){
              const ctx=await browser.newContext({viewport:{width:1920,height:1080},deviceScaleFactor:1,locale:'ru-RU',timezoneId:'Europe/Moscow',ignoreHTTPSErrors:true});
              const page=await ctx.newPage(); const runtime=[];
              page.on('pageerror',e=>runtime.push('pageerror:'+e.message));
              page.on('console',m=>{if(m.type()==='error')runtime.push('console:'+m.text())});
              try{
                if(!await login(page,creds[i])){await ctx.close();continue;}
                const nav=await page.goto('https://plan-ex.ru/erpv2/company/trips/linear?show_create=1',{waitUntil:'networkidle',timeout:30000});
                if(!nav||nav.status()>=500||/\/login(?:[/?#]|$)/i.test(page.url())){await ctx.close();continue;}
                const modal=page.locator('#linear-trip-create-modal');
                if(!(await modal.count())||!(await modal.evaluate(el=>el.classList.contains('is-open'))))throw new Error('create modal not open');
                const form=page.locator('#linear-trip-create-form'); if(!(await form.count()))throw new Error('create form missing');
                for(const name of ['route_type','planned_loading_date','client_id','route_executor_id']){
                  if(!(await form.locator(`[name="${name}"]`).count()))throw new Error('missing field '+name);
                }
                if(!(await form.locator('[name="customer_payments[0][amount]"]').count()))throw new Error('customer payment missing');
                if(!(await form.locator('[name="carrier_payments[0][amount]"]').count()))throw new Error('carrier payment missing');
                const cssLoaded=await page.evaluate(()=>[...document.styleSheets].some(s=>(s.href||'').includes('linear-trip-form-ux.css')));
                if(!cssLoaded)throw new Error('P28 stylesheet not loaded');
                const box=await modal.locator('.driver-create-modal').boundingBox();
                if(!box||box.width<900||box.width>1200)throw new Error('unexpected modal width '+JSON.stringify(box));
                if(runtime.length)throw new Error(runtime.join(' | '));
                console.log('P28_BROWSER_INTEGRITY=PASS credential_index='+i+' width='+Math.round(box.width)); pass=true;
              }catch(e){errors.push('cred['+i+']: '+String(e.message||e));}
              await ctx.close();
            }
            await browser.close(); if(!pass){console.error(errors.join('\n'));process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node p28_verify.js

      - name: Mark deployment success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'P28/deploy',description:'ERPv2 deployed and browser integrity verified'});

      - name: Roll back ERPv2 on post-deploy failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          BACKUP: ${{ steps.before.outputs.backup }}
          OLD_SHA: ${{ steps.before.outputs.current }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p28_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "BACKUP='$BACKUP' OLD_SHA='$OLD_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          test -f "$BACKUP/erpv2_current.tar.gz"
          restore="$ROOT/public_html/erpv2"
          quarantine="$ROOT/deploy_backups/P28_failed_$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$quarantine"
          tar -C "$restore" -czf "$quarantine/failed_deploy.tar.gz" .
          find "$restore" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -C "$restore" -xzf "$BACKUP/erpv2_current.tar.gz"
          printf '%s\n' "$OLD_SHA" > "$ROOT/deploy/P07_erpv2_deployed_commit.txt"
          REMOTE

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:'P28/deploy',description:'P28 failed; rollback attempted if deployment had started'});

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/p28_key" "$HOME/.ssh/p28_cred_key"
