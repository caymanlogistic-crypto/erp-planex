name: P39 Audit Migrations and Verify
on:
  push:
    branches: [chatgpt/p39-route-points-view-20260812]
permissions:
  contents: read
jobs:
  audit:
    if: "${{ startsWith(github.event.head_commit.message, 'P39: run migration audit') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Syntax
        run: |
          php -l scripts/p39_apply_route_points_migration.php
          php -l scripts/p39_migration_audit.php
          php -l scripts/p39_route_points_smoke.php
      - name: Build
        id: build
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD); a=p39_audit_${sha}.tar.gz
          git archive --format=tar "$sha" -- app bootstrap config database public scripts tests tools | gzip -n > "$a"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "artifact=$a" >> "$GITHUB_OUTPUT"; echo "sum=$(sha256sum "$a"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: SSH
        env: {PRIVATE_KEY: "${{ secrets.ERPV2_SSH_PRIVATE_KEY }}", KNOWN_HOSTS: "${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}"}
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/p39; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/p39 ~/.ssh/known_hosts
      - name: Deploy and audit
        env:
          SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}"
          SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}"
          SSH_USER: "${{ secrets.ERPV2_SSH_USER }}"
          SHA: "${{ steps.build.outputs.sha }}"
          ART: "${{ steps.build.outputs.artifact }}"
          SUM: "${{ steps.build.outputs.sum }}"
        run: |
          set -euo pipefail
          R=/home/s/spugovxsim/planexp/deploy/P39_audit_${SHA}.tar.gz
          scp -P "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ART" "$SSH_USER@$SSH_HOST:$R"
          ssh -p "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$R' '$SUM' '$SHA'"
          ssh -p "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erpv2 && php8.5 scripts/p39_apply_route_points_migration.php && php8.5 scripts/p39_route_points_smoke.php && php8.5 scripts/p39_migration_audit.php'
      - name: Live HTTP
        run: |
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' https://plan-ex.ru/erpv2/login)" = 200
