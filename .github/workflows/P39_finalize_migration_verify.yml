name: P39 Finalize Migration + Verify

on:
  push:
    branches:
      - chatgpt/p39-route-points-view-20260812

permissions:
  contents: read

jobs:
  finalize:
    if: "${{ startsWith(github.event.head_commit.message, 'P39: finalize migration verify') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p39_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p39_key" "$HOME/.ssh/known_hosts"
      - name: Select compatible PHP and apply migration
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p39_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          LIVE=/home/s/spugovxsim/planexp/public_html/erpv2
          marker="$(cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt)"
          test "$marker" = "d9fb7e591da240763be3b7eb4536880c0ad5d940"
          candidates=(/usr/local/php8.5/bin/php /usr/local/php8.4/bin/php /usr/local/php8.3/bin/php /usr/local/php8.2/bin/php /usr/local/php8.1/bin/php php8.5 php8.4 php8.3 php8.2 php8.1 php)
          PHPBIN=''
          for candidate in "${candidates[@]}"; do
            if command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; then
              version="$($candidate -r 'echo PHP_VERSION;' 2>/dev/null || true)"
              echo "candidate=$candidate version=$version"
              major="${version%%.*}"
              rest="${version#*.}"; minor="${rest%%.*}"
              if [ "${major:-0}" -gt 8 ] || { [ "${major:-0}" -eq 8 ] && [ "${minor:-0}" -ge 1 ]; }; then
                PHPBIN="$candidate"; break
              fi
            fi
          done
          test -n "$PHPBIN" || { echo 'No PHP >= 8.1 CLI found'; exit 1; }
          echo "P39_PHPBIN=$PHPBIN"
          cd "$LIVE"
          "$PHPBIN" scripts/p39_apply_route_points_migration.php
          "$PHPBIN" scripts/p39_route_points_smoke.php
          "$PHPBIN" -l app/View/partials/company_linear_trip_modal_view.php
          "$PHPBIN" -l app/View/partials/company_linear_trip_create_form.php
          "$PHPBIN" -l app/Service/LinearTripEditSaveService.php
          REMOTE
      - name: Verify live assets
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /tmp/p39.css -w '%{http_code}' https://plan-ex.ru/erpv2/assets/css/linear-trip-route-points.css)" = 200
          test "$(curl -fsSL -o /tmp/p39.js -w '%{http_code}' https://plan-ex.ru/erpv2/assets/js/linear-trip-route-points.js)" = 200
          grep -Fq 'linear-trip-route-point-row' /tmp/p39.css
          grep -Fq 'data-trip-view-title' /tmp/p39.js
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' https://plan-ex.ru/erpv2/login)" = 200
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/p39_key"
