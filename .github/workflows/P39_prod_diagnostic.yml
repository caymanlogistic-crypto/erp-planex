name: P39 Production Diagnostic
on:
  push:
    branches: [chatgpt/p39-route-points-view-20260812]
permissions: {contents: read}
jobs:
  diag:
    if: "${{ startsWith(github.event.head_commit.message, 'P39: run production diagnostic') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        env: {PRIVATE_KEY: "${{ secrets.ERPV2_SSH_PRIVATE_KEY }}", KNOWN_HOSTS: "${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}"}
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/p39; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/p39 ~/.ssh/known_hosts
      - name: Diagnose
        env: {SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}"}
        run: |
          set -euo pipefail
          curl -sS -o /tmp/login -w 'HTTP_LOGIN=%{http_code}\n' https://plan-ex.ru/erpv2/login || true
          ssh -p "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -u
          ROOT=/home/s/spugovxsim/planexp; LIVE="$ROOT/public_html/erpv2"
          echo "MARKER=$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt" 2>/dev/null || echo missing)"
          php8.5 -l "$LIVE/public/index.php" || true
          php8.5 -l "$LIVE/app/Support/entrypoint_dependencies.php" || true
          php8.5 -l "$LIVE/app/Service/LinearRoutePointService.php" || true
          echo '--- migration audit ---'
          cd "$LIVE" && php8.5 scripts/p39_migration_audit.php || true
          echo '--- route migration status ---'
          php8.5 -r '$_SERVER["REQUEST_METHOD"]="GET"; require "app/Support/helpers.php"; require "app/Support/environment.php"; loadEnvFileNonOverwriting(".env"); $c=require "bootstrap/app.php"; require "app/Support/entrypoint_dependencies.php"; $db=new App\Core\Database($c["database"]); $p=$db->connection(); foreach($p->query("SELECT * FROM companies WHERE status=\"active\"")->fetchAll(PDO::FETCH_ASSOC) as $co){$l=(new App\Core\Database(companyDatabaseConfig($c,$co)))->connection(); echo "company=".$co["id"]." table=".$l->query("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=\"linear_route_points\"")->fetchColumn()." journal="; $s=$l->prepare("SELECT checksum FROM schema_migrations WHERE migration=\"052_create_linear_route_points.sql\""); $s->execute(); var_export($s->fetchColumn()); echo PHP_EOL;}' || true
          REMOTE
