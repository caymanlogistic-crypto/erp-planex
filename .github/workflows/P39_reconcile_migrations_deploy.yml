name: P39 Reconcile Migrations Deploy
on:
  push:
    branches: [chatgpt/p39-route-points-view-20260812]
permissions: {contents: write}
concurrency: {group: erpv2-p39-reconcile, cancel-in-progress: false}
jobs:
  deploy:
    if: "${{ startsWith(github.event.head_commit.message, 'P39: execute migration reconciliation') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply source patch and commit
        run: |
          set -euo pipefail
          python3 tools/p39_reconcile_known_migration_checksums.py
          php -l app/Service/LocalMigrationService.php
          git config user.name caymanlogistic-crypto
          git config user.email cayman.logistic@gmail.com
          if ! git diff --quiet -- app/Service/LocalMigrationService.php; then
            git add app/Service/LocalMigrationService.php
            git commit -m 'P39: reconcile historical migration checksums'
            git push origin HEAD:chatgpt/p39-route-points-view-20260812
          fi
      - name: Build artifact
        id: b
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD); a=p39_reconcile_${sha}.tar.gz
          git archive --format=tar "$sha" -- app bootstrap config database public scripts tests tools | gzip -n > "$a"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "a=$a" >> "$GITHUB_OUTPUT"; echo "sum=$(sha256sum "$a"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: SSH
        env: {PRIVATE_KEY: "${{ secrets.ERPV2_SSH_PRIVATE_KEY }}", KNOWN_HOSTS: "${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}"}
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/p39; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/p39 ~/.ssh/known_hosts
      - name: Backup and deploy
        env: {SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}", SHA: "${{ steps.b.outputs.sha }}", ART: "${{ steps.b.outputs.a }}", SUM: "${{ steps.b.outputs.sum }}"}
        run: |
          set -euo pipefail
          R=/home/s/spugovxsim/planexp/deploy/P39_reconcile_${SHA}.tar.gz
          scp -P "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ART" "$SSH_USER@$SSH_HOST:$R"
          ssh -p "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$R' '$SUM' '$SHA'"
      - name: Apply migrations and verify
        env: {SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}", SHA: "${{ steps.b.outputs.sha }}"}
        run: |
          set -euo pipefail
          out=$(ssh -p "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erpv2 && php8.5 scripts/p39_apply_route_points_migration.php && php8.5 -r '\''$_SERVER["REQUEST_METHOD"]="POST"; require "app/Support/helpers.php"; require "app/Support/environment.php"; loadEnvFileNonOverwriting(".env"); $c=require "bootstrap/app.php"; require "app/Support/entrypoint_dependencies.php"; $db=new App\Core\Database($c["database"]); $p=$db->connection(); foreach($p->query("SELECT * FROM companies WHERE status=\"active\"")->fetchAll(PDO::FETCH_ASSOC) as $co){$l=(new App\Core\Database(companyDatabaseConfig($c,$co)))->connection(); App\Service\LocalMigrationService::apply($l); echo "MIGRATIONS_OK company=".$co["id"].PHP_EOL;}'\'' && php8.5 scripts/p39_route_points_smoke.php && php8.5 scripts/p39_migration_audit.php')
          printf '%s\n' "$out"
          ! grep -q '^MISMATCH ' <<< "$out"
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' https://plan-ex.ru/erpv2/login)" = 200
          marker=$(ssh -p "$SSH_PORT" -i ~/.ssh/p39 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')
          test "$marker" = "$SHA"
          echo "P39_PRODUCTION_MIGRATIONS_PASS sha=$SHA"
