name: P39 Route Points + Trip View Controlled Deploy

on:
  push:
    branches:
      - chatgpt/p39-route-points-view-20260812

permissions:
  contents: write

concurrency:
  group: erpv2-p39-route-points-view
  cancel-in-progress: false

jobs:
  deploy:
    if: "${{ startsWith(github.event.head_commit.message, 'P39: execute route points deploy') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply deterministic P39 source patch
        run: |
          set -euo pipefail
          python3 tools/p39_apply_source_patch.py
          php -l app/Http/Controllers/Company/LinearTripActions/create_submit.php
          php -l app/Http/Controllers/Company/LinearTripActions/modal_edit_form.php
          php -l app/Http/Controllers/Company/LinearTripActions/modal_view.php
          php -l app/Service/LinearTripEditSaveService.php
          php -l app/Service/LinearRoutePointService.php
          php -l app/View/partials/company_linear_trip_create_form.php
          php -l app/View/partials/company_linear_trip_modal_edit.php
          php -l app/View/partials/company_linear_trip_modal_view.php
          php -l app/View/pages/company_linear_trips.php
          php -l scripts/p39_apply_route_points_migration.php
          php -l scripts/p39_route_points_smoke.php
          node --check public/assets/js/linear-trip-route-points.js
          grep -Fq "route_points[" app/View/partials/company_linear_trip_create_form.php
          grep -Fq "LinearRoutePointService::store" app/Http/Controllers/Company/LinearTripActions/create_submit.php
          grep -Fq "LinearRoutePointService::store" app/Service/LinearTripEditSaveService.php
          grep -Fq "Просмотр данных рейса" app/View/partials/company_linear_trip_modal_view.php

      - name: Commit P39 source result
        run: |
          set -euo pipefail
          git config user.name "caymanlogistic-crypto"
          git config user.email "cayman.logistic@gmail.com"
          git add app public
          git diff --cached --quiet && { echo 'Expected P39 patch changes missing'; exit 1; }
          git commit -m "P39: apply route points source changes"
          git push origin HEAD:chatgpt/p39-route-points-view-20260812

      - name: Verify isolated diff
        run: |
          set -euo pipefail
          BASE=ab15aa0f718854a22a00063d9bc8f0d171b6e6ac
          git diff --name-only "$BASE"...HEAD | sort | tee /tmp/p39_changed.txt
          allowed='app/Http/Controllers/Company/LinearTripActions/create_submit.php
          app/Http/Controllers/Company/LinearTripActions/modal_edit_form.php
          app/Http/Controllers/Company/LinearTripActions/modal_view.php
          app/Service/LinearRoutePointService.php
          app/Service/LinearTripEditSaveService.php
          app/Support/entrypoint_dependencies.php
          app/View/pages/company_linear_trips.php
          app/View/partials/company_linear_trip_create_form.php
          app/View/partials/company_linear_trip_modal_edit.php
          app/View/partials/company_linear_trip_modal_view.php
          database/migrations-local/052_create_linear_route_points.sql
          public/assets/css/linear-trip-route-points.css
          public/assets/js/linear-trip-route-points.js
          scripts/p39_apply_route_points_migration.php
          scripts/p39_route_points_smoke.php
          tools/p39_apply_source_patch.py
          .github/workflows/P39_route_points_view_deploy.yml
          .github/p39/P39_DEPLOY_TRIGGER.txt'
          while IFS= read -r f; do
            printf '%s\n' "$allowed" | sed 's/^ *//' | grep -Fxq "$f" || { echo "Unexpected changed file: $f"; exit 1; }
          done < /tmp/p39_changed.txt

      - name: Build exact source artifact
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          artifact="p39_erpv2_${sha}.tar.gz"
          git archive --format=tar "$sha" -- app bootstrap config database public scripts tests tools | gzip -n > "$artifact"
          sha256="$(sha256sum "$artifact" | awk '{print $1}')"
          printf 'sha=%s\nartifact=%s\nsha256=%s\n' "$sha" "$artifact" "$sha256" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p39_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p39_key" "$HOME/.ssh/known_hosts"

      - name: Guard production and backup
        id: before
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          out="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p39_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          OLD="$ROOT/public_html/erp"
          current="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          test "$current" = "ab15aa0f718854a22a00063d9bc8f0d171b6e6ac"
          oldfp="$(cd "$OLD" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$ROOT/deploy_backups/P39_${ts}_${current}"
          mkdir -p "$backup"
          tar -C "$LIVE" -czf "$backup/erpv2_current.tar.gz" .
          test -s "$backup/erpv2_current.tar.gz"
          printf 'current=%s\noldfp=%s\nbackup=%s\n' "$current" "$oldfp" "$backup"
          REMOTE
          )"
          printf '%s\n' "$out"
          while IFS='=' read -r k v; do case "$k" in current|oldfp|backup) printf '%s=%s\n' "$k" "$v" >> "$GITHUB_OUTPUT";; esac; done <<< "$out"

      - name: Deploy exact artifact through P07
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARTIFACT: ${{ steps.source.outputs.artifact }}
          ARTIFACT_SHA: ${{ steps.source.outputs.sha256 }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="/home/s/spugovxsim/planexp/deploy/P39_artifact_${SOURCE_SHA}.tar.gz"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/p39_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ARTIFACT" "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p39_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$remote' '$ARTIFACT_SHA' '$SOURCE_SHA'"

      - name: Apply additive local migration and transactional smoke
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p39_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erpv2 && php scripts/p39_apply_route_points_migration.php && php scripts/p39_route_points_smoke.php'

      - name: Verify live P39 and old ERP preservation
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OLD_FP_BEFORE: ${{ steps.before.outputs.oldfp }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/login)" = 200
          test "$(curl -fsSL -o /tmp/p39.css -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/assets/css/linear-trip-route-points.css)" = 200
          test "$(curl -fsSL -o /tmp/p39.js -w '%{http_code}' --max-time 30 https://plan-ex.ru/erpv2/assets/js/linear-trip-route-points.js)" = 200
          grep -Fq 'linear-trip-route-point-row' /tmp/p39.css
          grep -Fq 'data-trip-view-title' /tmp/p39.js
          state="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/p39_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          marker="$(cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt")"
          oldfp="$(cd "$ROOT/public_html/erp" && find app bootstrap config database public -type f -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | awk '{print $1}')"
          php -l "$LIVE/app/View/partials/company_linear_trip_modal_view.php" >/dev/null
          php -l "$LIVE/app/Http/Controllers/Company/LinearTripActions/create_submit.php" >/dev/null
          grep -Fq 'route_points[' "$LIVE/app/View/partials/company_linear_trip_create_form.php"
          grep -Fq '052_create_linear_route_points.sql' "$LIVE"/database/migrations-local/052_create_linear_route_points.sql || true
          printf 'marker=%s\noldfp=%s\n' "$marker" "$oldfp"
          REMOTE
          )"
          marker="$(printf '%s\n' "$state" | sed -n 's/^marker=//p')"
          oldfp="$(printf '%s\n' "$state" | sed -n 's/^oldfp=//p')"
          test "$marker" = "$SOURCE_SHA"
          test "$oldfp" = "$OLD_FP_BEFORE"
          printf 'P39_DEPLOY_PASS sha=%s old_erp_unchanged=true\n' "$SOURCE_SHA"

      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/p39_key"
