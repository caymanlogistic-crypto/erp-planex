name: P40 Documentation Inventory Verify
on:
  push:
    branches: [chatgpt/p39-route-points-view-20260812]
permissions: {contents: read}
jobs:
  inventory:
    if: "${{ startsWith(github.event.head_commit.message, 'P40: run docs inventory') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inventory markdown and repository state
        run: |
          set -euo pipefail
          echo '=== HEAD ==='; git rev-parse HEAD
          echo '=== MARKDOWN FILES ==='
          find . -type f \( -iname '*.md' -o -iname '*.markdown' \) -not -path './.git/*' | sort
          echo '=== MARKDOWN COUNT ==='
          find . -type f \( -iname '*.md' -o -iname '*.markdown' \) -not -path './.git/*' | wc -l
          echo '=== TOP LEVEL ==='; find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -n 250
      - name: Safe static verification
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null || failures=$((failures+1)); done < <(find app bootstrap config public scripts tools tests -type f -name '*.php' -print0 2>/dev/null)
          echo "PHP_SYNTAX_FAILURES=$failures"; test "$failures" = 0
          jsfail=0
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null || jsfail=$((jsfail+1)); done < <(find public tools tests -type f -name '*.js' -print0 2>/dev/null)
          echo "JS_SYNTAX_FAILURES=$jsfail"; test "$jsfail" = 0
          if [ -f tools/architecture_guard.php ]; then php tools/architecture_guard.php; fi
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          files=[]
          for d in (Path('database/migrations'),Path('database/migrations-local')):
              if d.exists(): files += sorted(d.glob('*.sql'))
          nums=[]
          for p in files:
              m=re.match(r'(\d+)_',p.name)
              if m: nums.append((str(p.parent),int(m.group(1)),p.name))
          dup=[]
          for parent in sorted(set(x[0] for x in nums)):
              c=Counter(n for d,n,f in nums if d==parent)
              for n,v in c.items():
                  if v>1: dup.append((parent,n,[f for d,nn,f in nums if d==parent and nn==n]))
          print('MIGRATION_FILES=',len(files)); print('MIGRATION_DUPLICATES=',dup)
          if dup: raise SystemExit(1)
          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts: continue
              p.read_text(encoding='utf-8')
          print('MARKDOWN_UTF8=PASS')
          PY
