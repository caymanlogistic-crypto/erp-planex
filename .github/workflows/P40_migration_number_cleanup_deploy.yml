name: P40 Migration Number Cleanup Deploy
on:
  push:
    branches: [chatgpt/p39-route-points-view-20260812]
permissions: {contents: write}
concurrency: {group: erpv2-p40-migration-number-cleanup, cancel-in-progress: false}
jobs:
  cleanup:
    if: "${{ startsWith(github.event.head_commit.message, 'P40: execute migration number cleanup') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Renumber duplicate migrations
        run: |
          set -euo pipefail
          python3 tools/p40_renumber_duplicate_migrations.py
          php -l scripts/p40_reconcile_migration_names.php
          php -l scripts/p39_apply_route_points_migration.php
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          for d in (Path('database/migrations'),Path('database/migrations-local')):
              if not d.exists(): continue
              rows=[]
              for p in d.glob('*.sql'):
                  m=re.match(r'(\d+)_',p.name)
                  if m: rows.append((int(m.group(1)),p.name))
              c=Counter(n for n,_ in rows)
              dup={n:[f for nn,f in rows if nn==n] for n,v in c.items() if v>1}
              print(d, 'duplicates=',dup)
              if dup: raise SystemExit(1)
          PY
          git config user.name caymanlogistic-crypto
          git config user.email cayman.logistic@gmail.com
          git add -A database/migrations-local scripts tools app .github
          git commit -m 'P40: normalize local migration numbering'
          git push origin HEAD:chatgpt/p39-route-points-view-20260812
      - name: Static verification
        run: |
          set -euo pipefail
          fail=0; while IFS= read -r -d '' f; do php -l "$f" >/dev/null || fail=$((fail+1)); done < <(find app bootstrap config public scripts tools tests -type f -name '*.php' -print0 2>/dev/null); test "$fail" = 0
          node --check public/assets/js/linear-trip-route-points.js
          php tools/architecture_guard.php
      - name: Build exact artifact
        id: b
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD); a=p40_migrations_${sha}.tar.gz
          git archive --format=tar "$sha" -- app bootstrap config database public scripts tests tools | gzip -n > "$a"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "a=$a" >> "$GITHUB_OUTPUT"; echo "sum=$(sha256sum "$a"|awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env: {PRIVATE_KEY: "${{ secrets.ERPV2_SSH_PRIVATE_KEY }}", KNOWN_HOSTS: "${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}"}
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/p40; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/p40 ~/.ssh/known_hosts
      - name: Backup old ERP fingerprint and deploy ERPv2
        id: before
        env: {SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}", SHA: "${{ steps.b.outputs.sha }}", ART: "${{ steps.b.outputs.a }}", SUM: "${{ steps.b.outputs.sum }}"}
        run: |
          set -euo pipefail
          oldfp=$(ssh -p "$SSH_PORT" -i ~/.ssh/p40 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf '%P %s %T@\\n' 2>/dev/null | sort | sha256sum | awk '{print \\$1}'")
          echo "oldfp=$oldfp" >> "$GITHUB_OUTPUT"
          R=/home/s/spugovxsim/planexp/deploy/P40_migrations_${SHA}.tar.gz
          scp -P "$SSH_PORT" -i ~/.ssh/p40 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$ART" "$SSH_USER@$SSH_HOST:$R"
          ssh -p "$SSH_PORT" -i ~/.ssh/p40 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "/home/s/spugovxsim/planexp/deploy/P07_deploy_erpv2.sh '$R' '$SUM' '$SHA'"
      - name: Reconcile journals and apply all migrations
        env: {SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}"}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/p40 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cd /home/s/spugovxsim/planexp/public_html/erpv2 && php8.5 scripts/p40_reconcile_migration_names.php && php8.5 -r '\''$_SERVER["REQUEST_METHOD"]="POST"; require "app/Support/helpers.php"; require "app/Support/environment.php"; loadEnvFileNonOverwriting(".env"); $c=require "bootstrap/app.php"; require "app/Support/entrypoint_dependencies.php"; $db=new App\Core\Database($c["database"]); $p=$db->connection(); foreach($p->query("SELECT * FROM companies WHERE status=\"active\"")->fetchAll(PDO::FETCH_ASSOC) as $co){$l=(new App\Core\Database(companyDatabaseConfig($c,$co)))->connection(); App\Service\LocalMigrationService::apply($l); echo "MIGRATIONS_OK company=".$co["id"].PHP_EOL;}'\'' && php8.5 scripts/p39_route_points_smoke.php && php8.5 scripts/p39_migration_audit.php'
      - name: Production verification
        env: {SSH_HOST: "${{ secrets.ERPV2_SSH_HOST }}", SSH_PORT: "${{ secrets.ERPV2_SSH_PORT }}", SSH_USER: "${{ secrets.ERPV2_SSH_USER }}", SHA: "${{ steps.b.outputs.sha }}", OLD_FP: "${{ steps.before.outputs.oldfp }}"}
        run: |
          set -euo pipefail
          test "$(curl -fsSL -o /dev/null -w '%{http_code}' https://plan-ex.ru/erpv2/login)" = 200
          marker=$(ssh -p "$SSH_PORT" -i ~/.ssh/p40 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')
          test "$marker" = "$SHA"
          oldfp=$(ssh -p "$SSH_PORT" -i ~/.ssh/p40 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "cd /home/s/spugovxsim/planexp/public_html/erp && find app bootstrap config database public -type f -printf '%P %s %T@\\n' 2>/dev/null | sort | sha256sum | awk '{print \\$1}'")
          test "$oldfp" = "$OLD_FP"
          echo "P40_MIGRATION_NUMBERING_PRODUCTION_PASS sha=$SHA old_erp_unchanged=true"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/p40
