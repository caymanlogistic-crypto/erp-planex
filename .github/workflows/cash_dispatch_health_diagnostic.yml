name: Cash Dispatch Health Diagnostic
on:
  push:
    branches: [agent/cash-dispatch-health-diagnostic-20260815]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/diag"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/diag" "$HOME/.ssh/known_hosts"
      - name: Read-only server diagnostics
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$PORT" -i "$HOME/.ssh/diag" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -se' <<'REMOTE' | tee CASH_DISPATCH_HEALTH_DIAG.txt
          set +e
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          echo '=== MARKER ==='
          cat "$ROOT/deploy/P07_erpv2_deployed_commit.txt" 2>&1
          echo '=== CURRENT HEALTH TARGET EXACTLY AS P07 ==='
          curl -sS -D - -o /tmp/p07_http_body --max-time 20 http://planexp.ru/erpv2/login 2>&1 | head -80
          echo 'BODY:'; head -c 2000 /tmp/p07_http_body 2>&1; echo
          echo '=== CURRENT HTTPS PROD ==='
          curl -sS -D - -o /tmp/p07_https_body --max-time 20 https://plan-ex.ru/erpv2/login 2>&1 | head -60
          echo '=== DEPLOY LOG TAIL ==='
          tail -n 80 "$ROOT/deploy/P07_deployments.log" 2>&1
          echo '=== RECENT BUILD DIRS + HEALTH BODIES ==='
          find "$ROOT/deploy" -maxdepth 1 -type d -name 'P07_build_*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -8 | while read -r ts d; do
            echo "--- BUILD $d"; ls -la "$d" 2>&1 | head -40
            if [ -f "$d/P07_erpv2_health.html" ]; then echo '--- ERPV2 HEALTH BODY'; head -c 8000 "$d/P07_erpv2_health.html" 2>&1; echo; fi
            if [ -f "$d/P07_production_health.html" ]; then echo '--- OLD ERP HEALTH BODY'; head -c 3000 "$d/P07_production_health.html" 2>&1; echo; fi
          done
          echo '=== FAILED DIR FOR 721444 ==='
          find "$ROOT/deploy" -maxdepth 1 -type d -name 'P07_failed_*_72144410c3ee' -print -exec find {} -maxdepth 2 -type f -printf '%p %s bytes\n' \; 2>&1
          rm -f /tmp/p07_http_body /tmp/p07_https_body 2>/dev/null
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash_dispatch_health_diag_${{ github.sha }}
          path: CASH_DISPATCH_HEALTH_DIAG.txt
          if-no-files-found: warn