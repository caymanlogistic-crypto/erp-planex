name: Final verify linear trip date modes v2

on:
  push:
    branches:
      - verify-linear-trip-date-modes-20260813
    paths:
      - '.github/workflows/final_verify_linear_trip_date_modes_v2.yml'

permissions:
  contents: read

env:
  EXPECTED_DEPLOY_HEAD: e18363fba8d1de592b133d9e691626bf62705c36
  BASE_URL: https://plan-ex.ru/erpv2/

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed SHA and four tenant DB date columns
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/final_trip_verify"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/final_trip_verify" "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/final_trip_verify" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "EXPECTED_DEPLOY_HEAD='$EXPECTED_DEPLOY_HEAD' php -d display_errors=1" <<'PHP'
          <?php
          $root='/home/s/spugovxsim/planexp';
          $marker=trim((string)file_get_contents($root.'/deploy/P07_erpv2_deployed_commit.txt'));
          if($marker!==getenv('EXPECTED_DEPLOY_HEAD')){fwrite(STDERR,"marker mismatch\n");exit(2);}
          function readEnvFile($path){
              $out=array();
              $lines=@file($path,FILE_IGNORE_NEW_LINES);
              if($lines===false)return $out;
              foreach($lines as $line){
                  $line=trim($line);
                  if($line===''||substr($line,0,1)==='#'||strpos($line,'=')===false)continue;
                  $parts=explode('=',$line,2);
                  $out[trim($parts[0])]=trim($parts[1]," \t\n\r\0\x0B\"'");
              }
              return $out;
          }
          $e=readEnvFile($root.'/public_html/erpv2/.env');
          $host=isset($e['DB_HOST'])?$e['DB_HOST']:'127.0.0.1';
          $port=isset($e['DB_PORT'])?$e['DB_PORT']:'3306';
          $central=isset($e['DB_DATABASE'])?$e['DB_DATABASE']:'erp_planex';
          $user=isset($e['DB_USERNAME'])?$e['DB_USERNAME']:'root';
          $pass=isset($e['DB_PASSWORD'])?$e['DB_PASSWORD']:'';
          $pdo=new PDO('mysql:host='.$host.';port='.$port.';dbname='.$central.';charset=utf8mb4',$user,$pass,array(PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION));
          $ids=$pdo->query('SELECT id FROM companies ORDER BY id')->fetchAll(PDO::FETCH_COLUMN);
          $checked=0;
          foreach($ids as $id){
              $schema='erp_company_'.intval($id);
              $q=$pdo->prepare("SELECT COLUMN_NAME,IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=? AND TABLE_NAME='linear_routes' AND COLUMN_NAME IN ('planned_loading_date','planned_unloading_date','actual_loading_date','actual_unloading_date') ORDER BY COLUMN_NAME");
              $q->execute(array($schema));
              $rows=$q->fetchAll(PDO::FETCH_KEY_PAIR);
              if(!$rows)continue;
              $checked++;
              $names=array('planned_loading_date','actual_loading_date','planned_unloading_date','actual_unloading_date');
              foreach($names as $name){if(!array_key_exists($name,$rows)){fwrite(STDERR,$schema.' missing '.$name."\n");exit(3);}}
              foreach($names as $name){if($rows[$name]!=='YES'){fwrite(STDERR,$schema.' '.$name.' is not nullable' . "\n");exit(4);}}
              echo 'DB_DATE_COLUMNS_OK schema='.$schema.' planned_start='.$rows['planned_loading_date'].' actual_start='.$rows['actual_loading_date'].' planned_end='.$rows['planned_unloading_date'].' actual_end='.$rows['actual_unloading_date']."\n";
          }
          if($checked<1){fwrite(STDERR,"no tenant linear_routes found\n");exit(5);}
          echo 'DEPLOY_MARKER_OK '.$marker."\n";
          PHP
          rm -f "$HOME/.ssh/final_trip_verify"

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Resolve owner credentials
        shell: bash
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          if [ -z "$credentials" ]; then
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/final_credentials"
            chmod 600 "$HOME/.ssh/final_credentials"
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/final_credentials" --input .github/p11/P11_runtime_credentials.enc.json)"
            rm -f "$HOME/.ssh/final_credentials"
          fi
          test -n "$credentials"
          echo "::add-mask::$credentials"
          printf 'P11_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"

      - name: Browser verify registry create view edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final_verify_output
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const BASE=process.env.BASE_URL;
          const creds=JSON.parse(Buffer.from(process.env.P11_CREDENTIALS_B64,'base64').toString('utf8'));
          const owner=creds.find(x=>String(x.role||'').toUpperCase()==='OWNER');
          const has=(a,b)=>String(a||'').toLocaleLowerCase('ru-RU').includes(String(b).toLocaleLowerCase('ru-RU'));
          if(!owner)throw Error('OWNER missing');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1920,height:1080},deviceScaleFactor:1,locale:'ru-RU',timezoneId:'Europe/Moscow',ignoreHTTPSErrors:true});
            const page=await ctx.newPage(); const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text());});
            await page.goto(new URL('login',BASE).href,{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('input[name="username"],input[name="email"],input[type="email"],input[type="text"]').first().fill(owner.username);
            await page.locator('input[type="password"]').first().fill(owner.password);
            await Promise.all([page.waitForLoadState('domcontentloaded',{timeout:20000}).catch(()=>{}),page.locator('button[type="submit"],input[type="submit"]').first().click()]);
            await page.waitForTimeout(900); if(/\/login(?:[/?#]|$)/i.test(page.url()))throw Error('auth failed');
            await page.goto(new URL('company/trips/linear',BASE).href,{waitUntil:'domcontentloaded',timeout:45000}); await page.waitForTimeout(900);
            let row=page.locator('tr[data-linear-route-id="9"]').first(); if(!(await row.count()))row=page.locator('tr[data-linear-route-id]').first(); if(!(await row.count()))throw Error('no routes');
            const routeId=await row.getAttribute('data-linear-route-id');
            const normalColor=await row.locator('td').nth(3).evaluate(el=>getComputedStyle(el).color);
            const dates=await row.locator('td.registry-date').evaluateAll(cs=>cs.map(c=>({text:c.innerText.trim(),planned:c.classList.contains('registry-date-planned'),color:getComputedStyle(c.querySelector('.registry-date-value')||c).color})));
            if(dates.length!==2)throw Error('registry dates count '+dates.length);
            dates.forEach(d=>{if(d.planned&&!has(d.text,'(плановая)'))throw Error('planned note missing '+JSON.stringify(d));if(d.planned&&d.color===normalColor)throw Error('planned date not gray '+JSON.stringify(d));});
            await page.screenshot({path:'final_verify_output/registry.png'});

            await page.getByRole('link',{name:'Создать рейс'}).click();
            const create=page.locator('#linear-trip-create-modal.is-open'); await create.waitFor({state:'visible',timeout:5000}); const cf=create.locator('form[data-linear-trip-form]'); await cf.locator('[data-trip-date-control="start"]').waitFor({state:'visible',timeout:5000}); await page.waitForTimeout(400);
            const cm=await cf.evaluate(f=>{const d=f.querySelector('.linear-trip-date-row'),p=f.querySelector('.linear-trip-participant-row'),c=f.querySelector('.linear-trip-cargo-row'),s=f.querySelector('[data-trip-date-control="start"]'),e=f.querySelector('[data-trip-date-control="end"]'),g=f.querySelector('[name="cargo_type_name"]'),active=x=>[...x.querySelectorAll('[data-trip-date-kind].is-active')].map(b=>b.dataset.tripDateKind),dr=d.getBoundingClientRect(),pr=p.getBoundingClientRect(),cr=c.getBoundingClientRect();return{ys:[dr.y,pr.y,cr.y],widths:[dr.width,pr.width,cr.width],startLabel:s.querySelector('.field-label').textContent.trim(),endLabel:e.querySelector('.field-label').textContent.trim(),startActive:active(s),endActive:active(e),cargoLabel:g.closest('.field').querySelector('.field-label').textContent.trim(),cargoVisible:!!g.offsetParent,cargoValue:g.value,client:!!f.querySelector('.linear-trip-participant-row [name="client_id"]'),executor:!!f.querySelector('.linear-trip-participant-row [name="route_executor_id"]')};});
            if(!has(cm.startLabel,'Начало рейса')||!has(cm.endLabel,'Окончание рейса')||JSON.stringify(cm.startActive)!=='["plan"]'||cm.endActive.length!==0)throw Error('create date controls '+JSON.stringify(cm));
            if(!(cm.ys[0]<cm.ys[1]&&cm.ys[1]<cm.ys[2])||!cm.client||!cm.executor||!cm.cargoVisible||!has(cm.cargoLabel,'Перевозимый груз')||cm.widths[2]<cm.widths[1]*.9||cm.cargoValue==='Не указан')throw Error('create layout '+JSON.stringify(cm));
            await page.screenshot({path:'final_verify_output/create.png'}); await create.locator('.modal-close').click(); await create.waitFor({state:'hidden',timeout:5000});

            await row.dblclick(); const view=page.locator('#linear-trip-view-modal.is-open'); await view.waitFor({state:'visible',timeout:7000}); await view.locator('.trip-view-table').waitFor({state:'visible',timeout:7000}); await page.waitForTimeout(250); const vt=await view.innerText();
            if(!has(vt,'Начало рейса')||!has(vt,'Окончание рейса')||!has(vt,'Перевозимый груз'))throw Error('view fields missing');
            if(dates.some(d=>d.planned)&&!(await view.locator('.trip-view-date-note').allTextContents()).some(t=>has(t,'плановая')))throw Error('view planned note missing'); await page.screenshot({path:'final_verify_output/view.png'});

            const eb=view.locator('[data-linear-trip-edit-btn]'); if(!(await eb.count()))throw Error('edit button missing'); await eb.click(); const ef=view.locator('#linear-trip-edit-form'); await ef.waitFor({state:'visible',timeout:7000}); await ef.locator('[data-trip-date-control="start"]').waitFor({state:'visible',timeout:5000}); await page.waitForTimeout(350);
            const em=await ef.evaluate(f=>{const d=f.querySelector('.linear-trip-date-row'),p=f.querySelector('.linear-trip-participant-row'),c=f.querySelector('.linear-trip-cargo-row'),s=f.querySelector('[data-trip-date-control="start"]'),e=f.querySelector('[data-trip-date-control="end"]'),g=f.querySelector('[name="cargo_type_name"]'),active=x=>[...x.querySelectorAll('[data-trip-date-kind].is-active')].map(b=>b.dataset.tripDateKind),dr=d.getBoundingClientRect(),pr=p.getBoundingClientRect(),cr=c.getBoundingClientRect();return{ys:[dr.y,pr.y,cr.y],widths:[dr.width,pr.width,cr.width],startActive:active(s),endActive:active(e),startValue:s.querySelector('[data-trip-date-visible]').value,endValue:e.querySelector('[data-trip-date-visible]').value,cargoVisible:!!g.offsetParent,cargoLabel:g.closest('.field').querySelector('.field-label').textContent.trim(),four:['planned_loading_date','actual_loading_date','planned_unloading_date','actual_unloading_date'].every(n=>!!f.querySelector('[name="'+n+'"]')),client:!!f.querySelector('.linear-trip-participant-row [name="client_id"]'),executor:!!f.querySelector('.linear-trip-participant-row [name="route_executor_id"]')};});
            if(em.startActive.length!==1||!em.startValue||!(em.ys[0]<em.ys[1]&&em.ys[1]<em.ys[2])||!em.four||!em.client||!em.executor||!em.cargoVisible||!has(em.cargoLabel,'Перевозимый груз')||em.widths[2]<em.widths[1]*.9)throw Error('edit layout/state '+JSON.stringify(em)); await page.screenshot({path:'final_verify_output/edit.png'});

            const result={routeId,normalColor,dates,create:cm,edit:em,errors}; fs.writeFileSync('final_verify_output/result.json',JSON.stringify(result,null,2)); console.log('FINAL_VERIFY='+JSON.stringify(result)); if(errors.length)throw Error(errors.join(' | ')); await browser.close();
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1);});
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-linear-trip-date-mode-verification-v2
          path: final_verify_output/
          if-no-files-found: warn
          retention-days: 14
