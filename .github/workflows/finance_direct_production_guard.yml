name: Finance Direct Production Guard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = read-only snapshot, migrate076 = apply only migration 076 then verify'
        required: true
        type: choice
        options:
          - verify
          - migrate076
      confirm:
        description: 'Type VERIFY_FINANCE or MIGRATE_FINANCE_076 matching mode'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finance-direct-production-guard
  cancel-in-progress: false

env:
  LIVE_ROOT: /home/s/spugovxsim/planexp/public_html/erpv2

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate authorization
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in
            verify) test "$CONFIRM" = 'VERIFY_FINANCE' ;;
            migrate076) test "$CONFIRM" = 'MIGRATE_FINANCE_076' ;;
            *) exit 1 ;;
          esac
          php -l scripts/finance_direct_verify.php
          php -l scripts/finance_direct_apply_076.php

      - name: Configure isolated SSH credentials
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/finance_direct_guard_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/finance_direct_guard_key" "$HOME/.ssh/known_hosts"

      - name: Upload isolated guard scripts
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/finance_direct_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/finance_direct_verify.php "$SSH_USER@$SSH_HOST:/tmp/finance_direct_verify_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/finance_direct_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/finance_direct_apply_076.php "$SSH_USER@$SSH_HOST:/tmp/finance_direct_apply_076_${GITHUB_RUN_ID}.php"

      - name: Read-only snapshot before action
        id: before
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' php '/tmp/finance_direct_verify_${GITHUB_RUN_ID}.php'" | tee finance_direct_before.txt
          grep -q 'FINANCE_DIRECT_READ_ONLY_OK' finance_direct_before.txt
          fp="$(sed -n 's/^FINANCE_DIRECT_READ_ONLY_FINGERPRINT=//p' finance_direct_before.txt)"
          test -n "$fp"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Apply migration 076 only
        if: ${{ inputs.mode == 'migrate076' }}
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' php '/tmp/finance_direct_apply_076_${GITHUB_RUN_ID}.php'" | tee finance_direct_migration.txt
          grep -q 'FINANCE_DIRECT_076_OK' finance_direct_migration.txt

      - name: Read-only snapshot after action
        id: after
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "PLANEX_ROOT='$LIVE_ROOT' php '/tmp/finance_direct_verify_${GITHUB_RUN_ID}.php'" | tee finance_direct_after.txt
          grep -q 'FINANCE_DIRECT_READ_ONLY_OK' finance_direct_after.txt
          fp="$(sed -n 's/^FINANCE_DIRECT_READ_ONLY_FINGERPRINT=//p' finance_direct_after.txt)"
          test -n "$fp"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Verify invariants for mode
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BEFORE_FP: ${{ steps.before.outputs.fingerprint }}
          AFTER_FP: ${{ steps.after.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ "$MODE" = 'verify' ]; then
            test "$BEFORE_FP" = "$AFTER_FP"
          else
            # Migration changes only schema snapshot flags. Business-data counters and
            # historical CASH invariants must remain byte-for-byte identical.
            before_json="$(sed -n 's/^FINANCE_DIRECT_READ_ONLY_SNAPSHOT=//p' finance_direct_before.txt)"
            after_json="$(sed -n 's/^FINANCE_DIRECT_READ_ONLY_SNAPSHOT=//p' finance_direct_after.txt)"
            python3 - "$before_json" "$after_json" <<'PY'
          import json, sys
          before=json.loads(sys.argv[1]); after=json.loads(sys.argv[2])
          mutable={'employee_account_table_exists','employee_account_rows','migration_076_applied'}
          for key in before:
              if key not in mutable and before[key] != after[key]:
                  raise SystemExit(f'business invariant changed: {key}: {before[key]} -> {after[key]}')
          if not after['employee_account_table_exists'] or after['migration_076_applied'] != 1:
              raise SystemExit('migration 076 did not become active for PLANEX')
          print('FINANCE_DIRECT_MIGRATION_INVARIANTS_OK')
          PY
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance_direct_production_guard_${{ inputs.mode }}_${{ github.run_id }}
          path: |
            finance_direct_before.txt
            finance_direct_after.txt
            finance_direct_migration.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          if [ -f "$HOME/.ssh/finance_direct_guard_key" ]; then
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/finance_direct_guard_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
              "rm -f '/tmp/finance_direct_verify_${GITHUB_RUN_ID}.php' '/tmp/finance_direct_apply_076_${GITHUB_RUN_ID}.php'" 2>/dev/null || true
          fi
          rm -f "$HOME/.ssh/finance_direct_guard_key" 2>/dev/null || true
