name: Finance Employee Direct Regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/Service/FinanceMatchingRuleEmployeeExecutionTrait.php
          php -l app/Service/FinanceEmployeeMoneyAccountService.php
          php -l app/Service/FinanceEmployeeBankSettlementService.php
          php -l app/Service/FinanceEmployeeDirectTransferService.php
          php -l app/Service/FinanceEmployeeDirectExpenseService.php
          php -l app/Service/FinanceEmployeeDirectInvoicePaymentService.php
          php -l app/Http/Controllers/Company/FinanceEmployeeDirectActions/bank_link.php
          php -l app/Http/Controllers/Company/FinanceEmployeeDirectActions/transfer_submit.php
          php -l app/Http/Controllers/Company/FinanceEmployeeDirectActions/personal_expense_create.php
          php -l app/Http/Controllers/Company/FinanceEmployeeDirectActions/invoice_payment_create.php
          php -l app/View/partials/company_finance_matching_rule_form.php
          php -l tests/finance_matching_employee_cash_test.php
          php -l tests/finance_employee_transfer_test.php
      - name: Existing matching semantics
        run: php tests/finance_matching_classification_test.php
      - name: Employee direct architecture
        run: php tests/finance_matching_employee_cash_test.php
      - name: Employee transfer compatibility
        run: php tests/finance_employee_transfer_test.php
      - name: Tenant migration shape
        run: |
          test -f database/migrations-local/076_finance_employee_money_accounts.sql
          grep -q 'finance_employee_money_accounts' database/migrations-local/076_finance_employee_money_accounts.sql
          test ! -f database/migrations/20260818_finance_employee_money_accounts.sql
      - name: No active cash writes
        run: |
          ! grep -q 'FinanceCashController' app/Http/Routes/company_finance_cash.php
          grep -q 'Создание и изменение кассовых операций отключено' app/Http/Routes/company_finance_cash.php
          ! grep -q 'INSERT INTO finance_cash_resolutions' app/Service/FinanceEmployeeBankSettlementService.php
          ! grep -q 'INSERT INTO finance_cash_resolutions' app/Service/FinanceEmployeeDirectTransferService.php
