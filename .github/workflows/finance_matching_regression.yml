name: Finance Matching Regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Service/FinanceMatchingRuleService.php
          for f in app/Service/FinanceMatchingRule*Trait.php; do php -l "$f"; done
          php -l app/Http/Controllers/Company/BankFinanceActions/classifyForm.php
          php -l app/Http/Controllers/Company/BankFinanceActions/classifySubmit.php
          php -l tests/finance_matching_classification_test.php
      - name: Matching semantics
        run: php tests/finance_matching_classification_test.php
      - name: Migration shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'finance_cash_flow_centers' database/migrations-local/063_finance_matching_classification.sql
          grep -q 'classification_locked' database/migrations-local/063_finance_matching_classification.sql
          grep -q 'linked_cash_transaction_id' database/migrations-local/063_finance_matching_classification.sql
