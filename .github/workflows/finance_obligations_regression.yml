name: Finance Obligations Regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_obligations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and architecture
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Service/FinanceObligationService.php
          php -l app/Http/Controllers/Company/InvoiceActions/obligations.php
          php -l app/Http/Controllers/Company/InvoiceActions/receivables.php
          php -l app/View/pages/company_finance_receivables.php
          php -l tests/finance_obligations_architecture_test.php
          php tests/finance_obligations_architecture_test.php
      - name: Migration execution
        shell: bash
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot erp_obligations_test <<'SQL'
          CREATE TABLE finance_invoices(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,status VARCHAR(30) NOT NULL DEFAULT 'draft') ENGINE=InnoDB;
          CREATE TABLE finance_invoice_links(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,invoice_id INT UNSIGNED NOT NULL,linear_route_id INT UNSIGNED NULL,linear_route_payment_id INT UNSIGNED NULL,amount DECIMAL(12,2) NULL,side VARCHAR(20) NULL) ENGINE=InnoDB;
          CREATE TABLE finance_operations(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY) ENGINE=InnoDB;
          CREATE TABLE finance_operation_allocations(id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,operation_id INT UNSIGNED NOT NULL,invoice_id INT UNSIGNED NULL,linear_route_id INT UNSIGNED NULL,linear_route_payment_id INT UNSIGNED NULL,amount DECIMAL(12,2) NOT NULL,allocation_date DATE NOT NULL,cancelled_at DATETIME NULL) ENGINE=InnoDB;
          SQL
          mysql -h127.0.0.1 -uroot -proot erp_obligations_test < database/migrations-local/071_finance_obligations.sql
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='erp_obligations_test' AND table_name='finance_operation_allocations' AND column_name='obligation_id'" | grep -qx '1'
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='erp_obligations_test' AND table_name='finance_invoice_links' AND column_name='obligation_id'" | grep -qx '1'
