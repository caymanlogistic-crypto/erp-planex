name: Maintenance Remove Obsolete ATI Test Expense

on:
  push:
    branches:
      - maintenance/remove-obsolete-ati-test-expense-20260817

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure isolated SSH
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/maintenance_key"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/maintenance_key" "$HOME/.ssh/known_hosts"

      - name: Verify exact deployed ERPv2 marker
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: efda4aa398afff40080d74d11ccdc346de4beaf1
        shell: bash
        run: |
          set -euo pipefail
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/maintenance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$EXPECTED_SHA"
          echo "DEPLOYED_SHA_CONFIRMED=$got"

      - name: Read-only diagnostic for obsolete ATI fact
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$PORT" -i "$HOME/.ssh/maintenance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cd /home/s/spugovxsim/planexp/public_html/erpv2 && /usr/bin/php8.5' <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          require_once $root . '/app/Support/helpers.php';
          require_once $root . '/app/Support/environment.php';
          loadEnvFileNonOverwriting($root . '/.env');
          $config = require $root . '/bootstrap/app.php';
          require_once $root . '/app/Support/entrypoint_dependencies.php';

          $central = (new \App\Core\Database($config['database']))->connection();
          $companies = $central->query("SELECT * FROM companies WHERE status = 'active' ORDER BY id")->fetchAll(PDO::FETCH_ASSOC);
          $total = 0;
          foreach ($companies as $company) {
              $local = (new \App\Core\Database(companyDatabaseConfig($config, $company)))->connection();
              $exists = $local->query("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'finance_employee_personal_expenses'")->fetchColumn();
              if ((int)$exists !== 1) { continue; }
              $stmt = $local->prepare(
                  "SELECT id, operation_date, employee_identity_type, employee_identity_id,
                          employee_name_snapshot, amount, currency,
                          cash_flow_center_id, cash_flow_center_name_snapshot,
                          dds_category_id, dds_category_name_snapshot,
                          linear_route_id, counterparty_name, purpose, comment, status,
                          created_at, updated_at
                     FROM finance_employee_personal_expenses
                    WHERE (operation_date = '2026-08-02' AND amount = 1100.00)
                       OR (employee_name_snapshot LIKE '%Гладких%'
                           AND (counterparty_name LIKE '%ATI%' OR purpose LIKE '%ATI%'))
                    ORDER BY id"
              );
              $stmt->execute();
              $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);
              foreach ($rows as $row) {
                  $total++;
                  echo 'CANDIDATE company_id=' . (int)$company['id'] . ' json=' . json_encode($row, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES) . PHP_EOL;
              }
          }
          echo 'DIAGNOSTIC_CANDIDATES=' . $total . PHP_EOL;
          echo "OBSOLETE_ATI_DIAGNOSTIC_OK\n";
          PHP

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/maintenance_key"
