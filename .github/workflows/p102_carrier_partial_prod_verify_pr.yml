name: P102 Carrier Partial Bank Verify PR

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for exact controlled deploy marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p102_key"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p102_key" "$HOME/.ssh/known_hosts"
          test "$EXPECTED_SHA" = '0415b71b9a1a40a884cf659cbb626f675fe5fb56'
          for attempt in $(seq 1 60); do
            got="$(ssh -p "$PORT" -i "$HOME/.ssh/p102_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
            echo "attempt=$attempt expected=$EXPECTED_SHA deployed=$got"
            if [ "$got" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo 'Timed out waiting for exact production deploy.' >&2
          exit 1

      - name: Read-only target settlement diagnostic
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$PORT" -i "$HOME/.ssh/p102_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            .github/p102/P102_carrier_partial_prod_diag.php "$USER@$HOST:/tmp/P102_carrier_partial_prod_diag.php"
          ssh -p "$PORT" -i "$HOME/.ssh/p102_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd /tmp && /usr/bin/php8.5 /tmp/P102_carrier_partial_prod_diag.php /home/s/spugovxsim/planexp/public_html/erpv2 && rm -f /tmp/P102_carrier_partial_prod_diag.php" | tee P102_RUNTIME.txt
          grep -q 'P102_DIAG_CAPTURED' P102_RUNTIME.txt
          scp -P "$PORT" -i "$HOME/.ssh/p102_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST:/tmp/P102_CARRIER_PARTIAL_DIAG.json" P102_CARRIER_PARTIAL_DIAG.json
          ssh -p "$PORT" -i "$HOME/.ssh/p102_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'rm -f /tmp/P102_CARRIER_PARTIAL_DIAG.json'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P102_carrier_partial_${{ github.event.pull_request.base.sha }}
          path: |
            P102_RUNTIME.txt
            P102_CARRIER_PARTIAL_DIAG.json
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/p102_key"
