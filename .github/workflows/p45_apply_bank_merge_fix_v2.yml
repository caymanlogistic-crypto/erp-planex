name: P45 Apply Bank Merge Fix V2
on:
  push:
    branches:
      - chatgpt/finance-bank-merge-recon-20260814
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/finance-bank-merge-recon-20260814
          fetch-depth: 0
      - name: Stop after bot patch
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [ "$msg" = "fix: unify bank register and reconcile legacy mysql" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply patch
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/p45/apply_bank_merge_fix.py
          php -l app/Service/FinanceBankReconciliationService.php
          php -l app/Http/Controllers/Company/BankFinanceActions/index.php
          php -l app/View/pages/company_bank_accounts.php
          node --check .github/p41/P41_finance_runtime.js
          git diff --check
      - name: Commit patch
        if: steps.guard.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Service/FinanceBankReconciliationService.php app/Http/Controllers/Company/BankFinanceActions/index.php app/View/pages/company_bank_accounts.php .github/p41/P41_finance_runtime.js
          git add -u app/View/partials/company_bank_classification_register.php
          git commit -m 'fix: unify bank register and reconcile legacy mysql'
          git push origin HEAD:chatgpt/finance-bank-merge-recon-20260814
