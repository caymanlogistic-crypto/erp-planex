name: P47 Matching Cash Runtime
on:
  workflow_run:
    workflows: ["ERPv2 Controlled Deploy"]
    types: [completed]
    branches: [chatgpt/production-stabilization-20260802]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Resolve deployed SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact deployed marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          SHA: ${{ steps.sha.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p47"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p47" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p47" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/p47_key
            chmod 600 /tmp/p47_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/p47_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Fail-closed read-only matching cash acceptance
        shell: bash
        run: |
          set -euo pipefail
          node .github/p47/P47_matching_cash_runtime.js 2>&1 | tee P47_RUNTIME.txt
          grep -q 'P47_MATCHING_CASH_RUNTIME_OK' P47_RUNTIME.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P47_matching_cash_runtime_${{ steps.sha.outputs.sha }}
          path: P47_RUNTIME.txt
          if-no-files-found: warn
