name: P48 Cash Ledger Diagnostic
on:
  push:
    branches: [agent/cash-ledger-prod-diagnostic-20260815]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/p48_diag_key
            chmod 600 /tmp/p48_diag_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/p48_diag_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Capture cash page body
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const credentials=JSON.parse(Buffer.from(process.env.P12_CREDENTIALS_B64||'','base64').toString('utf8'));
            const owner=credentials.find(x=>String(x.role).toUpperCase()==='OWNER');
            if(!owner) throw new Error('OWNER missing');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'ru-RU'});
            await page.goto('https://plan-ex.ru/erpv2/login',{waitUntil:'domcontentloaded'});
            await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(owner.username);
            await page.locator('input[type="password"]').fill(owner.password);
            await page.locator('button[type="submit"],input[type="submit"]').first().click();
            await page.waitForTimeout(800);
            const r=await page.goto('https://plan-ex.ru/erpv2/company/finance/cash',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1500);
            console.log('HTTP='+r.status());
            console.log('URL='+page.url());
            console.log('LEDGER_COUNT='+await page.locator('#cash-ledger-table').count());
            console.log('BODY_BEGIN');
            console.log((await page.locator('body').innerText()).slice(0,12000));
            console.log('BODY_END');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
