name: P50 Postdeploy Probe

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact production release marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: d6747c2d6f57c80a411d21bf2320f03f6f1b54bf
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p50-post"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p50-post" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p50-post" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          echo "DEPLOYED_SHA=$got"
          test "$got" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/p50-post-key
            chmod 600 /tmp/p50-post-key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/p50-post-key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Run production cashless UI acceptance
        shell: bash
        run: |
          set -euo pipefail
          node .github/p50/P50_finance_cashless_runtime.js | tee P50_POSTDEPLOY.txt
          grep -q 'P50_FINANCE_CASHLESS_UI_OK' P50_POSTDEPLOY.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P50_postdeploy_probe
          path: P50_POSTDEPLOY.txt
          if-no-files-found: warn
