name: P61 Apply Finance Structure Patch
on:
  push:
    branches: [chatgpt/p61-financial-structure-delete-reset-20260814]
    paths:
      - '.github/p61/P61_apply_patch.py'
      - '.github/workflows/p61_apply_patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/p61/P61_apply_patch.py
      - name: Validate syntax
        run: |
          php -l app/Http/Controllers/Company/FinanceDdsCategoryController.php
          php -l app/Http/Controllers/Company/FinanceDdsCategoryActions/delete_submit.php
          php -l app/Http/Controllers/Company/FinanceDdsCategoryActions/cfu_delete.php
          php -l app/Service/FinanceStructureDeletionService.php
          php -l app/View/pages/company_finance_dds_categories.php
          php -l app/View/partials/company_dds_category_form.php
      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'caymanlogistic-crypto'
          git config user.email 'cayman.logistic@gmail.com'
          git add app/Http/Controllers/Company/FinanceDdsCategoryController.php app/Http/Routes/company_finance_dds_categories.php app/View/pages/company_finance_dds_categories.php app/View/partials/company_dds_category_form.php
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 0; }
          git commit -m 'feat: add hard delete controls for financial structure'
          git push origin HEAD:chatgpt/p61-financial-structure-delete-reset-20260814
