name: P61 Finance Structure Audit
on:
  push:
    branches: [chatgpt/p61-financial-structure-delete-reset-20260814]
    paths:
      - '.github/p61/P61_structure_audit.php'
      - '.github/workflows/p61_structure_audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/p61_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p61_key" "$HOME/.ssh/known_hosts"
      - name: Run read-only audit
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/P61_structure_audit_${GITHUB_RUN_ID}.php"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/p61_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes .github/p61/P61_structure_audit.php "$SSH_USER@$SSH_HOST:$remote"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p61_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "ERPV2_ROOT=/home/s/spugovxsim/planexp/public_html/erpv2 /usr/bin/php8.5 '$remote'" | tee P61_AUDIT.txt
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/p61_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "rm -f '$remote'"
          grep -q 'P61_PLANEX_CFU=' P61_AUDIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P61_finance_structure_audit
          path: P61_AUDIT.txt
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/p61_key"
