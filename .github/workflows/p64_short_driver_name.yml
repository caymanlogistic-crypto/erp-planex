name: P64 Short Driver Name
on:
  push:
    branches: [chatgpt/p64-short-driver-name-linear-20260814]
    paths:
      - '.github/workflows/p64_short_driver_name.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply short driver name display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/View/pages/company_linear_trips.php')
          s = p.read_text(encoding='utf-8')
          needle = '''$paymentDetail = static function (array $payment) use ($paymentAmountCents, $formatCents): string {
              $parts = [
                  $formatCents($paymentAmountCents($payment['amount'] ?? 0)),
              ];
          '''
          if needle not in s:
              raise SystemExit('paymentDetail anchor not found')
          insert = '''$shortDriverName = static function (string $fullName): string {
              $fullName = trim(preg_replace('/\\s+/u', ' ', $fullName));
              if ($fullName === '') {
                  return '';
              }

              $parts = preg_split('/\\s+/u', $fullName) ?: [];
              if (count($parts) < 2) {
                  return $fullName;
              }

              $surname = array_shift($parts);
              $initials = [];
              foreach (array_slice($parts, 0, 2) as $namePart) {
                  $namePart = trim((string) $namePart);
                  if ($namePart !== '') {
                      $initials[] = mb_substr($namePart, 0, 1, 'UTF-8') . '.';
                  }
              }

              return trim($surname . ($initials !== [] ? ' ' . implode(' ', $initials) : ''));
          };

          $shortDriverNames = static function (string $driverNames) use ($shortDriverName): string {
              $driverNames = trim($driverNames);
              if ($driverNames === '') {
                  return '';
              }

              $names = preg_split('/\\s*\\/\\s*/u', $driverNames) ?: [$driverNames];
              return implode(' / ', array_map($shortDriverName, $names));
          };

          '''
          s = s.replace('$paymentDetail = static function (array $payment) use ($paymentAmountCents, $formatCents): string {\n', insert + '$paymentDetail = static function (array $payment) use ($paymentAmountCents, $formatCents): string {\n', 1)
          old = "$executorDrivers = trim((string) ($route['registry_driver_names'] ?? $route['executor_driver_name'] ?? ''));"
          new = "$executorDrivers = $shortDriverNames(trim((string) ($route['registry_driver_names'] ?? $route['executor_driver_name'] ?? '')));"
          if old not in s:
              raise SystemExit('executorDrivers anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          php -l app/View/pages/company_linear_trips.php
          grep -Fq '$executorDrivers = $shortDriverNames' app/View/pages/company_linear_trips.php
          php -r '$f=function(string $fullName):string{$fullName=trim(preg_replace("/\\s+/u"," ",$fullName));$parts=preg_split("/\\s+/u",$fullName)?:[];if(count($parts)<2)return $fullName;$surname=array_shift($parts);$initials=[];foreach(array_slice($parts,0,2) as $p){if($p!=="")$initials[]=mb_substr($p,0,1,"UTF-8").".";}return trim($surname." ".implode(" ",$initials));}; if($f("Бесшапошников Алексей Викторович")!=="Бесшапошников А. В."){exit(1);} echo "P64_FORMAT_OK\n";'
      - name: Commit generated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'caymanlogistic-crypto'
          git config user.email 'cayman.logistic@gmail.com'
          git add app/View/pages/company_linear_trips.php
          git diff --cached --quiet && exit 0
          git commit -m 'ui: abbreviate driver names in linear trip registry'
          git push origin HEAD:chatgpt/p64-short-driver-name-linear-20260814
