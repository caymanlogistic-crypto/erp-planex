name: P71 Simplify Finance UI
on:
  push:
    branches: [chatgpt/p71-finance-ui-simplify-20260814]
permissions:
  contents: write
jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact UI simplification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rules = Path('app/View/pages/company_finance_matching_rules.php')
          s = rules.read_text()
          old = ''' <div class="ux-summary-strip"><div><strong>Логика:</strong> если несколько правил имеют одинаковый максимальный приоритет, операция остаётся на проверку.</div><div><?= count($rules??[]) ?> правил</div></div>
           <div class="ux-kpi-grid cols-3">
            <div class="ux-kpi is-accent"><div class="ux-kpi-label">Активные правила</div><div class="ux-kpi-value"><?= count($activeRules) ?></div><div class="ux-kpi-note">участвуют в разнесении</div></div>
            <div class="ux-kpi"><div class="ux-kpi-label">Автоприменение</div><div class="ux-kpi-value"><?= $autoRules ?></div><div class="ux-kpi-note">применяются без ручного выбора</div></div>
            <div class="ux-kpi is-muted"><div class="ux-kpi-label">Отключены</div><div class="ux-kpi-value"><?= $inactiveRules ?></div><div class="ux-kpi-note">сохранены, но не участвуют</div></div>
           </div>

          '''
          if old not in s:
              raise SystemExit('P71: summary/KPI block not found')
          s = s.replace(old, '', 1)
          old_toolbar = '<div class="table-toolbar"><div class="table-toolbar-left"><strong>Сценарии автоматического разнесения</strong><span class="ux-table-meta" id="rules-visible-count">Показано: <?= count($rules??[]) ?></span></div></div>'
          new_toolbar = '<div class="table-toolbar"><div class="table-toolbar-left"><strong>Сценарии автоматического разнесения</strong></div></div>'
          if old_toolbar not in s:
              raise SystemExit('P71: visible count toolbar not found')
          s = s.replace(old_toolbar, new_toolbar, 1)
          old_js = "const search=document.getElementById('rules-search'),status=document.getElementById('rules-status'),rows=[...document.querySelectorAll('[data-rule-row]')],empty=document.getElementById('rules-empty'),count=document.getElementById('rules-visible-count');"
          new_js = "const search=document.getElementById('rules-search'),status=document.getElementById('rules-status'),rows=[...document.querySelectorAll('[data-rule-row]')],empty=document.getElementById('rules-empty');"
          if old_js not in s:
              raise SystemExit('P71: rules JS declaration not found')
          s = s.replace(old_js, new_js, 1)
          old_filter = "function filterRules(){let q=(search?search.value:'').trim().toLowerCase(),st=status?status.value:'all',shown=0;rows.forEach(r=>{let ok=(!q||(r.dataset.search||'').includes(q))&&(st==='all'||r.dataset.status===st);r.classList.toggle('ux-hidden',!ok);if(ok)shown++});if(empty)empty.classList.toggle('ux-hidden',shown!==0);if(count)count.textContent='Показано: '+shown}"
          new_filter = "function filterRules(){let q=(search?search.value:'').trim().toLowerCase(),st=status?status.value:'all',shown=0;rows.forEach(r=>{let ok=(!q||(r.dataset.search||'').includes(q))&&(st==='all'||r.dataset.status===st);r.classList.toggle('ux-hidden',!ok);if(ok)shown++});if(empty)empty.classList.toggle('ux-hidden',shown!==0)}"
          if old_filter not in s:
              raise SystemExit('P71: rules filter function not found')
          s = s.replace(old_filter, new_filter, 1)
          rules.write_text(s)

          bank = Path('app/View/pages/company_bank_accounts.php')
          b = bank.read_text()
          old_meta = '            <span class="bank-control-meta">Строки: <b><?= count($transactions) ?></b> из <b><?= $txTotal ?></b> (стр. <?= $txPage ?>/<?= $txPages ?>)</span>\n'
          if old_meta not in b:
              raise SystemExit('P71: bank rows counter not found')
          b = b.replace(old_meta, '', 1)
          bank.write_text(b)
          PY
          php -l app/View/pages/company_finance_matching_rules.php
          php -l app/View/pages/company_bank_accounts.php
          ! grep -q 'Активные правила' app/View/pages/company_finance_matching_rules.php
          ! grep -q 'Показано:' app/View/pages/company_finance_matching_rules.php
          ! grep -q 'Строки:' app/View/pages/company_bank_accounts.php
      - name: Commit functional changes and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p71_simplify_finance_ui.yml
          git add app/View/pages/company_finance_matching_rules.php app/View/pages/company_bank_accounts.php
          git commit -m 'ui: simplify bank and matching rules screens'
          git push origin HEAD:chatgpt/p71-finance-ui-simplify-20260814
