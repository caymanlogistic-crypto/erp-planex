name: P72 Apply Navigation And Bank Style
on:
  push:
    branches: [chatgpt/p72-bank-rules-ux-counter-20260814]
    paths: ['.github/workflows/p72_apply_navigation_and_style.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          layout = Path('app/View/layouts/main.php')
          s = layout.read_text()
          anchor = "$bankStatementSettingsActive = str_starts_with($requestPath, '/company/bank-statement-settings');\n"
          insert = anchor + "\n$navigationCounters = ['bank_attention' => 0];\nif ($roleCode === 'company_owner' && (int)$companyId > 0) {\n    $navigationCounters = \\App\\Service\\NavigationCounterService::forCompany(\n        $config,\n        $db,\n        (int)$companyId,\n        (isset($company) && is_array($company)) ? $company : null\n    );\n}\n$bankAttentionCount = max(0, (int)($navigationCounters['bank_attention'] ?? 0));\n"
          if '$bankAttentionCount = max(' not in s:
              if anchor not in s:
                  raise SystemExit('P72 layout counter anchor not found')
              s = s.replace(anchor, insert, 1)

          nav_old = '                    <span class="nav-label">Выписки со счёта</span>\n                </a>'
          nav_new = '                    <span class="nav-label">Выписки со счёта</span>\n                    <?php if ($bankAttentionCount > 0): ?><span class="nav-count is-alert" title="Требуют разнесения"><?= $bankAttentionCount > 999 ? \'999+\' : $bankAttentionCount ?></span><?php endif; ?>\n                </a>'
          if 'title="Требуют разнесения"' not in s:
              if nav_old not in s:
                  raise SystemExit('P72 bank nav anchor not found')
              s = s.replace(nav_old, nav_new, 1)
          layout.write_text(s)

          css = Path('public/assets/css/erp-ui.css')
          c = css.read_text()
          patch = '''\n\n/* P72 — persistent navigation attention counters and muted bank summary bar. */\n.nav-item.is-active .nav-count.is-alert,\n.nav-item.is-parent .nav-count.is-alert,\n.nav-item.is-parent.is-open .nav-count.is-alert {\n  background:rgba(153,46,38,.22) !important;\n  border-color:rgba(153,46,38,.38) !important;\n  color:rgba(220,100,90,.88) !important;\n}\n.bank-transactions-card > .bank-controls {\n  background:var(--surface-muted);\n}\n'''
          if 'P72 — persistent navigation attention counters' not in c:
              c += patch
          css.write_text(c)
          PY
          php -l app/View/layouts/main.php
          php -l app/Service/NavigationCounterService.php
          grep -q 'title="Требуют разнесения"' app/View/layouts/main.php
          grep -q 'bank-transactions-card > .bank-controls' public/assets/css/erp-ui.css
      - name: Commit functional patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p72_apply_navigation_and_style.yml
          git add app/View/layouts/main.php public/assets/css/erp-ui.css
          git commit -m 'ui: add bank attention counter and muted summary bar'
          git push origin HEAD:chatgpt/p72-bank-rules-ux-counter-20260814
