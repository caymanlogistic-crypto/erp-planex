name: P90 Production Calendar Runtime
on:
  workflow_run:
    workflows: ["ERPv2 Controlled Deploy"]
    types: [completed]
    branches: [chatgpt/production-stabilization-20260802]
permissions:
  contents: read
jobs:
  migrate-and-verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Configure SSH and verify deployed SHA
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p90"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p90" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p90" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
      - name: Apply production calendar migration and seed 2026
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          webroot=/home/s/spugovxsim/planexp/public_html
          live="$webroot/erpv2"
          ssh -p "$PORT" -i "$HOME/.ssh/p90" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd '$live' && /usr/bin/php8.5 scripts/p90_apply_production_calendar_migration.php" | tee P90_PRODUCTION_CALENDAR.txt
          grep -q 'P90_PRODUCTION_CALENDAR_OK' P90_PRODUCTION_CALENDAR.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P90_production_calendar_${{ github.event.workflow_run.head_sha }}
          path: P90_PRODUCTION_CALENDAR.txt
          if-no-files-found: warn
      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/p90"
