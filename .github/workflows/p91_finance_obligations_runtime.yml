name: P91 Finance Obligations Runtime
on:
  workflow_run:
    workflows: ["ERPv2 Controlled Deploy"]
    types: [completed]
    branches: [chatgpt/production-stabilization-20260802]
permissions:
  contents: read
jobs:
  migrate-and-verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Configure SSH and verify deployed SHA
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p91"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p91" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p91" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          test "$got" = "$SHA"
      - name: Apply finance obligations migration and synchronize
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          live="/home/s/spugovxsim/planexp/public""_html/erpv2"
          ssh -p "$PORT" -i "$HOME/.ssh/p91" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd '$live' && /usr/bin/php8.5 -l scripts/p91_apply_finance_obligations_migration.php && /usr/bin/php8.5 scripts/p91_apply_finance_obligations_migration.php" | tee P91_FINANCE_OBLIGATIONS.txt
          grep -q 'No syntax errors detected' P91_FINANCE_OBLIGATIONS.txt
          grep -q 'P91_FINANCE_OBLIGATIONS_OK' P91_FINANCE_OBLIGATIONS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P91_finance_obligations_${{ github.event.workflow_run.head_sha }}
          path: P91_FINANCE_OBLIGATIONS.txt
          if-no-files-found: warn
      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/p91"
