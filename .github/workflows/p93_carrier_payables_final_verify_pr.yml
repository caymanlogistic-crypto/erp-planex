name: P93 Carrier Payables Final Production Verify

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Wait for exact controlled deploy marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p93_final"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p93_final" "$HOME/.ssh/known_hosts"
          test "$EXPECTED_SHA" = '3e036fceb285a38df00e186640b1a8a71a521d6f'
          got=''
          for attempt in $(seq 1 32); do
            got="$(ssh -p "$PORT" -i "$HOME/.ssh/p93_final" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
            echo "attempt=$attempt expected=$EXPECTED_SHA deployed=$got"
            [ "$got" = "$EXPECTED_SHA" ] && break
            sleep 15
          done
          test "$got" = "$EXPECTED_SHA"

      - name: Verify deployed carrier runtime files
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$PORT" -i "$HOME/.ssh/p93_final" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          LIVE=/home/s/spugovxsim/planexp/public_html/erpv2
          test -f "$LIVE/app/Service/FinancePayablesReportService.php"
          test -f "$LIVE/app/Service/FinanceInvoiceSettlementHistoryService.php"
          test -f "$LIVE/app/Http/Controllers/Company/InvoiceActions/payables.php"
          test -f "$LIVE/app/Http/Controllers/Company/InvoiceActions/pay_cash_submit.php"
          grep -q 'FinancePayablesReportService.php' "$LIVE/app/Http/Routes/company_finance_invoices.php"
          grep -q 'FinanceInvoiceSettlementHistoryService.php' "$LIVE/app/Http/Routes/company_finance_invoices.php"
          echo 'P93_FINAL_RUNTIME_FILES_OK'
          REMOTE

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            printf '%s\n' "$KEY" > /tmp/p93_key
            chmod 600 /tmp/p93_key
            cred="$(python .github/p11/P11_decrypt_credentials.py --key /tmp/p93_key --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"

      - name: Read-only carrier payables visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          node .github/p93/P93_carrier_payables_visual.js 2>&1 | tee P93_RUNTIME.txt
          grep -q 'P93_CARRIER_PAYABLES_VISUAL_OK' P93_RUNTIME.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P93_final_carrier_payables_${{ github.event.pull_request.base.sha }}
          path: |
            P93_RUNTIME.txt
            P93_VISUAL.json
            P93_screens/*.png
          if-no-files-found: warn
