name: P93 Carrier Payables Production Verify PR

on:
  pull_request:
    branches: [chatgpt/production-stabilization-20260802]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production exact canonical marker
        env:
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/p93_verify"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/p93_verify" "$HOME/.ssh/known_hosts"
          got="$(ssh -p "$PORT" -i "$HOME/.ssh/p93_verify" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          echo "expected=$EXPECTED_SHA"
          echo "deployed=$got"
          test "$EXPECTED_SHA" = '36f73fcf0940717f40802be70d3fbbb789f0e6f3'
          test "$got" = "$EXPECTED_SHA"

      - name: Diagnose deployed files and P07 copy strategy
        env:
          HOST: ${{ secrets.ERPV2_SSH_HOST }}
          PORT: ${{ secrets.ERPV2_SSH_PORT }}
          USER: ${{ secrets.ERPV2_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$PORT" -i "$HOME/.ssh/p93_verify" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/home/s/spugovxsim/planexp
          LIVE="$ROOT/public_html/erpv2"
          echo '--- deployed file presence ---'
          for f in \
            app/Service/FinancePayablesReportService.php \
            app/Service/FinanceInvoiceSettlementHistoryService.php \
            app/Http/Controllers/Company/InvoiceActions/payables.php \
            app/Http/Controllers/Company/InvoiceActions/pay_cash_submit.php \
            app/View/pages/company_finance_payables.php \
            app/View/pages/company_finance_invoices.php; do
              if [ -f "$LIVE/$f" ]; then printf 'PRESENT %s %s\n' "$f" "$(sha256sum "$LIVE/$f" | awk '{print $1}')"; else printf 'MISSING %s\n' "$f"; fi
          done
          echo '--- P07 deploy engine ---'
          sed -n '1,320p' "$ROOT/deploy/P07_deploy_erpv2.sh"
          REMOTE
