name: P93 Invoice Obligations Debug
on:
  push:
    branches: [chatgpt/invoice-obligations-debug-20260816]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$KEY" > "$HOME/.ssh/p93_credentials"
            chmod 600 "$HOME/.ssh/p93_credentials"
            cred="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p93_credentials" --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Inspect obligations response
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const credentials=JSON.parse(Buffer.from(process.env.P12_CREDENTIALS_B64,'base64').toString('utf8'));
            const owner=credentials.find(x=>String(x.role).toUpperCase()==='OWNER');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'ru-RU'});
            await page.goto('https://plan-ex.ru/erpv2/login');
            await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(owner.username);
            await page.locator('input[type="password"]').fill(owner.password);
            await page.locator('button[type="submit"],input[type="submit"]').first().click();
            await page.waitForLoadState('networkidle');
            await page.goto('https://plan-ex.ru/erpv2/company/finance/invoices',{waitUntil:'networkidle'});
            const info=await page.evaluate(async()=>{
              const sel=document.querySelector('#invoice-create-modal select[name="counterparty_entity_id"]');
              const opt=sel ? Array.from(sel.options).find(o=>o.value) : null;
              if(!opt) return {error:'NO_CLIENT_OPTION'};
              const url='/erpv2/company/finance/invoices/obligations?direction=OUTGOING&counterparty='+encodeURIComponent('client:'+opt.value);
              const r=await fetch(url,{headers:{Accept:'application/json'}});
              return {url,status:r.status,contentType:r.headers.get('content-type'),body:await r.text(),clientId:opt.value,clientText:opt.textContent};
            });
            console.log('P93_RESPONSE='+JSON.stringify(info));
            await browser.close();
            if(info.status!==200) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE