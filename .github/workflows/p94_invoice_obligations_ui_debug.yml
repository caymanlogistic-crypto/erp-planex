name: P94 Invoice Obligations UI Debug
on:
  push:
    branches: [chatgpt/p94-invoice-obligations-ui-debug-20260816]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$KEY" > "$HOME/.ssh/p94_credentials"
            chmod 600 "$HOME/.ssh/p94_credentials"
            cred="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p94_credentials" --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Capture actual UI request
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const credentials=JSON.parse(Buffer.from(process.env.P12_CREDENTIALS_B64,'base64').toString('utf8'));
            const owner=credentials.find(x=>String(x.role).toUpperCase()==='OWNER');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080},locale:'ru-RU'});
            const events=[];
            page.on('requestfailed', r=>{ if(r.url().includes('/finance/invoices/obligations')) events.push({kind:'failed',url:r.url(),failure:r.failure()}); });
            page.on('response', async r=>{ if(r.url().includes('/finance/invoices/obligations')) { let body=''; try{body=await r.text()}catch(e){body='READ_ERROR '+e.message} events.push({kind:'response',url:r.url(),status:r.status(),body}); }});
            page.on('console', m=>events.push({kind:'console',type:m.type(),text:m.text()}));
            page.on('pageerror', e=>events.push({kind:'pageerror',text:e.message}));
            await page.goto('https://plan-ex.ru/erpv2/login');
            await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(owner.username);
            await page.locator('input[type="password"]').fill(owner.password);
            await page.locator('button[type="submit"],input[type="submit"]').first().click();
            await page.waitForLoadState('networkidle');
            await page.goto('https://plan-ex.ru/erpv2/company/finance/invoices',{waitUntil:'networkidle'});
            await page.locator('[data-open-modal="invoice-create-modal"]').click();
            const modal=page.locator('#invoice-create-modal.is-open');
            const cp=modal.locator('select[name="counterparty_entity_id"]');
            const id=await cp.locator('option:not([value=""])').first().getAttribute('value');
            await cp.selectOption(id);
            await page.waitForTimeout(1800);
            console.log('BASE='+await page.evaluate(()=>window.getErpBasePath?window.getErpBasePath():'NO_FN'));
            console.log('CP='+id);
            console.log('BOX='+JSON.stringify((await modal.locator('.js-obligations-box').innerText()).trim()));
            console.log('EVENTS='+JSON.stringify(events));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE