name: P95 Settlement State Readonly
on:
  push:
    branches: [chatgpt/p95-settlement-state-readonly-20260817]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve OWNER credentials
        env:
          CRED: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cred="${CRED:-}"
          if [ -z "$cred" ]; then
            git fetch origin p11-audit-v2:refs/remotes/origin/p11-audit-v2
            mkdir -p .github/p11
            git show origin/p11-audit-v2:.github/p11/P11_decrypt_credentials.py > .github/p11/P11_decrypt_credentials.py
            git show origin/p11-audit-v2:.github/p11/P11_runtime_credentials.enc.json > .github/p11/P11_runtime_credentials.enc.json
            python -m pip install --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$KEY" > "$HOME/.ssh/p95_credentials"
            chmod 600 "$HOME/.ssh/p95_credentials"
            cred="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/p95_credentials" --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          test -n "$cred"
          echo "::add-mask::$cred"
          echo "P12_CREDENTIALS_B64=$cred" >> "$GITHUB_ENV"
      - name: Verify production settlement presentation
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const credentials=JSON.parse(Buffer.from(process.env.P12_CREDENTIALS_B64,'base64').toString('utf8'));
            const owner=credentials.find(x=>String(x.role).toUpperCase()==='OWNER');
            ok(owner,'OWNER credentials');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080},locale:'ru-RU'});
            await page.goto('https://plan-ex.ru/erpv2/login',{waitUntil:'domcontentloaded'});
            await page.locator('input[name="username"],input[name="email"],input[type="text"]').first().fill(owner.username);
            await page.locator('input[type="password"]').fill(owner.password);
            await page.locator('button[type="submit"],input[type="submit"]').first().click();
            await page.waitForLoadState('networkidle');
            ok(!page.url().includes('/login'),'login failed');

            await page.goto('https://plan-ex.ru/erpv2/company/finance/invoices',{waitUntil:'networkidle'});
            const invoiceRow=page.locator('table.table tbody tr').filter({hasText:'26-102'}).first();
            ok(await invoiceRow.count()===1,'invoice 26-102 not found');
            const invoiceText=(await invoiceRow.innerText()).replace(/\s+/g,' ').trim();
            console.log('INVOICE_ROW='+invoiceText);
            ok(invoiceText.includes('230 000,00'),'invoice amount missing');
            ok(invoiceText.includes('Оплачен'),'invoice 26-102 must display paid');

            await page.goto('https://plan-ex.ru/erpv2/company/finance/bank-accounts?classification_status=UNALLOCATED',{waitUntil:'networkidle'});
            const unallocatedBody=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            const stale=unallocatedBody.includes('ЭКОВТОРРЕСУРС') && unallocatedBody.includes('26-102');
            console.log('UNALLOCATED_HAS_26_102='+stale);
            ok(!stale,'settled invoice payment still appears as unallocated');

            await page.goto('https://plan-ex.ru/erpv2/company/finance/bank-accounts?classification_status=AUTO',{waitUntil:'networkidle'});
            const autoBody=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            const inAuto=autoBody.includes('ЭКОВТОРРЕСУРС') && autoBody.includes('26-102');
            console.log('AUTO_HAS_26_102='+inAuto);
            ok(inAuto,'settled invoice payment not shown as automatically allocated');
            console.log('P95_SETTLEMENT_STATE_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE