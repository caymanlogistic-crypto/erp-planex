name: Production Calendar Regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_production_calendar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Service/ProductionCalendarService.php
          php -l app/Http/Controllers/Company/ProductionCalendarController.php
          php -l app/Http/Routes/company_production_calendar.php
          php -l app/View/pages/company_production_calendar.php
          php -l app/Support/runtime_ui_hotfixes.php
          php -l app/Support/entrypoint_dependencies.php
          php -l public/index.php
          php -l scripts/p90_apply_production_calendar_migration.php
          php -l tests/production_calendar_architecture_test.php
          php -l tests/production_calendar_behavioral_test.php
      - name: Architecture regression
        run: php tests/production_calendar_architecture_test.php
      - name: Behavioral regression
        env:
          PRODUCTION_CALENDAR_DB_HOST: 127.0.0.1
          PRODUCTION_CALENDAR_DB_PORT: 3306
          PRODUCTION_CALENDAR_DB_NAME: erp_production_calendar_test
          PRODUCTION_CALENDAR_DB_USER: root
          PRODUCTION_CALENDAR_DB_PASSWORD: root
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_mysql
          php tests/production_calendar_behavioral_test.php 2>&1 | tee production_calendar_behavioral.txt
          grep -q 'PRODUCTION_CALENDAR_BEHAVIOR_OK' production_calendar_behavioral.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production_calendar_${{ github.sha }}
          path: production_calendar_behavioral.txt
          if-no-files-found: warn
