name: Trace linear trip edit modal

on:
  push:
    branches:
      - verify-linear-trip-date-modes-20260813
    paths:
      - '.github/workflows/trace_linear_trip_edit_modal.yml'

permissions:
  contents: read

env:
  BASE_URL: https://plan-ex.ru/erpv2/

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Resolve owner credentials
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          if [ -z "$credentials" ]; then
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/tc"
            chmod 600 "$HOME/.ssh/tc"
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/tc" --input .github/p11/P11_runtime_credentials.enc.json)"
          fi
          echo "::add-mask::$credentials"
          printf 'P11_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"
      - name: Trace click transition
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'); const BASE=process.env.BASE_URL; const creds=JSON.parse(Buffer.from(process.env.P11_CREDENTIALS_B64,'base64').toString('utf8')); const owner=creds.find(x=>String(x.role||'').toUpperCase()==='OWNER');
          (async()=>{let b;try{b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1920,height:1080},locale:'ru-RU',timezoneId:'Europe/Moscow',ignoreHTTPSErrors:true});const p=await c.newPage();const ev=[];p.on('response',r=>{if(r.url().includes('/company/trips/linear/'))ev.push('HTTP '+r.status()+' '+r.url())});p.on('pageerror',e=>ev.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error')ev.push('CONSOLE '+m.text())});
          await p.goto(new URL('login',BASE).href,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('input[name="username"],input[name="email"],input[type="email"],input[type="text"]').first().fill(owner.username);await p.locator('input[type=password]').first().fill(owner.password);await p.locator('button[type=submit],input[type=submit]').first().click();await p.waitForTimeout(900);await p.goto(new URL('company/trips/linear',BASE).href,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(700);let row=p.locator('tr[data-linear-route-id="9"]').first();if(!(await row.count()))row=p.locator('tr[data-linear-route-id]').first();const id=await row.getAttribute('data-linear-route-id');await row.dblclick();const modal=p.locator('#linear-trip-view-modal');await modal.locator('.trip-view-table').waitFor({state:'visible',timeout:10000});
          await p.evaluate(()=>{window.__tripTrace=[];const m=document.getElementById('linear-trip-view-modal');const oldClose=window.closeModal;window.closeModal=function(id){if(id==='linear-trip-view-modal')window.__tripTrace.push({kind:'closeModal',stack:(new Error()).stack});return oldClose.apply(this,arguments)};new MutationObserver(()=>window.__tripTrace.push({kind:'class',value:m.className,time:Date.now()})).observe(m,{attributes:true,attributeFilter:['class']});});
          console.log('BEFORE='+JSON.stringify(await p.evaluate(()=>({cls:document.getElementById('linear-trip-view-modal').className,entity:document.getElementById('linear-trip-view-modal')._entityId,ctrl:!!(window.ModalShell&&ModalShell.get('linearTrip'))}))));
          await modal.locator('[data-linear-trip-edit-btn]').click({timeout:5000});
          for(const ms of [100,300,700,1500,3000,7000]){await p.waitForTimeout(ms-(ms===100?0:({300:100,700:300,1500:700,3000:1500,7000:3000}[ms]||0)));const snap=await p.evaluate(()=>{const m=document.getElementById('linear-trip-view-modal');return{cls:m?m.className:null,form:!!(m&&m.querySelector('#linear-trip-edit-form')),loading:!!(m&&m.querySelector('.driver-modal-loading')),text:m?(m.innerText||'').slice(0,120):'',trace:window.__tripTrace}});console.log('SNAP_'+ms+'='+JSON.stringify(snap));if(snap.form)break;}
          console.log('EVENTS='+JSON.stringify(ev));const final=await p.evaluate(()=>{const m=document.getElementById('linear-trip-view-modal');return{cls:m&&m.className,form:!!(m&&m.querySelector('#linear-trip-edit-form')),trace:window.__tripTrace}});if(!final.form)throw Error('edit form not inserted');if(!String(final.cls).includes('is-open'))throw Error('modal closed during edit transition');}finally{if(b)await b.close().catch(()=>{})}})().catch(e=>{console.error(e.stack||String(e));process.exit(1)});
          NODE
