name: Verify entity CRUD

on:
  push:
    branches: [verify-entity-crud-20260813]
    paths: ['.github/workflows/verify_entity_crud.yml']

permissions:
  contents: read

env:
  EXPECTED_DEPLOY_HEAD: b589ae59bf8df860154b0bf40330422638bc8988
  BASE_URL: http://planexp.ru/erpv2/

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed SHA
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERPV2_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERPV2_SSH_HOST }}
          SSH_PORT: ${{ secrets.ERPV2_SSH_PORT }}
          SSH_USER: ${{ secrets.ERPV2_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/entity_verify"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/entity_verify" "$HOME/.ssh/known_hosts"
          deployed="$(ssh -p "$SSH_PORT" -i "$HOME/.ssh/entity_verify" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'cat /home/s/spugovxsim/planexp/deploy/P07_erpv2_deployed_commit.txt')"
          echo "deployed=$deployed"
          test "$deployed" = "$EXPECTED_DEPLOY_HEAD"
          rm -f "$HOME/.ssh/entity_verify"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Resolve owner credentials
        shell: bash
        env:
          SECRET_CREDENTIALS: ${{ secrets.P11_RUNTIME_CREDENTIALS_B64 }}
          PRIVATE_KEY: ${{ secrets.ERPV2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          credentials="${SECRET_CREDENTIALS:-}"
          if [ -z "$credentials" ]; then
            python -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.3'
            install -d -m 700 "$HOME/.ssh"
            printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/entity_credentials"
            chmod 600 "$HOME/.ssh/entity_credentials"
            credentials="$(python .github/p11/P11_decrypt_credentials.py --key "$HOME/.ssh/entity_credentials" --input .github/p11/P11_runtime_credentials.enc.json)"
            rm -f "$HOME/.ssh/entity_credentials"
          fi
          test -n "$credentials"
          echo "::add-mask::$credentials"
          printf 'P11_CREDENTIALS_B64=%s\n' "$credentials" >> "$GITHUB_ENV"

      - name: Verify drivers contractors and vehicles
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const { chromium } = require('playwright');
          const BASE = process.env.BASE_URL;
          const creds = JSON.parse(Buffer.from(process.env.P11_CREDENTIALS_B64 || '', 'base64').toString('utf8'));
          const owner = creds.find(x => String(x.role || '').toUpperCase() === 'OWNER');
          if (!owner) throw new Error('OWNER credentials unavailable');
          const suffix = String(Date.now()).slice(-7);
          const qa = {
            driverName: 'QA DRIVER ' + suffix,
            contractorName: 'ООО QA CONTRACTOR ' + suffix,
            plate: 'А' + suffix.slice(-3) + 'ВС99',
          };
          let driverId = 0, contractorId = 0, vehicleId = 0;

          const must = (cond, msg) => { if (!cond) throw new Error(msg); };
          const esc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1920,height:1080}, locale:'ru-RU', timezoneId:'Europe/Moscow', ignoreHTTPSErrors:true});
            const page = await context.newPage();
            const browserErrors = [];
            page.on('pageerror', e => browserErrors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') browserErrors.push('console: ' + m.text()); });

            async function login() {
              await page.goto(new URL('login', BASE).href, {waitUntil:'domcontentloaded', timeout:45000});
              const user = page.locator('input[name="username"],input[name="email"],input[type="email"],input[type="text"]').first();
              const pass = page.locator('input[type="password"]').first();
              await user.fill(owner.username); await pass.fill(owner.password);
              await Promise.all([page.waitForLoadState('domcontentloaded').catch(()=>{}), page.locator('button[type="submit"],input[type="submit"]').first().click()]);
              await page.waitForTimeout(700);
              must(!/\/login(?:[/?#]|$)/i.test(page.url()), 'authentication failed');
            }
            async function reqPost(path, form) {
              const r = await context.request.post(new URL(path.replace(/^\//,''), BASE).href, {form});
              const text = await r.text();
              must(r.ok(), path + ' HTTP ' + r.status() + ': ' + text.slice(0,400));
              return text;
            }
            async function reqGet(path) {
              const r = await context.request.get(new URL(path.replace(/^\//,''), BASE).href);
              const text = await r.text();
              must(r.ok(), path + ' HTTP ' + r.status());
              return text;
            }
            async function findRow(path, selector, needle, idAttr) {
              await page.goto(new URL(path, BASE).href, {waitUntil:'domcontentloaded', timeout:45000});
              const row = page.locator(selector).filter({hasText:needle}).first();
              await row.waitFor({state:'attached', timeout:10000});
              return Number(await row.getAttribute(idAttr) || 0);
            }

            try {
              await login();

              // DRIVER: create form contract + create persistence.
              await page.goto(new URL('company/drivers', BASE).href, {waitUntil:'domcontentloaded'});
              await page.getByRole('button', {name:/Создать водителя|Добавить нового водителя/i}).first().click();
              const driverForm = page.locator('#driver-create-form');
              await driverForm.waitFor({state:'visible'});
              for (const field of ['full_name','passport_issue_date','license_issue_date','comments']) must(await driverForm.locator('[name="'+field+'"]').count() > 0, 'driver create missing ' + field);
              await page.evaluate(() => closeModal('driver-create-modal'));

              await reqPost('/company/drivers/modal-create', {
                full_name: qa.driverName,
                phone: '+7999000' + suffix.slice(-4),
                passport_number: '4500123456',
                passport_department_code: '770001',
                passport_issued_by: 'QA МВД',
                passport_issue_date: '01.08.2026',
                license_number: '7712345678',
                license_issue_date: '02.08.2026',
                snils: '12345678901',
                email: 'qa.' + suffix + '@example.com',
                comments: 'QA driver create ' + suffix
              });
              driverId = await findRow('company/drivers', 'tr[data-driver-id]', qa.driverName, 'data-driver-id');
              must(driverId > 0, 'driver create did not persist');
              let driverView = await reqGet('/company/drivers/' + driverId + '/modal-view');
              for (const value of [qa.driverName,'01.08.2026','02.08.2026','QA driver create ' + suffix]) must(driverView.includes(value), 'driver view missing ' + value);
              let driverEdit = await reqGet('/company/drivers/' + driverId + '/modal-edit');
              must(driverEdit.includes('value="01.08.2026"'), 'driver edit passport date is not DD.MM.YYYY');
              must(driverEdit.includes('value="02.08.2026"'), 'driver edit license date is not DD.MM.YYYY');
              await reqPost('/company/drivers/' + driverId + '/modal-edit', {
                full_name: qa.driverName,
                phone: '+7999000' + suffix.slice(-4),
                passport_number: '4500123456', passport_department_code:'770001', passport_issued_by:'QA МВД EDIT', passport_issue_date:'03.08.2026',
                license_number:'7712345678', license_issue_date:'04.08.2026', snils:'12345678901', email:'qa.'+suffix+'@example.com', comments:'QA driver edit '+suffix
              });
              driverView = await reqGet('/company/drivers/' + driverId + '/modal-view');
              for (const value of ['QA МВД EDIT','03.08.2026','04.08.2026','QA driver edit ' + suffix]) must(driverView.includes(value), 'driver edit not persisted: ' + value);

              // CONTRACTOR: create, view full requisites, edit, contacts.
              await page.goto(new URL('company/contractors', BASE).href, {waitUntil:'domcontentloaded'});
              await page.getByRole('button', {name:/Создать перевозчика/i}).first().click();
              const contractorForm = page.locator('#le-create-form');
              await contractorForm.waitFor({state:'visible'});
              for (const field of ['name','inn','director_full_name','bank_account','bank_name','bank_bik','bank_corr_account']) must(await contractorForm.locator('[name="'+field+'"]').count() > 0, 'contractor create missing ' + field);
              await page.evaluate(() => closeModal('le-contractor-modal'));

              const inn = '77' + suffix.padStart(8,'0').slice(-8);
              await reqPost('/company/contractors/create', {
                is_modal:'1', name:qa.contractorName, inn, contractor_type:'legal_entity', kpp:'770101001', ogrn:'1027700132195',
                director_full_name:'QA Руководитель', director_position:'Директор', legal_address:'QA юридический адрес', physical_address:'QA фактический адрес',
                bank_account:'40702810123456789012', bank_bik:'044525225', bank_name:'QA Банк', bank_corr_account:'30101810400000000225', comments:'QA contractor create '+suffix,
                'contacts[0][contact_person]':'QA Контакт', 'contacts[0][phone]':'+79991112233', 'contacts[0][email]':'contract.'+suffix+'@example.com', 'contacts[0][comment]':'QA contact comment', 'contacts[0][is_primary]':'1', 'contacts[0][is_document_email]':'1'
              });
              contractorId = await findRow('company/contractors', 'tr[data-contractor-id]', qa.contractorName, 'data-contractor-id');
              must(contractorId > 0, 'contractor create did not persist');
              let contractorView = await reqGet('/company/contractors/' + contractorId + '/modal-view');
              for (const value of ['QA Руководитель','Директор','40702810123456789012','QA Банк','044525225','30101810400000000225','QA Контакт','QA contact comment']) must(contractorView.includes(value), 'contractor view missing ' + value);
              let contractorEdit = await reqGet('/company/contractors/' + contractorId + '/modal-edit');
              for (const value of ['QA Руководитель','QA Банк','QA Контакт']) must(contractorEdit.includes(value), 'contractor edit missing ' + value);
              await reqPost('/company/contractors/' + contractorId + '/modal-edit', {
                name:qa.contractorName, inn, contractor_type:'legal_entity', kpp:'770101001', ogrn:'1027700132195',
                director_full_name:'QA Руководитель EDIT', director_position:'Генеральный директор', legal_address:'QA юридический адрес 2', physical_address:'QA фактический адрес 2',
                bank_account:'40702810123456789012', bank_bik:'044525225', bank_name:'QA Банк EDIT', bank_corr_account:'30101810400000000225', comments:'QA contractor edit '+suffix,
                'contacts[0][contact_person]':'QA Контакт EDIT', 'contacts[0][phone]':'+79991112233', 'contacts[0][email]':'contract.'+suffix+'@example.com', 'contacts[0][comment]':'QA contact edited', 'contacts[0][is_primary]':'1', 'contacts[0][is_document_email]':'1'
              });
              contractorView = await reqGet('/company/contractors/' + contractorId + '/modal-view');
              for (const value of ['QA Руководитель EDIT','QA Банк EDIT','QA Контакт EDIT','QA contact edited']) must(contractorView.includes(value), 'contractor edit not persisted: ' + value);

              // VEHICLE: create fields, create persistence, view, edit persistence.
              await page.goto(new URL('company/vehicle-sets', BASE).href, {waitUntil:'domcontentloaded'});
              await page.getByRole('button', {name:/Добавить новый транспорт/i}).first().click();
              const vehicleForm = page.locator('#vehicle-set-create-form');
              await vehicleForm.waitFor({state:'visible'});
              await vehicleForm.locator('select[name="set_type"]').selectOption('single');
              await page.waitForTimeout(200);
              for (const f of ['brand','model','plate_number','vin','diagnostic_card_number','diagnostic_card_date']) must(await vehicleForm.locator('[name="units[primary]['+f+']"]').count() > 0, 'vehicle create missing ' + f);
              await page.evaluate(() => closeModal('vehicle-set-create-modal'));

              await reqPost('/company/vehicle-sets/create', {
                set_type:'single', status:'active', comments:'QA vehicle create '+suffix,
                'units[primary][unit_type]':'truck', 'units[primary][brand]':'QA BRAND', 'units[primary][model]':'MODEL '+suffix,
                'units[primary][plate_number]':qa.plate, 'units[primary][vin]':'X9F1234567890' + suffix.slice(-4),
                'units[primary][diagnostic_card_number]':'123456789012345', 'units[primary][diagnostic_card_date]':'05.08.2026',
                'units[primary][capacity_tons]':'20,5', 'units[primary][volume_m3]':'86,5'
              });
              vehicleId = await findRow('company/vehicle-sets', 'tr[data-vehicle-set-id]', qa.plate, 'data-vehicle-set-id');
              must(vehicleId > 0, 'vehicle create did not persist');
              let vehicleView = await reqGet('/company/vehicle-sets/' + vehicleId + '/modal-view');
              for (const value of ['QA BRAND','MODEL '+suffix,'05.08.2026','20,5','86,5']) must(vehicleView.includes(value), 'vehicle view missing ' + value);
              let vehicleEdit = await reqGet('/company/vehicle-sets/' + vehicleId + '/modal-edit');
              must(vehicleEdit.includes('value="05.08.2026"'), 'vehicle edit date not displayed as DD.MM.YYYY');
              await reqPost('/company/vehicle-sets/' + vehicleId + '/modal-edit', {
                set_type:'single', status:'active', comments:'QA vehicle edit '+suffix,
                'units[primary][brand]':'QA BRAND EDIT', 'units[primary][model]':'MODEL EDIT '+suffix, 'units[primary][plate_number]':qa.plate,
                'units[primary][vin]':'X9F1234567890' + suffix.slice(-4), 'units[primary][diagnostic_card_number]':'987654321012345',
                'units[primary][diagnostic_card_date]':'06.08.2026', 'units[primary][capacity_tons]':'21,5', 'units[primary][volume_m3]':'87,5'
              });
              vehicleView = await reqGet('/company/vehicle-sets/' + vehicleId + '/modal-view');
              for (const value of ['QA BRAND EDIT','MODEL EDIT '+suffix,'987654321012345','06.08.2026','21,5','87,5','QA vehicle edit '+suffix]) must(vehicleView.includes(value), 'vehicle edit not persisted: ' + value);

              console.log(JSON.stringify({success:true, driverId, contractorId, vehicleId, browserErrors}, null, 2));
              must(browserErrors.length === 0, 'browser errors: ' + browserErrors.join(' | '));
            } finally {
              if (driverId) await context.request.post(new URL('company/drivers/'+driverId+'/modal-delete', BASE).href).catch(()=>{});
              if (contractorId) await context.request.post(new URL('company/contractors/'+contractorId+'/modal-archive', BASE).href).catch(()=>{});
              if (vehicleId) await context.request.post(new URL('company/vehicle-sets/'+vehicleId+'/modal-archive', BASE).href).catch(()=>{});
              await browser.close();
            }
          })().catch(err => { console.error(err.stack || err); process.exit(1); });
          NODE
